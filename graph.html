<title>理财词图</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* ── 配色：账本纸 + 墨。浅色是默认，深色是重定义同一批 token ── */
:root{
  --paper:#F2F5F2; --card:#FFFFFF; --card-2:#F7F9F7;
  --ink:#141C18; --ink-2:#4A5751; --ink-3:#7C8A83;
  --rule:#DDE3DE; --rule-2:#EAEFEA;
  --accent:#1B6B4C;
  --dot:#D7DED8;
  --shadow:0 1px 2px rgba(20,28,24,.06),0 8px 28px -12px rgba(20,28,24,.22);
  --f0:#3D6FB4; --f1:#12897A; --f2:#C4761A; --f3:#B44A73; --f4:#6E5AA8; --f5:#BF452F;
  --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101512; --card:#171E1A; --card-2:#1D2620;
    --ink:#E8EEE9; --ink-2:#A9B7B0; --ink-3:#7A8881;
    --rule:#27322C; --rule-2:#1F2A24;
    --accent:#5CC79A;
    --dot:#232E28;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --f0:#7BA3DE; --f1:#3FBCA8; --f2:#E0A253; --f3:#DE7BA1; --f4:#A292DC; --f5:#E5765C;
  }
}
:root[data-theme="dark"]{
  --paper:#101512; --card:#171E1A; --card-2:#1D2620;
  --ink:#E8EEE9; --ink-2:#A9B7B0; --ink-3:#7A8881;
  --rule:#27322C; --rule-2:#1F2A24;
  --accent:#5CC79A;
  --dot:#232E28;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --f0:#7BA3DE; --f1:#3FBCA8; --f2:#E0A253; --f3:#DE7BA1; --f4:#A292DC; --f5:#E5765C;
}

*{box-sizing:border-box}
/* ★`hidden` 属性必须真能藏住东西。UA 的 [hidden]{display:none} 只是普通声明级，
   作者样式里任何一条 display 都压得过它 —— `.empty{display:flex}` 就把占位提示顶了回来，
   于是点开词条后它照旧杵在面板里，还把解释挤到一屏之外（点开像没反应）。
   JS 用 el.hidden 表达"藏起来"，这条保证那句话有 CSS 撑腰。 */
[hidden]{display:none !important}
html{height:100%}
body{
  display:flex; flex-direction:column;
  /* ★height 不能只写 min-height：min-height 给的是下限，容器高度仍是"看内容"，
     而 flex 只有在容器高度确定时才谈得上"把子项压到剩余空间"。写成 min-height:100dvh
     时，面板里的长解释会把 main 撑到 1337px —— 整页 1446px，图被顶出屏幕、
     面板自己不滚（点开一个词看着像什么都没发生）。 */
  height:100dvh;
  margin:0; background:var(--paper); color:var(--ink);
  font:400 15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
       "Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-block:0; padding-inline:0;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── 页头 ── */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
  padding:12px 18px 0;
}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{
  font:600 19px/1.2 var(--serif); margin:0; letter-spacing:.01em;
  white-space:nowrap;
}
h1 .sub{font:400 12px/1 inherit;color:var(--ink-3);letter-spacing:.06em;margin-left:9px;
  font-family:inherit;vertical-align:2px}
#q{
  flex:1 1 200px; max-width:330px; min-width:0;
  padding:8px 13px; border:1px solid var(--rule); border-radius:3px;
  background:var(--card); color:var(--ink); font-size:14px;
}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
#hits{
  position:absolute; z-index:40; margin-top:5px; max-height:290px; overflow-y:auto;
  background:var(--card); border:1px solid var(--rule); border-radius:4px;
  box-shadow:var(--shadow); min-width:230px;
}
#hits button{display:block;width:100%;text-align:left;padding:7px 13px;font-size:14px}
#hits button:hover,#hits button:focus-visible{background:var(--card-2)}
#hits .m{color:var(--ink-3);font-size:12px;margin-left:7px}
#hits .none{padding:9px 13px;color:var(--ink-3);font-size:13px}

/* ── 图例：兼作色族筛选 ── */
.legend{display:flex;gap:6px;overflow-x:auto;padding:11px 0 12px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  padding:5px 11px 5px 9px;border:1px solid var(--rule);border-radius:2px;
  font-size:12.5px;color:var(--ink-2);background:var(--card);
  transition:border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:currentColor;color:var(--ink);
  box-shadow:inset 0 -2px 0 currentColor}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11.5px}

/* ── 主体：图 + 面板 ── */
/* 高度用 flex 撑出来，不写死 calc(100dvh - 108px)：页头会换行，写死的高度在
   窄屏上要么把图压扁要么把页头顶出屏幕外。
   ★但 flex 要能撑出高度，前提是 body 自己有确定的高度 —— 见上面 body 的 height:100dvh。
   只有 min-height 的话，flex 容器的高度是"由内容决定"的，此时 flex:1/min-height:0
   全部失效：面板里那段长解释把栅格行顶到 1337px，整页 1446px，于是图、页头一起被
   顶出屏幕，而面板自己没有滚动条（看着就像"点开没反应"）。 */
main{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) 400px;gap:0}
#stage{position:relative;overflow:hidden;
  background:radial-gradient(circle at center,var(--dot) 1px,transparent 1px) 0 0/22px 22px}
#net{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#net.drag{cursor:grabbing}

/* 关系：属于=细实线（骨架）／前提=带箭头／对比=虚线 */
.link{stroke-linecap:round;fill:none}
.link.belong{stroke:var(--rule);stroke-width:1}
.link.prereq{stroke:color-mix(in srgb,var(--accent) 34%,transparent);stroke-width:1.2}
.link.contrast{stroke:color-mix(in srgb,var(--f2) 40%,transparent);stroke-width:1.2;stroke-dasharray:3 4}
.link.on{stroke-width:2.2;stroke:var(--accent);stroke-dasharray:none;opacity:1}
.link.contrast.on{stroke:var(--f2)}
#dim .link:not(.on){opacity:.07}
#dim .node:not(.on){opacity:.13}
/* 标签不在这里写 dim 规则：标签透明度全由 JS 按「是不是选中项的邻居」逐个算，
   行内样式本来就压得住这条选择器，写了等于一条永不生效的死规则。 */

.node{cursor:pointer}
.node circle{stroke:var(--card);stroke-width:1.5;transition:stroke-width .1s}
.node.cat circle{stroke-dasharray:2.5 2}
.node:hover circle{stroke-width:3}
.node.on circle{stroke:var(--ink);stroke-width:2.6}
.node text{pointer-events:none}
.lbl{
  font-size:10.5px;fill:var(--ink-2);text-anchor:middle;
  paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;
  transition:opacity .12s;
}
.lbl.big{font-size:12px;font-weight:600;fill:var(--ink)}
.lbl.on{font-size:12.5px;font-weight:600;fill:var(--ink)}

/* 图上角的提示与复位 */
#hint{
  position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--ink-3);
  pointer-events:none;max-width:60%
}
#reset{
  position:absolute;right:14px;bottom:13px;font-size:12.5px;
  padding:5px 11px;border:1px solid var(--rule);border-radius:3px;
  background:var(--card);color:var(--ink-2);box-shadow:var(--shadow)
}
#reset:hover{color:var(--ink);border-color:var(--ink-3)}

/* ── 解释面板 ── */
#panel{
  border-left:1px solid var(--rule);background:var(--card);
  overflow-y:auto;overscroll-behavior:contain;position:relative;
  /* ★min-height:0 不能省：栅格行高默认按内容的 min-content 撑，词条解释又长，
     于是行高被撑到 1579px、整个页面纵向溢出 738px —— 面板自己不滚，
     反倒把图和页头一起顶出屏幕。归零之后行高由容器决定，滚动条才落在面板里。 */
  min-height:0;
}
.empty{
  display:flex;flex-direction:column;justify-content:center;height:100%;
  padding:34px 30px;color:var(--ink-3);gap:11px
}
.empty strong{color:var(--ink-2);font-weight:600}
.empty .eg{font-size:13px;line-height:1.9}
.empty kbd{
  font:inherit;font-size:12px;padding:1px 6px;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:3px;color:var(--ink-2);background:var(--card-2)
}
.head{padding:22px 26px 15px;border-bottom:1px solid var(--rule-2)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);
  letter-spacing:.1em;margin-bottom:9px}
.eyebrow .sw{width:9px;height:9px;border-radius:50%;flex:none}
.eyebrow .tag{border:1px solid var(--rule);padding:1px 7px;border-radius:2px;letter-spacing:.04em}
.head h2{font:600 27px/1.25 var(--serif);margin:0;letter-spacing:.02em;word-break:break-word}
.head .why{color:var(--ink-2);font-size:13.5px;margin-top:9px}
.meta{display:flex;gap:16px;margin-top:13px;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}

.body{padding:6px 26px 30px}
.field{padding:15px 0;border-bottom:1px solid var(--rule-2)}
.field:last-child{border-bottom:0}
.field .k{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  letter-spacing:.11em;color:var(--ink-3);margin-bottom:6px
}
.field .k::before{content:"";width:3px;height:11px;border-radius:1px;background:currentColor}
.f-one .k{color:var(--accent)}
.f-eg .k{color:var(--f1)}
.f-wrong .k{color:var(--f5)}
.f-vs .k{color:var(--f2)}
.f-note .k{color:var(--f4)}
.field .v{color:var(--ink);font-size:15px}
.f-one .v{font-size:17px;line-height:1.65}
.f-wrong .v,.f-vs .v{color:var(--ink-2);font-size:14.5px}
strong{font-weight:600;color:var(--ink)}
.f-wrong strong,.f-vs strong{color:var(--ink)}
.f-note .v{font-size:14.5px;color:var(--ink-2)}

/* 关系跳转 —— 点一下走到图上的另一个词 */
.rel{margin-top:19px;padding-top:15px;border-top:1px solid var(--rule)}
.rel h3{font-size:11.5px;letter-spacing:.11em;color:var(--ink-3);font-weight:600;margin:0 0 9px}
.rel .row{display:flex;gap:7px;align-items:baseline;margin-bottom:10px}
.rel .rt{font-size:11.5px;color:var(--ink-3);width:34px;flex:none;padding-top:2px}
.rel .items{display:flex;flex-wrap:wrap;gap:6px}
.rel button{
  font-size:13px;padding:3.5px 10px;border:1px solid var(--rule);border-radius:2px;
  background:var(--card-2);color:var(--ink-2);transition:.12s
}
.rel button:hover{border-color:var(--accent);color:var(--accent)}
.rel .rt-belong{color:var(--ink-3)}
.catlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.catlist button{font-size:13px;padding:4px 10px;border:1px solid var(--rule);
  border-radius:2px;background:var(--card-2);color:var(--ink-2)}
.catlist button:hover{border-color:var(--accent);color:var(--accent)}

#close{position:absolute;top:15px;right:17px;width:30px;height:30px;border-radius:3px;
  display:none;align-items:center;justify-content:center;color:var(--ink-3);font-size:19px;line-height:1}
#close:hover{background:var(--card-2);color:var(--ink)}

/* ── 窄屏：图在上，解释从下方升起 ── */
@media(max-width:860px){
  main{grid-template-columns:1fr;min-height:420px}
  #panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;max-height:76dvh;
    border-left:0;border-top:1px solid var(--rule);border-radius:12px 12px 0 0;
    box-shadow:0 -14px 40px -18px rgba(0,0,0,.4);
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)
  }
  #panel.up{transform:none}
  #close{display:flex}
  .head{padding:20px 20px 14px}.body{padding:4px 20px 26px}
  #hint{max-width:52%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="bar">
    <h1>理财词图<span class="sub">217 个词 · 289 个节点</span></h1>
    <div style="position:relative;flex:1 1 200px;max-width:330px">
      <input id="q" type="search" placeholder="搜一个词，比如「夏普比率」" autocomplete="off"
             aria-label="搜索词条" role="combobox" aria-expanded="false" aria-controls="hits">
      <div id="hits" hidden></div>
    </div>
  </div>
  <div class="legend" id="legend" role="group" aria-label="按类别筛选"></div>
</header>

<main>
  <div id="stage">
    <svg id="net" role="img" aria-label="理财词条关系图"></svg>
    <div id="hint">点任意一个节点看解释 · 滚轮缩放 · 拖动平移</div>
    <button id="reset">看全图</button>
  </div>
  <aside id="panel" aria-live="polite">
    <button id="close" aria-label="关闭">×</button>
    <div class="empty" id="empty">
      <strong>点图上的任意一个词</strong>
      <div>解释会在这里展开——一句话、例子、最容易踩的误区，<br>以及它和哪个词最容易搞混。</div>
      <div class="eg">不知道从哪开始？搜 <kbd>复利</kbd>、<kbd>夏普比率</kbd>、<kbd>可转债</kbd>…<br>
      或者点图上最大的那个圈——「基金」，它连着 52 个词。</div>
    </div>
    <div id="detail"></div>
  </aside>
</main>

<script>
const D = {"families":[{"name":"地基与指标"},{"name":"存款与理财"},{"name":"基金与股票"},{"name":"保险与养老"},{"name":"负债·税·机构"},{"name":"策略与防坑"}],"cats":[{"code":"A","name":"地基：钱为什么会变多","fam":0},{"code":"B","name":"收益与风险怎么量","fam":0},{"code":"C","name":"存钱与零钱管理","fam":1},{"code":"D","name":"银行理财","fam":1},{"code":"E","name":"债券与固收","fam":1},{"code":"F","name":"基金","fam":2},{"code":"G","name":"股票","fam":2},{"code":"H","name":"保险","fam":3},{"code":"I","name":"养老与长期","fam":3},{"code":"J","name":"贷款与负债","fam":4},{"code":"K","name":"税","fam":4},{"code":"L","name":"策略与心理","fam":5},{"code":"M","name":"机构与市场","fam":4},{"code":"N","name":"防坑","fam":5}],"nodes":[{"id":"本金","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":6,"root":true,"x":1312.02,"y":-659.67,"f":{"一句话":"你拿出来的那笔钱本身。存 1 万，1 万就是本金，赚的利息不算。","例子":"存 10000 元，一年后账户 10150 元——本金 10000，利息 150。","误区":"把账户里现在的总钱数当本金。本金是你投进去的那部分，赚了亏了它都不改。","辨析":"（vs 利息）本金是你投进去的那部分，赚了亏了它都不改；利息是本金的产物。**\"本金安全\"和\"收益安全\"是两件事**——保本的产品可能一分利息都没有。"},"vs":["利息"]},{"id":"利息","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":3,"root":true,"x":1602.81,"y":-492.99,"f":{"一句话":"借钱的租金。你把钱借给银行，银行付你租金；你向银行借钱，你付租金。","例子":"10000 元存一年，利率 1.5%，利息 = 10000 × 1.5% = 150 元。","误区":"以为只有存款才有利息。贷款、债券、信用卡分期，全是利息——只是换了名字叫手续费、票息、分期费。","辨析":"（vs 本金）本金是你投进去的那部分；利息是本金的产物。**\"保本\"和\"保息\"是两回事**——很多产品只保本不保息，甚至两者都不保。"},"vs":["本金"]},{"id":"利率","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":15,"root":false,"x":1385.24,"y":-149.94,"f":{"一句话":"利息占本金的比例。它让不同金额的利息能放在一起比。","例子":"都赚 150 元——本金 1 万时利率 1.5%，本金 100 万时利率 0.015%。同一个\"150 元\"，利率差 100 倍。","误区":"只看利息金额不看利率；或者看利率不看期限——\"月利率 0.5%\"听着低，乘 12 就是年化 6%。","辨析":"（vs 收益率）**利率是借钱的价格**（事先约定、相对固定）；**收益率是你这笔投资实际的回报**（事后结算、随价格波动）。债券最典型：票面利率 3%，你 90 元买入，到期收益率就成了 4.4%——**利率没变，收益率变了**。"},"vs":["收益率"]},{"id":"单利","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":5,"root":false,"x":1658.64,"y":-277.81,"f":{"一句话":"只有本金生息，生出来的利息不参与下一轮。","例子":"10 万、年利率 3%、10 年，单利 = 10万 × (1 + 3% × 10) = 13 万。","误区":"觉得\"反正都是利息，单利复利无所谓\"。期限越长差距越大，10 年差 4392 元，30 年差 5.27 万。","辨析":"（vs 复利）**单利只有本金生息，复利连利息也生息。** 短期看差不多，**期限越长差距越大**——10 年差 4400 元，30 年差 5.27 万。"},"vs":["复利"]},{"id":"复利","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":10,"root":false,"x":1627.73,"y":2.66,"f":{"一句话":"利息也会生利息，滚雪球。","例子":"同样 10 万、3%、10 年，复利 = 10万 × 1.03 的 10 次方 = 13.44 万，比单利多 4392 元。拉到 30 年：复利 24.27 万，单利 19 万，差 5.27 万。","误区":"以为\"利率高就赢\"。复利的威力主要在**时间**不在利率——利率多 1% 远不如多放 10 年。","辨析":"（vs 单利）**单利只有本金生息，复利连利息也生息。** 10 万、3%、30 年：单利 19 万，复利 24.27 万——**差 5.27 万，而且这个差距随时间指数级扩大**。"},"vs":["单利"]},{"id":"72法则","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":2,"root":false,"x":2135.64,"y":471.76,"f":{"一句话":"本金翻倍要多少年 ≈ 72 ÷ 年化收益率（百分数）。心算用的。","例子":"年化 6%，72 ÷ 6 = 12 年翻倍（实算 11.9 年）；年化 3% 要 24 年（实算 23.4）；年化 12% 只要 6 年（实算 6.1）。","误区":"拿它算高收益产品。收益率越高它越不准，而且它**默认收益全部再投入**——你要是把利息花掉了，这个口诀就不成立。"},"vs":[]},{"id":"现值","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":3,"root":true,"x":2533.73,"y":67.44,"f":{"一句话":"未来的钱，折算到今天值多少。因为今天的钱能生息，未来的钱得打折。","例子":"一年后的 10000 元，按 3% 折算 = 10000 ÷ 1.03 = 9709 元。也就是\"今天给你 9709\"和\"一年后给你 10000\"是等价的。","误区":"把现值和\"现在的余额\"混为一谈。现值是个**算出来的数**，不是账户里躺着的钱。","辨析":"（vs 终值）同一件事的两个方向。现值把未来的钱拉回今天，终值把今天的钱推到未来。"},"vs":["终值"]},{"id":"终值","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":4,"root":false,"x":2225.06,"y":180.38,"f":{"一句话":"今天的钱，按某个收益率滚到未来值多少。","例子":"今天 10000 元，年化 3%，10 年后终值 = 10000 × 1.03 的 10 次方 = 13439 元。","误区":"算完终值就以为\"我赚了 3439\"。这是**名义**的数——若同期通胀也是 3%，你的购买力其实一点没变。","辨析":"（vs 现值）反方向。"},"vs":["现值"]},{"id":"通货膨胀","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":6,"root":true,"x":2394.02,"y":-407.28,"f":{"一句话":"钱在变薄。同样的东西，明年要花更多钱。","例子":"通胀 3%，今天 100 元的东西明年要 103 元。连续 20 年 3%，100 元的购买力只剩 55 元。","误区":"觉得\"我没感觉\"。通胀不是均匀的——你天天买的菜、房租、学费，往往比官方 CPI 涨得快。而且**工资通常跑不过它**。","辨析":"（vs 通货紧缩）通胀是钱变薄但经济在转，通缩是钱变厚但经济在停。**通缩更难治**——央行降息降到零就没招了，日本\"失去的三十年\"就是这么来的。"},"vs":["通货紧缩"]},{"id":"通货紧缩","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":3,"root":true,"x":2690.19,"y":-377.17,"f":{"一句话":"东西越来越便宜。听着像好事，其实是坏消息——东西便宜了商家赚不到钱，就裁员降薪，大家更不敢花钱。","例子":"日本 1990 年代泡沫破灭后长期通缩，物价几乎不涨，工资也不涨，被称作\"失去的三十年\"。","误区":"以为\"钱更值钱了是好事\"。你的债不会跟着缩——收入降了，房贷一分不少，实际负担反而更重。","辨析":"（vs 通货膨胀）通胀是钱变薄但经济在转，通缩是钱变厚但经济在停。**通缩更难治**——央行降息降到零就没招了。"},"vs":["通货膨胀"]},{"id":"购买力","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":2,"root":false,"x":2281.38,"y":-747.7,"f":{"一句话":"同样 100 元能买到多少东西。衡量钱的真实价值，不是面值。","例子":"通胀 3% 的话，今天的 100 元放着不动，明年只买得到今天 97 元的东西。","误区":"看账户余额涨了就觉得钱变多了。余额是**名义**的，扣掉通胀才是真的有没有变多。"},"vs":[]},{"id":"名义利率","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":5,"root":false,"x":2089.6,"y":-97.36,"f":{"一句话":"银行、APP 上直接写给你的那个利率，没扣通胀。","例子":"存款利率 2%、通胀 3%——名义利率 2%，但你的购买力实际在缩水。","误区":"只看名义利率就决定存不存。拿它和通胀比大小，是判断\"钱到底有没有在增值\"的唯一标准，很多人一辈子没算过。","辨析":"（vs 实际利率）差一个通胀。名义 2%、通胀 3%，实际利率 = −1%——**存钱反而在变穷**。**低利率环境下这两个数经常一正一负。**"},"vs":["实际利率"]},{"id":"实际利率","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":5,"root":false,"x":2033.89,"y":-310.55,"f":{"一句话":"名义利率减掉通胀，才是你的购买力真正涨了多少。","例子":"名义 2%、通胀 3%，实际利率 = 2% − 3% = **−1%**。存钱反而在变穷。","误区":"觉得\"实际利率\"是个专业概念，跟自己无关。它直接决定你存钱是在增值还是在慢慢亏。","辨析":"（vs 名义利率）差一个通胀。名义利率是\"银行说的\"，实际利率是\"你真正到手的购买力增长\"。**低利率环境下这两个数经常一正一负**。"},"vs":["名义利率"]},{"id":"风险","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":10,"root":false,"x":1050.43,"y":-1046.47,"f":{"一句话":"结果不确定——可能赚得比预想多，也可能本金变少。它不是\"危险\"，是\"不确定\"。","例子":"银行存款 50 万以内基本无风险；股票基金一年可能 +30%，也可能 −30%。这个差距就是风险的价钱。","误区":"把风险等同于\"会亏钱\"。风险是**双向**的——但不承担风险，也基本拿不到超过通胀的收益。","辨析":"（vs 收益）不是对立面，是配套的。想要更高收益，唯一的路是承担更多风险——没有例外。","提醒":"任何声称\"高收益、零风险\"的产品，本身就是风险信号。"},"vs":["收益"]},{"id":"收益","kind":"term","fam":0,"cat":"A","catName":"地基：钱为什么会变多","deg":6,"root":false,"x":1217.75,"y":-917.55,"f":{"一句话":"赚到的钱，用比例或金额说都行。","例子":"看到\"年化 8%\"就心动——先问它可能亏多少。无风险利率 2% 的环境里，那多出来的 6% 必然对应着某种风险。","误区":"把\"预期收益\"当\"保证收益\"。所有写着\"业绩比较基准\"\"预期收益\"\"历史收益\"的数字，**通通不是承诺**。","辨析":"（vs 风险）不是对立面，是配套的。想要更高收益，唯一的路是承担更多风险——没有例外。"},"vs":["风险"]},{"id":"收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":16,"root":false,"x":1026.82,"y":-140.38,"f":{"一句话":"赚了多少，用百分比说。它让不同本金、不同期限的投资能横向比。","例子":"投 1 万赚 500，和投 10 万赚 3000——收益率分别是 5% 和 3%，前者更划算。","误区":"拿收益率直接和\"利率\"比。利率是借钱的价格（事前定死），收益率是投资的结果（事后才知道）。","辨析":"（vs 利率）利率是**约定的**，收益率是**发生的**。存款利率 2% 是承诺，基金收益率 2% 是结果——明年可能是 −10%。"},"vs":["利率"]},{"id":"年化收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":759.62,"y":-241.1,"f":{"一句话":"把任意期限的收益拉平到\"一年\"来算，方便互相比。","例子":"3 个月赚 1%，年化 ≈ 1% × 4 = 4%。反过来，年化 4% 的产品，3 个月大约赚 1%。","误区":"以为\"年化 4%\"就是\"存满一年给 4%\"。你只存 3 个月，拿到的就是 1%——**年化是折算出来的假想值，不是承诺值**。","辨析":"（vs 七日年化收益率）年化收益率可以指任何区间折算；七日年化**特指**用最近 7 天折算，专用于货币基金。"},"vs":["七日年化收益率"]},{"id":"七日年化收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":704.99,"y":35.03,"f":{"一句话":"货币基金用最近 7 天的平均收益，折算成一年的比率。","例子":"余额宝显示\"七日年化 1.5%\"，意思是按最近 7 天的表现推算，一年能到 1.5%。**明天这个数就可能变**。","误区":"把它当成\"我存一年就拿 1.5%\"。它是个**每天都在变的短期指标**，用来横向比货币基金，不是你的实际收益。真要看你昨天赚了多少，看\"万份收益\"。","辨析":"（vs 万份收益）七日年化是\"折算成年\"的比率，万份收益是\"昨天实际到手\"的金额。前者便于比较，后者才是真金白银。","提醒":"七日年化**不构成任何收益承诺**，货币基金理论上也可能亏损。"},"vs":["万份收益"]},{"id":"万份收益","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":942.21,"y":382.76,"f":{"一句话":"货币基金每 1 万份，昨天实际赚了几块钱。","例子":"万份收益 0.4 元——你持有 5 万份货币基金，昨天赚了 0.4 × 5 = 2 元。","误区":"以为这个数会一直不变。它每天公布、每天变，节假日还会合并计算。","辨析":"（vs 七日年化收益率）**万份收益是\"昨天 1 万块赚了多少\"**（实际值，但只反映一天）；**七日年化是\"按最近 7 天推算一年能赚多少\"**（估算值，**不是承诺**）。**一个看短期波动，一个看大致水平**——两个都是历史数据，都不预示未来。","提醒":"货币基金**不保本**，万份收益理论上也可能为负。"},"vs":["七日年化收益率"]},{"id":"累计收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":472.14,"y":-300.22,"f":{"一句话":"从最开始拿到现在，总共涨了百分之多少。","例子":"一只 2015 年成立的基金，累计收益率 80%——成立至今总共涨了 80%，但不知道是哪几年涨的。","误区":"拿累计收益率判断\"这基金好不好\"。一只成立 10 年的基金累计 80%，年化只有 6%；另一只成立 2 年累计 50%，年化是 22%。**不比年化就是耍流氓**。","辨析":"（vs 持有期收益率）累计收益率是从产品成立算起的（跟你没关系），持有期收益率是从**你买入**算起的（这才是你的）。"},"vs":["持有期收益率"]},{"id":"持有期收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":572.24,"y":-139.5,"f":{"一句话":"你自己这段持有时间里，赚了百分之多少。","例子":"你在基金净值 1.5 元时买入，现在 1.8 元，持有期收益率 = (1.8 − 1.5) ÷ 1.5 = 20%。至于这基金成立以来涨了多少，跟你无关。","误区":"看到 App 首页写着\"+120%\"就以为自己也赚了这么多——那多半是基金的累计收益，不是你的。**看自己的持有收益才有意义**。","辨析":"（vs 累计收益率）**累计收益率是\"从头到尾一共赚了多少\"**（不年化：持有 5 年赚 50% 就是 50%）；**持有期收益率是把它换算成年化**（上例约 8.4%/年）。**比不同期限的产品必须用年化**，否则没法比。"},"vs":["累计收益率"]},{"id":"到期收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":1131.82,"y":244.14,"f":{"一句话":"债券按现在的价格买入、持有到还本付息，真实的年化收益是多少。","例子":"面值 100 元、票面利率 3% 的债券，你花 95 元买到，持有到期拿回 100 元加利息——到期收益率会比 3% 高，因为你便宜买到了。","误区":"拿票面利率当收益。票面利率是印在债券上的，**到期收益率才是你实际赚的**——买入价越低，到期收益率越高。","辨析":"（vs 票面利率）票面利率是债券\"出厂设置\"，到期收益率是\"你买它的实际回报\"。两者只在按面值买入时才相等。"},"vs":["票面利率"]},{"id":"票面利率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":948.73,"y":141.83,"f":{"一句话":"债券上印着的那个利率，决定了每年付你多少利息。","例子":"面值 100 元、票面利率 3% 的债券，每年付你 3 元利息，到期还你 100 元本金。","误区":"以为票面利率高就是好债。票面利率高的债，往往是因为发行时市场利率高、或者这公司信用差——**要连风险一起看**。","辨析":"（vs 到期收益率）**票面利率是债券上印着的固定利息率**（发行时定死，终生不变）；**到期收益率是你按当前市价买入、持有到期的真实年化回报**。债券价格跌了，票面利率不变，但到期收益率会升高。"},"vs":["到期收益率"]},{"id":"业绩比较基准","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":972.23,"y":666.65,"f":{"一句话":"基金给自己设的一条\"参考线\"，说明它打算往哪个方向努力。","例子":"\"业绩比较基准：沪深300指数收益率 × 80% + 中债综合指数收益率 × 20%\"——意思是它主要跟股票走，带一点债。","误区":"**把它当保底收益**。这是最常见的误解。业绩比较基准**不是承诺、不是预期、更不是下限**——基金完全可能长期跑输它，甚至亏本金。","辨析":"（vs 预期收益率）预期收益率是老理财产品的说法（资管新规后已退场，且当年也常兑现不了）；业绩比较基准是现在基金的说法，措辞更谨慎，但**同样不保证**。","提醒":"这是资管新规后必须披露的信息，属于合规要求。看到它就该明白：**没人向你保证任何收益**。"},"vs":["预期收益率"]},{"id":"预期收益率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":1343.79,"y":319.7,"f":{"一句话":"老式银行理财的招牌——\"预期收益 4.5%\"，听着像承诺。","例子":"2018 年前很多理财产品都挂着\"预期收益率 5%\"。资管新规后这类产品基本绝迹，改成了净值型。","误区":"以为\"预期\"只是措辞保守，实际上会兑付。**它当年也不保证**——只是银行为了口碑常常自己贴钱兑付，把风险藏起来了。","辨析":"（vs 业绩比较基准）两个都是\"不承诺\"的话术，但**新旧不同**：**\"预期收益率\"是资管新规前的老口径，现在已经不允许使用**；**\"业绩比较基准\"是现行说法，意思是\"争取做到这个数\"**。它同样不是收益承诺，产品照样可能亏。"},"vs":["业绩比较基准"]},{"id":"净值","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":10,"root":false,"x":544.49,"y":624.7,"f":{"一句话":"一份基金值多少钱。你赚没赚，就看它涨没涨。","例子":"净值 1.5 元时买 1000 份，花了 1500 元；净值涨到 1.8 元，你的份额值 1800 元，赚 300 元。","误区":"以为\"净值低的基金更便宜、更值得买\"。**净值 1 元和 3 元的基金没有贵贱之分**——涨跌幅才是关键。净值低往往只是因为成立晚或者分过红。","辨析":"（vs 累计净值）净值（单位净值）是**当前**每份的价格；累计净值是把历史分红加回去后的数，用来看\"这基金一共赚过多少\"。"},"vs":["累计净值"]},{"id":"单位净值","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":332.22,"y":261.29,"f":{"一句话":"当前每一份基金的价格。你申购赎回都按它算。","例子":"单位净值 1.234 元，买 1000 元大约得到 1000 ÷ 1.234 = 810.4 份（还要扣申购费）。","误区":"以为单位净值会\"跌到 0 就没了\"。基金净值跌到很低时有清盘线（通常 0.3 元或规模低于 5000 万），会强制清盘退钱——**不会归零，但会被赶下车**。","辨析":"（vs 累计净值）**单位净值是现在每份值多少钱**（申赎按它成交）；**累计净值是成立以来一共赚了多少（含已经分掉的）**。**看历史业绩要看累计净值**——只看单位净值，会把分红多的基金误判成差基金。"},"vs":["累计净值"]},{"id":"累计净值","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":409.61,"y":426.78,"f":{"一句话":"单位净值加上历史累计分红，能看出这只基金一共给持有人赚过多少。","例子":"单位净值 1.5 元、累计净值 2.8 元——说明这基金历史上分过 1.3 元/份的红。","误区":"以为累计净值是\"现在的价格\"。**它不是价格，是战绩**。申购赎回一律看单位净值。","辨析":"（vs 单位净值）单位净值决定你买卖的价格，累计净值只反映历史业绩。**分红过的基金，累计净值会明显高于单位净值**。"},"vs":["单位净值"]},{"id":"波动率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":7,"root":false,"x":940.94,"y":-375.87,"f":{"一句话":"收益上下晃动的剧烈程度。它衡量\"过程有多难受\"，不是\"结果好不好\"。","例子":"两只基金年化都是 10%，A 的波动率 25%（一年内可能在 −15% 到 +35% 之间晃），B 的波动率 5%（大概 5% 到 15%）。**B 让你睡得着觉**。","误区":"以为波动率低就是好。波动率只描述\"晃得厉害不厉害\"，不说明赚不赚钱——一个年年稳亏 3% 的产品波动率也可以很低。","辨析":"（vs 最大回撤）波动率看**整体晃动的幅度**（上下都算），最大回撤只看**最惨的那一段跌**。波动率高的产品，回撤通常也大，但不绝对。"},"vs":["最大回撤"]},{"id":"最大回撤","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":851.41,"y":-76.54,"f":{"一句话":"从最高点跌到最低点，最多跌了多少。它衡量\"最坏能有多坏\"。","例子":"某基金净值从 2.0 跌到 1.2，最大回撤 = (2.0 − 1.2) ÷ 2.0 = 40%。意味着**最惨的时候，你的 10 万变成 6 万**。","误区":"只看收益率不看回撤。一只年化 20%、最大回撤 50% 的基金，大多数人**拿不住**——跌一半的时候早就割肉跑了，那个 20% 你根本吃不到。**回撤决定了你能不能坚持到收益兑现**。","辨析":"（vs 波动率）回撤是\"最坏情况\"，波动率是\"平均晃多少\"。**做心理准备时看回撤，做产品比较时看波动率**。"},"vs":["波动率"]},{"id":"夏普比率","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":1186.55,"y":-267.65,"f":{"一句话":"每承担一份波动，换回来多少收益。它比的是\"性价比\"，不是\"谁赚得多\"。","例子":"基金 A 年化 15%、波动 25%，夏普 = (15% − 2%) ÷ 25% = 0.52；基金 B 年化 10%、波动 8%，夏普 = (10% − 2%) ÷ 8% = 1.0。**B 更值得买**——它赚得少，但稳得多。","误区":"以为夏普越高收益越高。夏普高只说明\"这钱赚得划算\"，一个年化 3% 的稳产品夏普也可能很高。","辨析":"（vs 波动率）波动率只说\"晃得多厉害\"，夏普把\"晃\"和\"赚\"放在一起算。**单看波动率会把高收益高波动的产品误杀**。"},"vs":["波动率"]},{"id":"贝塔系数","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":542.91,"y":-655.82,"f":{"一句话":"这只基金跟着大盘一起动的程度。大盘涨 1%，它平均涨多少。","例子":"贝塔 1.2——大盘涨 1%，它大约涨 1.2%；大盘跌 1%，它也大约跌 1.2%。贝塔 0.5 就温和得多。","误区":"以为贝塔高就是好。贝塔高只是**放大**——牛市放大收益，熊市同样放大亏损。它是一个\"性格描述\"，不是\"能力评价\"。","辨析":"（vs 阿尔法）贝塔是\"跟着市场喝汤\"的部分，阿尔法是\"靠自己本事多赚\"的部分。**贝塔不花力气就有，阿尔法才是基金经理的价值**。"},"vs":["阿尔法"]},{"id":"阿尔法","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":4,"root":false,"x":596.08,"y":-918.54,"f":{"一句话":"撇开大盘的影响，基金经理靠自己的本事多赚（或少亏）的部分。","例子":"大盘涨 10%、基金涨 14%，而它的贝塔是 1.0——那多出来的 4% 就是阿尔法。如果基金涨 8%，阿尔法就是 −2%（跑输了）。","误区":"以为阿尔法为正就是好基金。**阿尔法很难长期为正**——绝大多数主动基金长期跑不赢指数，这是全球范围内的统计事实。看到\"阿尔法很高\"要问：是多久的？三年还是三个月？","辨析":"（vs 贝塔系数）**贝塔是\"跟着市场一起动的部分\"**（β=1 就是和大盘同涨同跌）；**阿尔法是\"超出市场的那部分\"**（基金经理的真本事）。**贝塔是市场给的，阿尔法才是能力**——而阿尔法很难持续，去年的明星基金今年往往就没了。","提醒":"历史阿尔法**完全不能预测未来**。选基金别只盯着这个数。"},"vs":["贝塔系数"]},{"id":"风险等级","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":6,"root":false,"x":651.97,"y":-432.17,"f":{"一句话":"产品有多凶。R1 到 R5，数字越大越可能亏本金。","例子":"R1 是货币基金、国债（几乎不亏）；R2 是纯债基金；R3 是混合基金；R4 是股票基金；R5 是杠杆/衍生品产品（可能亏光）。","误区":"以为 R2 就\"绝对安全\"。风险等级是**产品的波动属性**，不是保本承诺——R2 的债基在债市大跌时一样会亏。","辨析":"（vs 风险承受能力）风险等级说的是**产品**，风险承受能力说的是**你**。**买之前必须让这两个数匹配**，这是监管的硬要求（投资者适当性）。"},"vs":["风险承受能力"]},{"id":"风险承受能力","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":false,"x":688.15,"y":-745.39,"f":{"一句话":"你自己能扛多凶。不只看钱，还看你能不能在跌 30% 时睡着觉。","例子":"同样有 50 万——24 岁单身、收入稳定的人，和 55 岁要供孩子上学的人，能承受的风险完全不同。开户时做的风险测评问卷就是在测这个。","误区":"**为了买高收益产品，在测评问卷上故意选激进答案**。这是最坑自己的操作——你只是骗过了系统，市场会照样教训你。","辨析":"（vs 风险等级）别把方向搞反：**风险承受能力是你**（测出来的），**风险等级是产品**（R1~R5）。**规则是产品的风险等级不能高于你的承受能力**——不是反过来。","提醒":"风险测评不是走形式，是监管要求的投资者适当性制度。**测评结果过期要重测**，因为你的情况会变。"},"vs":["风险等级"]},{"id":"风险与收益对等","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":3,"root":false,"x":1515.59,"y":-733.47,"f":{"一句话":"想要更高收益，只能承担更多风险。没有例外。","例子":"存款 1.5%、国债 2.5%、纯债基金 3~4%、股票基金长期 8~10%（但某一年可能 −30%）。**收益每上一个台阶，风险就上一级**。","误区":"**总想找\"高收益低风险\"的产品**。这个念头本身就是骗子的入口——所有金融诈骗都从\"我有个稳赚的路子\"开始。看到明显偏离这个规律的收益，就该假设是骗局，而不是运气。","提醒":"这是整个理财知识体系的第一性原理。**记住它，能挡掉 90% 的坑。**"},"vs":[]},{"id":"流动性","kind":"term","fam":0,"cat":"B","catName":"收益与风险怎么量","deg":5,"root":true,"x":1218.32,"y":8.01,"f":{"一句话":"你的钱多快能变现，变现时会不会亏。","例子":"活期存款随时取、不亏（流动性最好）；货币基金 T+0 到账；封闭式理财锁 1 年，中途取不出（流动性最差）。","误区":"只看收益不看能不能取。**把急用的钱投进封闭期产品**，等真要用了取不出来，只能干着急。","辨析":"（vs 收益率）**流动性和收益率通常是反向的**——锁得越久，给你的收益越高，这是补偿。要收益就得让渡流动性，这是笔交易，不是白拿。"},"vs":["收益率"]},{"id":"活期存款","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":6,"root":false,"x":1547.86,"y":462.53,"f":{"一句话":"随时能取的存款，利息低到可以忽略。","例子":"活期利率约 0.2%，10 万元放一年利息 200 元。同样 10 万放货币基金（约 1.5%），一年 1500 元——**差 7 倍**。","误区":"把大笔钱长期扔在活期图省事。**活期只该放\"随时要用的那部分\"**，多出来的钱放货币基金，同样随时能取，利息高得多。","辨析":"（vs 定期存款）活期换流动性（随时取），定期换收益（锁一段时间）。**你牺牲的是利息，买的是\"随时能拿\"。**"},"vs":["定期存款"]},{"id":"定期存款","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":11,"root":false,"x":1695.15,"y":633.81,"f":{"一句话":"约定锁一段时间，换取比活期高得多的利息。","例子":"1 年期定存约 1.5%，10 万元一年 1500 元；3 年期约 2%，三年 6000 元。存期内提前取，按活期算——**利息几乎全没了**。","误区":"以为\"反正能提前取\"。**提前支取按活期计息**是铁律：10 万存 3 年，第 2 年 11 个月急用取出来，本来能拿 6000，实际只拿约 400 元。","辨析":"（vs 活期存款）**定期利率高，但提前支取就按活期计息**（损失很大）；**活期随时能取，但利率极低**（通常只有 0.1%~0.2%，几乎等于没有）。**想兼顾就用\"阶梯存款\"**——把钱分成几笔存不同期限，此后每年都有一笔到期。","提醒":"50 万以内的存款受《存款保险条例》保护，**同一家银行本息合计 50 万是上限**——超过就分几家银行存。"},"vs":["活期存款"]},{"id":"整存整取","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":4,"root":false,"x":1947.96,"y":1033.48,"f":{"一句话":"一次存进去，到期一次取出来。最常见的定存方式。","例子":"10 万一次性存 3 年，到期连本带息一次拿回。","误区":"以为只有这一种定存方式。**零存整取、存本取息、整存零取**都是定存，各有用途，别被名字绕晕。","辨析":"（vs 零存整取）整存整取是\"一次存、一次取\"，适合手里有整笔钱；零存整取是\"每月存、到期取\"，适合攒钱。"},"vs":["零存整取"]},{"id":"零存整取","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":4,"root":false,"x":1932.34,"y":796.91,"f":{"一句话":"每个月固定存一笔，到期一次取出来。强制储蓄用的。","例子":"每月存 1000 元、存 1 年，年利率约 1.35%——到期大约拿到 12100 元左右（利息按每月实际存入时间分段算，比整存整取低）。","误区":"以为零存整取的利率和整存整取一样。**它通常更低**——因为你每笔钱实际存的时间不一样长。","辨析":"（vs 整存整取）**整存整取是一次存一笔、到期一次取**（利率最高、最常用）；**零存整取是每月存固定金额、到期一次取**（强制储蓄，但**利率明显更低**）。想强制攒钱可以用它，**别指望利息**。","提醒":"**漏存一期可能影响整个计划**（部分银行允许补存一次），签之前问清楚。"},"vs":["整存整取"]},{"id":"大额存单","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":3,"root":false,"x":1804.46,"y":398.46,"f":{"一句话":"20 万起存的定期存款，利率比普通定存高一点，而且能转让。","例子":"3 年期大额存单利率约 2.3%，普通定存约 2.0%——50 万存 3 年，差 4500 元。","误区":"以为大额存单能像活期一样随时取。**它本质还是定期存款**——提前支取照样按活期计息，只是多了一条\"转让给别人\"的路。","辨析":"（vs 定期存款）同样的东西，门槛更高、利率更高、多一个转让功能。**如果钱够 20 万且确定 3 年不用，它比普通定存划算**。","提醒":"同样受存款保险保护，**同一家银行本息 50 万以内**。"},"vs":["定期存款"]},{"id":"通知存款","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":3,"root":false,"x":1544.82,"y":787.78,"f":{"一句话":"取钱前要先\"通知\"银行一声（1 天或 7 天），利息比活期高、比定期低。","例子":"7 天通知存款利率约 0.55%——10 万元一年约 550 元，比活期的 200 元高，但远不如货币基金。","误区":"以为它很实用。**现在基本被货币基金取代了**——两者流动性差不多，货币基金收益更高、还不用提前通知。","辨析":"（vs 活期存款）多了一点利息，代价是取钱要等 1 天或 7 天。**急用钱的场景下这个\"等\"可能要命。**"},"vs":["活期存款"]},{"id":"结构性存款","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":3,"root":false,"x":1161.48,"y":712.62,"f":{"一句话":"存款加一份衍生品赌约——本金通常保住，收益看挂钩的东西涨不涨。","例子":"\"挂钩黄金，若金价在观察期内涨 5%，你拿 4%；否则只拿 0.5%。\" 本金 10 万保住了，但收益可能是 500 元也可能是 4000 元。","误区":"**被\"最高收益\"吸引，没看触发条件**。真结构性存款的收益区间通常很宽，而实际大概率落在**最低档**——因为触发条件设计得很难达到。","辨析":"（vs 银行理财）结构性存款**本金受存款保险保护**（它是存款），银行理财不保本。这是两者最本质的区别。","提醒":"资管新规后，**只有真有衍生品交易结构的才叫结构性存款**。名字里带\"结构\"但不保本的，是假结构性存款，要看清合同。"},"vs":["银行理财"]},{"id":"货币基金","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":7,"root":false,"x":724.34,"y":906.5,"f":{"一句话":"把钱凑起来投短期安全资产，随时能取，收益比活期高得多。余额宝就是它。","例子":"七日年化约 1.5%，10 万元放一年约 1500 元，活期只有 200 元。**随时可取**。","误区":"以为货币基金\"绝对安全、等同于存款\"。**它不保本**——虽然历史上极少亏损，但理论上可以。而且它**不受存款保险保护**。","辨析":"（vs 现金管理类理财）两者底层都是短期债券和存款，收益接近。**差别在监管归属和赎回规则**：货币基金归证监会管（T+0 快速赎回单日上限 1 万），现金管理类理财归金融监管总局管（到账时间各家不同，多为 T+1）。","提醒":"**快速赎回（T+0）现在每只基金每人每天限额 1 万元**，超过要走普通赎回（T+1 到账）。急用大额要提前一天安排。"},"vs":["现金管理类理财"]},{"id":"现金管理类理财","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":4,"root":false,"x":946.49,"y":866.22,"f":{"一句话":"银行理财版的\"余额宝\"，投资范围和货币基金基本一样。","例子":"七日年化通常和货币基金接近，2022 年后监管把两者的规则拉平了（都按摊余成本法、都有赎回限额）。","误区":"以为\"银行卖的就更安全\"。**它是理财产品，不是存款，不保本、不受存款保险保护**。安全性来自它投的资产，不来自\"银行\"两个字。","辨析":"（vs 货币基金）投资范围、收益、流动性现在几乎一样。区别在**发行方**（银行理财子公司 vs 基金公司）和**购买渠道**。选哪个看谁方便。"},"vs":["货币基金"]},{"id":"国债逆回购","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":3,"root":false,"x":1033.72,"y":1168.55,"f":{"一句话":"把钱借给别人，对方拿国债做抵押，到期还本付息。本质是**你放了一笔极短期贷款**。","例子":"卖出 1 天期逆回购（GC001）10 万元，年化 2%，第二天拿回本金加约 5.5 元利息。**节假日前利率常飙到 5% 以上**。","误区":"以为它是\"买国债\"。**方向正好相反**——你不是买入国债，是把钱借出去、拿国债当抵押品。而且它是**短期工具**，不是长期投资。","辨析":"（vs 货币基金）都是短期放钱的地方。**逆回购是你把钱借出去、对方拿国债做抵押**，期限固定（1 天到 182 天），**到期本息自动到账、不能提前取**；货基随时能取。**月末、季末、年末资金紧张时逆回购利率会飙高**——这才是它的价值所在。","提醒":"门槛沪深不同（**深市 1000 元起，沪市 10 万元起**），需要开股票账户。到期资金自动到账，不用管。"},"vs":["货币基金"]},{"id":"存款保险","kind":"term","fam":1,"cat":"C","catName":"存钱与零钱管理","deg":3,"root":false,"x":799.76,"y":695.72,"f":{"一句话":"国家给存款上的保险——银行倒了，同一家银行 50 万以内的本息全额赔你。","例子":"你在 A 银行存 80 万，A 银行倒闭，你能拿回 **50 万**；剩下的 30 万要等清算，可能拿不回全部。","误区":"**以为\"银行卖的\"都受这个保护**。错——**存款保险只保存款，不保理财、不保基金、不保保险**。银行柜台卖的理财产品亏了，这个保险一分不赔。","辨析":"（vs 银行理财）这是最容易搞混、后果最严重的一对。**存款是\"借给银行的钱\"（受保护），理财是\"委托银行投资的钱\"（不受保护）**。买之前一定看清合同上写的是\"存款\"还是\"理财\"。","提醒":"**每家银行 50 万上限**。存款超过 50 万，**分散到不同银行**（不同银行是分别计算的，同一家银行的不同分行算一家）。"},"vs":["银行理财"]},{"id":"银行理财","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":17,"root":false,"x":759.12,"y":451.27,"f":{"一句话":"银行（或其理财子公司）发行的投资产品。**它不等于存款**。","例子":"同样 10 万，存 3 年定期约拿 6000 元利息（保本保息）；买 R2 级理财可能拿 9000 元，也可能只拿 2000 元甚至亏本金。","误区":"**\"在银行买的\"就以为安全**。银行卖的理财早就打破刚兑了——2018 年资管新规后，理财产品**一律不保本**。你在银行买基金亏了，银行也不赔。","辨析":"（vs 存款）存款是**你把钱借给银行**（银行还本付息，受存款保险保护）；理财是**你委托银行去投资**（盈亏自负，不受保护）。**这一条是理财入门最重要的一课。**","提醒":"买之前必须看清是\"存款\"还是\"理财\"，以及风险等级（R1~R5）。**销售说\"保本\"就是违规**，可以直接投诉。"},"vs":["存款"]},{"id":"净值型理财","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":7,"root":false,"x":378.55,"y":-33.17,"f":{"一句话":"现在的主流理财——按净值计价，每天公布涨跌，**会亏本金**。","例子":"净值 1.0 买入，半年后 1.02 就是赚 2%，跌到 0.98 就是亏 2%。2022 年 3 月和 11 月，大量 R2 级理财跌破 1 元。","误区":"以为 R2\"稳健型\"就不会亏。**2022 年两轮债市调整，很多 R2 理财一个月亏掉 1%~2%**，引发大规模赎回。净值型产品的\"稳健\"只是波动小，不是不亏。","辨析":"（vs 预期收益型理财）预期收益型是\"说好给你多少\"（已退场），净值型是\"赚多少算多少\"。**后者才是真实的风险收益关系**——以前那种\"稳赚 5%\"是把风险藏起来了。"},"vs":["预期收益型理财"]},{"id":"预期收益型理财","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":4,"root":false,"x":520.51,"y":166.03,"f":{"一句话":"老式理财——\"预期收益率 4.5%\"，到期真给 4.5%，看着像存款。","例子":"2018 年前银行理财基本都长这样。背后是**资金池**运作：把大家的钱混在一起，用新钱兑付老钱。","误区":"以为那时候的产品\"更良心\"。**它只是把风险藏起来了**——资金池模式下一旦新钱进不来，整个池子就崩。这也是监管坚决要打破刚兑的原因。","辨析":"（vs 净值型理财）**预期收益型是\"告诉你一个数\"**（资管新规前的模式，银行实际在兜底）；**净值型是\"每天告诉你值多少钱\"**（涨跌自负）。**资管新规后新发的都是净值型**——现在若还看到\"预期收益率 4.5%\"的理财，要么是违规，要么是存量老产品。","提醒":"资管新规（2018）后这类产品**已基本退出市场**。现在谁还向你承诺\"保本保收益\"，**就是违规**。"},"vs":["净值型理财"]},{"id":"理财子公司","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":3,"root":false,"x":-14.0,"y":225.44,"f":{"一句话":"银行把理财业务单独拆出来成立的公司，独立经营、独立担责。","例子":"目前全国有 30 多家理财子公司，工银理财、建信理财、招银理财都是。你买的银行理财，合同上的发行方是这些子公司，**不是银行本身**——所以理论上银行破产，理财并不自动受存款保险保护。","误区":"以为\"还是那家银行发的，银行会兜底\"。**拆出来的目的之一就是隔离风险**——理财子公司亏了，母银行没有法律义务赔付。","辨析":"（vs 商业银行）银行是**吸收存款**的（受存款保险保护），理财子公司是**发行理财产品**的（不受保护）。**看合同上盖谁的章，就知道你的钱受哪种规则管。**"},"vs":["商业银行"]},{"id":"破净","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":3,"root":false,"x":799.9,"y":1167.55,"f":{"一句话":"净值跌破 1 元。**理财也会亏本金的证据**。","例子":"2022 年 3 月，市场上超过 2000 只银行理财跌破净值。很多买 R2 的储户第一次意识到\"理财≠存款\"。","误区":"以为破净就是\"出大事了\"。**净值型产品短期破净很正常**——债券价格波动就会导致，多数会涨回来。真正的风险是**在破净时恐慌赎回**，把浮亏变成实亏。","提醒":"破净不是违约，**只是一时的账面浮亏**。但如果你无法承受这种波动，就不该买净值型产品。"},"vs":[]},{"id":"募集期","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":4,"root":false,"x":1062.54,"y":1555.69,"f":{"一句话":"产品开卖、只收钱不生息的那几天。","例子":"募集期 5 天，你第 1 天买入 10 万——这 5 天里钱被冻结，**只按活期（或不计息）**。10 万 × 5 天，损失约 20 元利息。","误区":"以为买入当天就开始赚。**募集期你的钱不生息也不产生收益**，而且这段时间越长越亏。","辨析":"（vs 封闭期）**募集期是\"还没成立、正在收钱\"**（这期间的钱通常只按活期计息，等于站岗）；**封闭期是\"成立之后不能赎回\"**。买理财要把募集期的资金闲置成本算进去。","提醒":"**募集期的钱通常按活期计息，有的甚至不计息**。同样是 90 天产品，募集期 1 天和 7 天，实际年化差不少——**买之前算一下\"资金站岗\"的天数**。"},"vs":["封闭期"]},{"id":"封闭期","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":4,"root":false,"x":1209.29,"y":1400.53,"f":{"一句话":"产品成立后，想取也取不出来的那段时间。","例子":"封闭期 1 年的理财，你第 3 个月急用钱——**取不出来**，只能干等。","误区":"**只看收益率不看封闭期**。这是最常见的踩坑方式：为了多 0.5% 的收益，把可能要用的钱锁 1 年。","辨析":"（vs 募集期）募集期是**买之前**的等待（钱已交、还没开始赚），封闭期是**买了之后**的锁定（钱在赚、但拿不出）。**前者损失利息，后者损失灵活性。**","提醒":"买之前第一件事是问\"**这笔钱我多久不用**\"，而不是\"收益多少\"。"},"vs":["募集期"]},{"id":"申购","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":4,"root":false,"x":596.21,"y":2047.98,"f":{"一句话":"买入。买基金、买理财都是这个词。","例子":"申购 1000 元基金，按当天收盘净值成交，通常 T+1 确认份额。","误区":"以为\"申购\"和\"认购\"是一回事。**认购是买新发的基金**（募集期，净值固定 1 元），**申购是买已成立的老基金**（按每日净值）。认购通常有封闭期，申购没有。","辨析":"（vs 赎回）**申购是买入，赎回是卖出。** 申购费通常按金额递减（买得多费率低），**赎回费则随持有时间递减**——一进一出的规则方向正好相反。","提醒":"申购费通常 0.1%~1.5%，**很多平台打一折**。场外基金按\"未知价\"成交——你下单时并不知道成交价。"},"vs":["赎回"]},{"id":"赎回","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":4,"root":false,"x":335.75,"y":1988.38,"f":{"一句话":"卖出、把钱取回来。","例子":"赎回 1000 份基金，净值 1.5 元，拿回 1500 元减去赎回费，通常 T+1 到 T+7 个工作日到账。","误区":"**以为赎回立刻到账**。不同类型到账时间差很多：货币基金 T+0/T+1，股票基金 T+1 确认、T+2 到账，QDII 基金可能 T+7 以上。急用钱要提前算好。","辨析":"（vs 申购）**申购是买入，赎回是卖出。** 两个提醒：**两头都有费用**；**到账要时间**（股票基金 T+1 确认、T+2 到账，QDII 更久）。急用的钱别放在赎回慢的产品里。","提醒":"**赎回费通常和持有时间挂钩**——持有 7 天内赎回，费率高达 1.5%（惩罚性），持有 2 年以上常常免收。**别频繁申赎。**"},"vs":["申购"]},{"id":"非保本浮动收益","kind":"term","fam":1,"cat":"D","catName":"银行理财","deg":3,"root":false,"x":1205.54,"y":929.76,"f":{"一句话":"官方话术，翻译过来就是\"**可能亏**\"。","例子":"产品说明书上写\"本产品为非保本浮动收益型\"。**即使风险等级只有 R2 的产品也这么写**——因为资管新规不允许任何理财产品承诺保本，**这句话是合规要求，不是产品差的标志**。","误区":"以为这只是\"程序性表述\"、实际上还是保本的。**不是**。资管新规后这是**法律上的真实约定**——真亏了，银行一分不赔，你去投诉也站不住。","辨析":"（vs 存款）存款的合同写\"保本保息\"且受存款保险保护；理财的合同写\"非保本浮动收益\"。**这两句话的区别，就是你的钱有没有兜底的区别。**","提醒":"看到\"非保本浮动收益\"这七个字，**就该假设最坏情况下本金可能显著亏损**。"},"vs":["存款"]},{"id":"债券","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":18,"root":true,"x":-48.91,"y":541.05,"f":{"一句话":"一张标准化的欠条——你借钱给机构，它按期付利息、到期还本金。","例子":"买 1 万元国债，票面利率 2.5%，每年收 250 元利息，3 年后拿回 1 万本金。","误区":"以为债券\"稳赚不赔\"。**债券价格和利率反向变动**：利率一涨，你手里已经买的老债券就跌价（因为新债利息更高，你的旧债没人要）。**2022 年 11 月债市调整，纯债基金一个月跌了 1%~2%。**","辨析":"（vs 股票）**债券是借钱（你是债主，收益上限固定），股票是入股（你是股东，收益无上限但也没保证）**。公司破产清算时，债券持有人**先于**股东拿到钱。","提醒":"债券的收益空间有限，风险却不只有\"公司还不上\"一种——**利率风险和信用风险是两条独立的线**。"},"vs":["股票"]},{"id":"国债","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":5,"root":false,"x":331.69,"y":810.64,"f":{"一句话":"国家向你借的钱。**信用等级最高的债券**，因为它能印钱还你。","例子":"3 年期储蓄国债利率约 2.4%，比同期银行定存（约 2.0%）高一点，且**利息免个人所得税**。","误区":"以为国债随时能买。**储蓄国债（电子式/凭证式）每月限量发行，经常开卖几分钟就抢光**——要去银行柜台或 App 抢。记账式国债在交易所可以随时买卖，但**价格会波动，可能亏**。","辨析":"（vs 地方政府债）国债是**中央**政府借的（信用最高），地方债是**省级**政府借的（信用也很高但略低）。","提醒":"储蓄国债**提前兑取要损失部分利息并交手续费**，买之前想好期限。"},"vs":["地方政府债"]},{"id":"地方政府债","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":4,"root":false,"x":142.57,"y":595.82,"f":{"一句话":"省政府向你借的钱，用来修路、建地铁这类地方建设。","例子":"利率通常比国债略高（约高 0.1~0.3 个百分点），因为信用等级稍低一点。","误区":"以为\"地方政府债=城投债\"。**不是一回事**——地方政府债是**政府直接借的**（法定债务，信用高）；城投债是**地方融资平台公司借的**（企业债，不是政府债务）。很多理财产品暴雷的就是后者。","辨析":"（vs 国债）都是政府债，**但借钱的主体不同**：国债是中央政府借（信用等级最高），地方政府债是省级政府借。**地方政府债利率略高一点，正是因为它的信用不如国债**。","提醒":"个人投资者主要通过**银行柜台或交易所**买，门槛和渠道比国债窄。**别把\"城投\"当\"政府\"**。"},"vs":["国债"]},{"id":"可转债","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":4,"root":false,"x":-326.95,"y":580.18,"f":{"一句话":"一张能换成股票的债券。跌了当债券拿利息，涨了能转成股票吃涨幅。","例子":"面值 100 元、转股价 10 元（可换 10 股）。正股涨到 15 元，转股后值 150 元；正股跌到 6 元，转股只值 60 元，但你还能当债券持有到期拿回本金加利息。","误区":"**以为\"下有保底\"就没风险**。三个坑：① 保底的前提是**公司不违约**，退市或违约照样腰斩；② 很多转债价格早涨到 130 元以上，**那个位置买已经没有债性保护**；③ **强赎条款**——正股涨到转股价 130% 时公司可强制赎回，你必须在期限内卖出或转股，否则被按 100 元出头赎走，**暴涨的收益全没了**。","辨析":"（vs 债券）普通债券的收益是定死的（票息），可转债的收益跟着股票走。**转债的定价里含一个期权**，所以它通常比同类普通债券贵。","提醒":"可转债有 **T+0 交易、无涨跌幅限制（首日）**，波动比股票还大。不懂强赎规则就买，很容易亏。"},"vs":["债券"]},{"id":"信用风险","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":8,"root":false,"x":336.97,"y":630.14,"f":{"一句话":"借钱的人还不上。**债券两大风险之一**。","例子":"某公司债违约，100 元面值的债跌到 30 元——持有人损失 70%。","误区":"以为\"债券评级高就没信用风险\"。**评级是机构给的，会滞后**——很多债在违约前几个月还是 AA 级。**评级下调往往发生在价格已经暴跌之后。**","辨析":"（vs 利率风险）信用风险是\"**特定这家公司**出问题\"，利率风险是\"**整个市场利率变了**\"。前者可以通过分散（买一篮子债）降低，后者不能——**利率风险是系统性风险，躲不掉**。"},"vs":["利率风险"]},{"id":"利率风险","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":5,"root":false,"x":574.98,"y":405.03,"f":{"一句话":"市场利率一涨，你手里的老债券就跌价。**债券的另一半风险**。","例子":"你持有的债券票息 3%。市场利率涨到 4%，新债更香，你的旧债只能降价卖——**100 元的债可能只能卖 97 元**。","误区":"**以为债券基金\"稳健\"就不会亏**。2022 年 11 月，市场利率快速上行，大量纯债基金一个月跌 1%~2%——**这就是利率风险，不是信用风险**，债没违约，价格照样跌。","辨析":"（vs 信用风险）信用风险靠分散化解（多买几家），利率风险**分散也没用**（整个市场一起跌）。**久期越长，利率风险越大。**"},"vs":["信用风险"]},{"id":"债券评级","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":2,"root":false,"x":104.16,"y":392.21,"f":{"一句话":"评级机构给债券打的\"还钱能力分\"，从 AAA 到 D。","例子":"AAA 最安全（国债、大型央企），AA+ 到 AA- 是常见投资级，**BBB 以下（含）通常被称作\"垃圾债\"**，D 是已违约。**但要留意：国内评级市场上 AAA 级债券占比一度超过 60%，评级虚高是公认问题**——别只看符号。","误区":"**把评级当保证**。评级是**意见**不是担保——2008 年美国次贷危机中，大量最终违约的债券在崩盘前仍挂着 AAA。评级机构**向发行人收费**，这个商业模式本身有利益冲突。","提醒":"**国内评级普遍偏高**（AAA 占比远高于国际市场）。看评级时，**更要看它有没有被下调过**——下调往往意味着问题已经开始暴露。"},"vs":[]},{"id":"违约","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":3,"root":false,"x":549.82,"y":876.73,"f":{"一句话":"真的没还上。**信用风险的最终形态**。","例子":"2020 年永煤控股债券违约，AAA 级国企债突然还不上钱，引发整个债市恐慌，大量债券基金单日大跌。","误区":"以为\"国企债、AAA 债不会违约\"。**永煤就是 AAA 国企**。刚性兑付早就打破了，**没有\"大而不倒\"这回事**。","辨析":"（vs 破净）破净是**价格波动**（净值跌破 1 元，多半会涨回来）；违约是**实质性损失**（钱真的拿不回来）。**破净是浮亏，违约是实亏。**","提醒":"个人投资者**几乎不应该直接买信用债**——你没有能力评估违约风险，也承受不起。想投债券就买**债券基金**，让它分散。"},"vs":["破净"]},{"id":"久期","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":3,"root":false,"x":800.55,"y":228.21,"f":{"一句话":"债券对利率有多敏感，也约等于\"平均多久能收回本钱\"。","例子":"久期 5 年，市场利率涨 1%，债券价格大约跌 5%；久期 2 年，只跌约 2%。**久期是放大器倍数**。","误区":"以为\"久期=到期期限\"。**不是**——久期通常**短于**到期期限，因为中途有票息收回。付息越多的债，久期越短。","提醒":"**判断债券基金的风险，看它的平均久期，不看名字**。同样是\"纯债基金\"，久期 1 年和久期 5 年的，波动能差 5 倍。**预期利率上行时，选短久期**。"},"vs":[]},{"id":"债券基金","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":10,"root":false,"x":132.34,"y":1065.15,"f":{"一句话":"一篮子债券。你买的是\"分散\"，不是某一只债。","例子":"一只债基持有 50 只债券，其中一只违约，对净值的冲击可能只有 0.2%——**这就是分散的价值**。","误区":"以为\"名字里带债就一定稳\"。**含权债基（能买股票的）波动大得多**——2022 年二级债基普遍跌 3%~5%，纯债基金只跌 1%~2%。**看清它能不能买股票。**","辨析":"（vs 股票基金）债基的收益上限低（靠利息），但波动也小；股基收益空间大，波动也大。**配置债基的目的是\"压舱石\"，不是\"赚大钱\"。**"},"vs":["股票基金"]},{"id":"纯债基金","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":6,"root":false,"x":328.51,"y":1032.0,"f":{"一句话":"只买债券、完全不碰股票的基金。","例子":"长期年化约 3%~4%，最大回撤通常 1%~3%。**比货币基金高，比股票基金稳。**","误区":"以为纯债\"绝对不亏\"。**会亏**——2022 年 11 月债市调整，很多纯债基金一个月跌 1%~2%。它的风险来自**利率**，不是股票。","辨析":"（vs 二级债基）纯债**完全不碰股票**，二级债基可以拿最多 20% 买股票。**二级债基收益弹性更大，回撤也更大。**名字里的\"二级\"跟风险等级无关，是说它能参与的 market 层级。"},"vs":["二级债基"]},{"id":"二级债基","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":4,"root":false,"x":-45.23,"y":835.19,"f":{"一句话":"主要买债券，但可以拿最多 20% 的钱买股票。","例子":"80% 债券 + 20% 股票的配置，长期年化约 4%~6%，但 2022 年这类基金普遍跌 3%~5%。","误区":"以为\"债基\"就是稳的。**那 20% 的股票仓位，足以让它在股市大跌时跟着跌**。你以为买的是债，其实承担了一部分股票风险。","辨析":"（vs 纯债基金）多 20% 股票的收益弹性，换多几倍的波动。**想稳就选纯债，想多一点弹性才选二级债基。**","提醒":"现在还有\"**固收+**\"这个更模糊的说法——**它没有统一的股票仓位规定**，可能 5% 也可能 30%，**必须看具体合同**。"},"vs":["纯债基金"]},{"id":"固收+","kind":"term","fam":1,"cat":"E","catName":"债券与固收","deg":3,"root":false,"x":796.13,"y":1370.48,"f":{"一句话":"债券打底，加一点股票/可转债/打新来增强收益。那个\"+\"就是增强的部分。","例子":"典型配置是 85% 债 + 15% 权益，长期年化目标 4%~6%，但 2022 年很多\"固收+\"跌了 4% 以上。","误区":"**被\"固收\"两个字骗了，没看那个\"+\"是什么**。\"+\"可能是股票、可转债、衍生品，**每种的风险完全不同**。而且\"固收+\"**没有统一的监管定义**——各家自己说了算。","辨析":"（vs 纯债基金）纯债是只有固收，\"固收+\"是多了一点风险敞口换收益。**买之前一定要看招募说明书里的资产配置比例。**","提醒":"**别拿\"固收+\"当存款替代品**。它在债市和股市同时下跌时会双杀，2022 年就发生过。"},"vs":["纯债基金"]},{"id":"基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":52,"root":true,"x":-81.04,"y":1258.29,"f":{"一句话":"把很多人的钱凑起来，交给专业的人去投资，赚亏按份额分摊。","例子":"你出 1000 元买某只基金，等于间接持有了它买的一篮子股票或债券。基金涨 10%，你的 1000 元变 1100 元。","误区":"以为\"交给专业的人\"就等于\"能赚钱\"。**大部分主动基金长期跑不赢指数**——这是全球统计事实。买基金买的是\"省事\"和\"分散\"，不是\"保证赚钱\"。","辨析":"（vs 股票、债券）直接买股票是你自己挑公司，买基金是让别人替你挑一篮子。**基金的核心价值是分散**——1000 元买不了 1 手茅台，但能买一只持有 300 只股票的基金。"},"vs":["股票","债券"]},{"id":"公募基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-265.32,"y":1294.76,"f":{"一句话":"谁都能买的基金。公开募集、公开披露，1 元起投。","例子":"支付宝、天天基金上能搜到的都是公募基金，申购门槛常常 10 元甚至 1 元。","误区":"以为公募基金不如私募\"高端\"所以赚得少。**公募的信息披露、托管、监管都远比私募严格**——这是保护，不是劣势。","辨析":"（vs 私募基金）公募**谁都能买、信息透明、随时可查净值**；私募 **100 万起、不公开宣传、信息披露少**。门槛低不等于质量差。","提醒":"公募基金受证监会监管，**必须披露持仓、净值、费率**。遇到不披露的\"基金\"，先怀疑是不是假的。"},"vs":["私募基金"]},{"id":"私募基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":108.82,"y":1282.76,"f":{"一句话":"只卖给有钱人的基金。100 万起投，不能公开宣传。","例子":"某私募基金要求合格投资者认定——金融资产不低于 300 万，或近三年年均收入不低于 50 万。","误区":"**以为\"门槛高=更安全\"**。恰恰相反：私募**信息披露少、流动性差（常有锁定期）、策略可以很激进**，而且**跑路和暴雷的案例远多于公募**。门槛高只说明监管假设你\"亏得起、也看得懂\"。","辨析":"（vs 公募基金）**公募可以公开宣传、1 元起投**；**私募不能公开宣传、100 万起投，且要求金融资产不低于 300 万**。私募费率高（还有业绩提成）、流动性差。**门槛本身就是一种保护**——够不到门槛的人，本来就不该买。","提醒":"**私募不得公开宣传、不得承诺保本保收益**。谁在微信群里向你推销私募，本身就是违规信号。"},"vs":["公募基金"]},{"id":"开放式基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-58.2,"y":1719.21,"f":{"一句话":"随时可以申购赎回的基金。**绝大多数基金都是这种**。","例子":"你今天下午 3 点前赎回，按今天收盘净值成交；3 点后算明天。","误区":"以为\"随时能赎回\"就等于\"随时能拿到钱\"。**赎回要 T+1 确认、T+2 甚至更久到账**，QDII 基金可能一周以上。**\"能赎回\"和\"钱到账\"是两件事。**","辨析":"（vs 封闭式基金）开放式随时进出（流动性好，但基金经理被迫留现金应对赎回）；封闭式锁期内不能动（基金经理可以满仓操作，但你的钱被锁死）。"},"vs":["封闭式基金"]},{"id":"封闭式基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-303.13,"y":1518.03,"f":{"一句话":"有固定存续期，期内不能赎回，只能在交易所买卖。","例子":"一只 3 年封闭期基金，你买了之后 3 年内**不能赎回**，想卖只能在场内按市价转给别人（可能折价）。","误区":"以为\"封闭\"能带来更高收益。**封闭确实让基金经理能满仓操作，但也意味着你在最需要钱的时候取不出来**。","辨析":"（vs 开放式基金）**开放式随时申赎，份额会变**；**封闭式有固定存续期、期内不能赎回**，只能像股票一样在二级市场卖给别的投资者——**因此常常折价交易**。买之前一定看清能不能随时取。","提醒":"买封闭式产品前，必须确认**这笔钱在封闭期内绝对不用**。为了多零点几个点的收益锁死流动性，是最常见的亏本买卖。"},"vs":["开放式基金"]},{"id":"场内基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":6,"root":false,"x":-504.67,"y":1941.36,"f":{"一句话":"在股票交易所里买卖的基金，**要开股票账户**，像买股票一样实时成交。","例子":"ETF 就是典型的场内基金。你挂 3.5 元买入，成交就是 3.5 元，**盘中价格随时在变**。","误区":"以为场内基金\"更专业所以更好\"。**场内价格会偏离净值**（溢价/折价）——热门时你可能花 3.6 元买到实际值 3.5 元的份额。而且**场内交易要自己盯盘、自己下单**，不像场外那样自动扣款。","辨析":"（vs 场外基金）场内**实时成交、费率低、可日内波段**，但要开股票账户、有溢价风险；场外**按净值成交、可自动定投**，但价格当天不可见、费率稍高。"},"vs":["场外基金"]},{"id":"场外基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":5,"root":false,"x":-362.27,"y":2217.51,"f":{"一句话":"在银行、基金公司 App、第三方平台上买的基金。**按当天收盘净值成交**。","例子":"在支付宝买 1000 元基金，当天下午 3 点前下单，按当天净值买入，T+1 确认份额。","误区":"以为下单时看到的价格就是成交价。**场外基金是\"未知价交易\"**——你下单时只知道昨天和前天的净值，**今天的成交价要等收盘后才知道**。","辨析":"（vs 场内基金）**场内是在证券交易所买卖**（要有股票账户、像买股票一样、价格实时变动）；**场外是在基金公司/银行/APP 申赎**（按当天收盘净值成交，一天一个价）。**ETF 场内买费率更低、到账更快。**","提醒":"**下午 3 点是分界线**。3 点前算今天，3 点后算下一个交易日。想按某个净值买入，要卡准时间。"},"vs":["场内基金"]},{"id":"ETF","kind":"term","fam":2,"cat":"F","catName":"基金","deg":6,"root":false,"x":-859.62,"y":1971.55,"f":{"一句话":"在场内交易的指数基金。一篮子股票打包成一个代码，像买股票一样买卖。","例子":"沪深300ETF，买 1 手（100 份）约几百元，就相当于同时持有沪深 300 只股票。","误区":"以为 ETF 都\"跟踪指数、没有风险\"。**ETF 只是工具**——有跟踪沪深300的，也有跟踪半导体、白酒、甚至 2 倍杠杆的。**波动可以极大。**","辨析":"（vs ETF联接基金）ETF **场内买、实时成交、费率最低**；ETF 联接基金是**场外买的\"替身\"**，它拿着你的钱去买对应的 ETF，多一层管理费，但可以自动定投。"},"vs":["ETF联接基金"]},{"id":"ETF联接基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-824.31,"y":2318.99,"f":{"一句话":"场外版的 ETF。你不用开股票账户，也能买到对应的指数。","例子":"你想投沪深300但没股票账户，就买\"沪深300ETF联接基金\"，它把 90% 以上的钱拿去买对应的 ETF。","误区":"以为它和 ETF 完全一样。**它多一层费用**（联接基金自身的管理费 + 底层 ETF 的管理费），长期下来会拖累收益。**能买 ETF 就买 ETF。**","辨析":"（vs ETF）联接基金存在的唯一理由是**购买渠道**——它让没开股票账户的人也能买指数。代价是费用略高、申赎慢一天。","提醒":"**联接基金通常有 A 类和 C 类之分**，短期持有选 C，长期选 A。选错了会多付不少费用。"},"vs":["ETF"]},{"id":"指数基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":9,"root":false,"x":-711.98,"y":1283.73,"f":{"一句话":"照着指数抄作业的基金。指数里有什么它就买什么，不靠基金经理挑。","例子":"沪深300指数基金就是买入沪深最大的 300 家公司，按市值比例分配。","误区":"以为\"被动投资=不用挑\"。**跟踪同一个指数的不同基金，业绩也能差不少**——差别在跟踪误差和费率。**选费率低的。**","辨析":"（vs 主动基金）指数基金**费率低（0.15%~0.5%）、透明、不依赖人**；主动基金**费率高（1.2%~1.5%）、依赖基金经理**。**长期看，多数主动基金跑不赢指数**——这就是指数基金存在的理由。"},"vs":["主动基金"]},{"id":"增强指数基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":-781.85,"y":1082.37,"f":{"一句话":"抄指数为主，但允许基金经理做一点主动发挥，试图跑赢指数一点点。","例子":"跟踪沪深300的增强基金，长期可能每年比指数多赚 1%~3%（也可能少赚）。","误区":"以为\"增强\"就是\"一定更好\"。**增强也可能变成\"减弱\"**——经理判断错了就跑输指数，而且**费率比纯指数基金高**。","辨析":"（vs 指数基金）纯指数基金**只求跟上**，增强指数基金**求跑赢**。前者费率更低、更可预测，后者多了一点可能性也多了一点不确定。"},"vs":["指数基金"]},{"id":"主动基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-488.93,"y":1021.05,"f":{"一句话":"基金经理自己挑股票，目标是跑赢指数。","例子":"某主动基金重仓白酒和新能源，如果押对了，一年可能跑赢指数 20%；押错了就跑输 20%。","误区":"**以为\"明星基金经理\"能持续跑赢**。统计上，**能连续 5 年跑赢指数的主动基金极少**，而且过去的业绩对未来的预测力很弱。追捧去年的冠军基金，往往第二年就吃瘪。","辨析":"（vs 指数基金）主动基金赌的是\"人比市场聪明\"，指数基金承认\"市场很难战胜\"。**你多付的那 1% 管理费，就是在为前一个信念下注。**","提醒":"选主动基金，**看费率、看基金经理任职年限、看最大回撤**，比看收益率排名有用得多。"},"vs":["指数基金"]},{"id":"股票基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":6,"root":false,"x":-302.35,"y":1046.85,"f":{"一句话":"80% 以上的钱都买股票的基金。**波动最大的基金类型之一**。","例子":"2022 年偏股型基金平均跌超 20%，2019~2020 年又平均涨 40% 以上。**同一只基金，年份之间可以差 60 个百分点。**","误区":"以为\"基金比股票稳\"。**股票基金的波动可以接近股票**——它只是一篮子股票，分散了个股风险，**没分散市场风险**。","辨析":"（vs 债券基金）股基收益空间大、波动大、适合长期；债基收益有限、波动小、适合压舱。**两者不是\"谁更好\"，是\"谁更适合你的期限和心脏\"。**"},"vs":["债券基金"]},{"id":"混合基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":10,"root":false,"x":337.49,"y":1479.0,"f":{"一句话":"股票和债券都买，比例由基金经理定。","例子":"偏股混合可能 70% 股票 + 30% 债券；偏债混合反过来。灵活配置的仓位可以 0%~95% 之间大幅调整。","误区":"**只看名字里的\"混合\"就以为风险居中**。\"混合\"这个词覆盖的范围极宽——**从几乎全债到几乎全股都有可能**。必须看实际的股票仓位。","辨析":"（vs 股票基金、债券基金）混合基金是两者的**连续谱**，不是一个固定档位。**判断它的风险，唯一可靠的方法是看季报里的实际持仓比例。**"},"vs":["股票基金","债券基金"]},{"id":"偏股混合","kind":"term","fam":2,"cat":"F","catName":"基金","deg":5,"root":false,"x":410.81,"y":1671.57,"f":{"一句话":"混合基金里偏股票那头，股票仓位通常在 50%~70%。","例子":"股票仓位通常在 **60%~95%**（合同里会写区间），剩下的配债券。**长期收益接近股票基金，但波动略小**——就靠那点债券垫着。","误区":"以为\"混合\"就意味着稳。**偏股混合在熊市照样能跌 30%**——它的股票仓位决定了它跟股票同呼吸。","辨析":"（vs 偏债混合）偏股是**收益进攻型**，偏债是**防守型**。名字里的那个字，直接决定了它在熊市里跌多少。"},"vs":["偏债混合"]},{"id":"偏债混合","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":607.1,"y":1579.32,"f":{"一句话":"混合基金里偏债券那头，债券仓位更高，股票只是点缀。","例子":"典型配置 70% 债 + 30% 股，长期年化约 4%~5%，熊市回撤通常比偏股小一半。","误区":"**把它当纯债基金买**。那 30% 的股票在股灾时照样拖累净值——2022 年偏债混合普遍跌 3%~6%，而纯债基金只跌 1%~2%。","辨析":"（vs 偏股混合）同样是\"混合\"，**偏债的波动可能只有偏股的三分之一**。别被同一个大类的名字骗了。"},"vs":["偏股混合"]},{"id":"灵活配置","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":665.11,"y":1809.92,"f":{"一句话":"股票仓位可以在很大区间内自由调整的混合基金（常见 0%~95%）。","例子":"基金经理看好市场时可以加到 90% 股票，看空时能降到 0%。**理论上能躲过熊市。**","误区":"**以为\"灵活\"是优点**。实际上它把择时的责任全压在了基金经理身上——**绝大多数人择时都是错的**。而且灵活配置基金**风险极不确定**：你买的时候它可能满仓股票，一年后可能全债，**你根本不知道自己承担了多少风险**。","辨析":"（vs 偏股混合）偏股混合有明确的仓位区间（你能预期风险），灵活配置**没有**（你无法预期）。**不确定性本身就是一种风险。**","提醒":"多数理财顾问建议**回避灵活配置基金**——不是因为它不好，而是因为你无法判断它的风险敞口。"},"vs":["偏股混合"]},{"id":"QDII基金","kind":"term","fam":2,"cat":"F","catName":"基金","deg":2,"root":false,"x":138.58,"y":1539.26,"f":{"一句话":"用人民币买境外资产的基金。你不用换汇、不用开海外账户。","例子":"买一只跟踪纳斯达克100的 QDII 基金，用人民币就能投美股科技股。","误区":"以为它只是\"买了外国股票\"。**它多了两层风险**：① **汇率风险**——人民币升值会吃掉你的美元收益；② **额度限制**——QDII 有外汇额度，**经常限购甚至暂停申购**，想加仓时可能买不进。","提醒":"**QDII 赎回到账特别慢**（常需 T+7 以上，因为要跨市场结算）。急用钱别放这里。费率也普遍高于境内基金。"},"vs":[]},{"id":"FOF","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":-98.18,"y":1476.21,"f":{"一句话":"基金中的基金——它不直接买股票，买的是**别的基金**。","例子":"你买一只 FOF，它再去买 10 只不同的基金。相当于**双重分散**。","误区":"以为\"双重分散=更安全\"。**双重分散也意味着双重收费**——你付 FOF 的管理费，还要间接承担底层基金的管理费。**总费率可能是普通基金的两倍**，长期严重拖累收益。","辨析":"（vs 基金）普通基金直接持股，FOF 持基。**FOF 的价值在于\"帮你选基金+做资产配置\"**——如果你自己会选，就没必要多付这层费用。"},"vs":["基金"]},{"id":"REITs","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":-269.69,"y":828.15,"f":{"一句话":"不动产投资信托基金——你出钱买下高速公路、产业园、仓储物流的一部分，靠收租分红。","例子":"某高速公路 REITs，每年分红率约 4%~6%，但**价格本身也会涨跌**，可能亏本金。","误区":"**以为它是\"固定收益产品\"**。REITs 的分红来自租金，**不保证**；而且它**在交易所上市交易，价格波动可以很大**（部分 REITs 上市后跌超 20%）。","辨析":"（vs 债券）债券还本付息是**合同义务**，REITs 分红是**经营结果**。资产经营不好，分红就少，价格也跌。","提醒":"REITs 的**流动性不如股票**（成交量小），急卖可能砸价。适合作为**长期收息配置**，不适合短期炒作。"},"vs":["债券"]},{"id":"基金份额","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":314.32,"y":1208.96,"f":{"一句话":"你持有多少份基金。**份额乘以净值，才是你的钱。**","例子":"1000 元按净值 1.25 元买入，得到 800 份。净值涨到 1.5 元，你的 800 份值 1200 元。","误区":"**盯着份额数以为那就是钱**。份额固定不变（除非分红再投或申赎），**变的永远是净值**。份额多不代表钱多——1 万份净值 0.5 元的基金只值 5000 元。","辨析":"（vs 净值）份额是\"你有多少张\"，净值是\"每张值多少钱\"。**两个数相乘才是你的资产。**"},"vs":["净值"]},{"id":"申购费","kind":"term","fam":2,"cat":"F","catName":"基金","deg":5,"root":false,"x":-133.33,"y":1944.61,"f":{"一句话":"买入基金时收的一次性费用。","例子":"标准申购费常是 1.5%，**但大部分平台打一折到 0.15%**。买 1 万元，付 15 元而不是 150 元。","误区":"**在银行柜台买基金，按原价 1.5% 收费**——同样的基金，在第三方平台买只要 0.15%。**买之前先比渠道**，这中间差 10 倍。","辨析":"（vs 赎回费）申购费是**买入**时收，赎回费是**卖出**时收。**A 类份额收申购费（不收销售服务费），C 类份额反过来。**"},"vs":["赎回费"]},{"id":"赎回费","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-97.52,"y":2181.32,"f":{"一句话":"卖出基金时收的费用。**持有越久越便宜，持有太短会被罚**。","例子":"持有 7 天内赎回，费率 **1.5%**（惩罚性）；持有 7 天到 1 年，约 0.5%；持有 2 年以上，通常 **0**。","误区":"**短线买卖基金**。7 天内赎回要付 1.5%——**你得先赚 1.5% 才回本**，而基金一周涨 1.5% 并不常见。频繁申赎是散户亏钱的主要方式之一。","辨析":"（vs 申购费）**申购费买的时候收，赎回费卖的时候收。** 关键在于**赎回费随持有时间递减**——不少基金持有满一定年限后直接降为 0。**这正是监管在鼓励长期持有**；频繁申赎的人，费用会吃掉大部分收益。","提醒":"**赎回费的一部分会计入基金资产**（留给继续持有的人），这是监管为了抑制短线交易设计的。**别跟这个规则对着干。**"},"vs":["申购费"]},{"id":"管理费","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-745.79,"y":1674.72,"f":{"一句话":"基金公司每年从净值里**默默扣走**的钱，你感觉不到但一直在付。","例子":"主动基金约 1.2%~1.5%/年，指数基金约 0.15%~0.5%/年。10 万元持有 10 年，按 1.5% 算，**累计被扣掉约 1.6 万元**。","误区":"**以为\"没看见扣费就是没收\"**。管理费是**从净值里直接扣**的——你看到的净值**已经是扣完费之后**的数。所以它永远不会出现在你的账单上，但确实少赚了。","辨析":"（vs 托管费）管理费给**基金公司**（管投资），托管费给**托管银行**（管钱的安全）。两笔都从净值里扣。","提醒":"**费率是少数几个能提前确定的变量**。业绩无法预测，费率可以——**同样的策略选费率低的**。"},"vs":["托管费"]},{"id":"托管费","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":-523.76,"y":1688.99,"f":{"一句话":"银行替你\"看着\"这笔钱收的费用，防止基金公司挪用。","例子":"通常 0.05%~0.25%/年，比管理费低不少。","误区":"觉得这笔钱白花。**托管是隔离机制**——基金的钱存在托管银行，**独立于基金公司自有资产**。基金公司倒闭，你的钱还在托管账户里。**这是保护你的成本。**","辨析":"（vs 管理费）管理费买的是\"投资能力\"，托管费买的是\"资金安全\"。**后者便宜但更基础**——没有它，前者毫无意义。"},"vs":["管理费"]},{"id":"销售服务费","kind":"term","fam":2,"cat":"F","catName":"基金","deg":3,"root":false,"x":-281.04,"y":1758.89,"f":{"一句话":"C 类份额特有的费用，按年收，用来替代申购费。","例子":"C 类份额通常不收申购费，但每年收 0.2%~0.8% 的销售服务费（从净值扣）。持有 1 年，10 万基金付约 200~800 元。","误区":"**以为 C 类\"免申购费\"就更便宜**。这要看你持有多久——**持有时间短选 C（省申购费），持有时间长选 A（省销售服务费）**。有个简单的盈亏平衡点。","辨析":"（vs 申购费）**申购费是买的时候一次性收**（股票基金常见 1.5%，现在多打一折）；**销售服务费是按年从基金资产里扣**（每年 0.2%~0.8%）。**不收申购费的 C 类份额，就是靠销售服务费补回来的**——**持有时间短选 C 类，长选 A 类。**","提醒":"粗略算法：**A 类申购费（打折后约 0.15%）÷ C 类年销售服务费（约 0.4%）≈ 持有 4 个月**。超过这个时间，A 类更划算。"},"vs":["申购费"]},{"id":"定投","kind":"term","fam":2,"cat":"F","catName":"基金","deg":5,"root":false,"x":96.22,"y":783.65,"f":{"一句话":"固定时间、固定金额买入同一只基金。**用纪律对抗情绪**。","例子":"每月 1 号投 1000 元。净值 1.0 时买 1000 份，跌到 0.8 时买 1250 份——**跌的时候自动买得更多**，平均成本被拉低。","误区":"**以为定投\"稳赚不赔\"**。定投只摊平成本，**不改变标的本身的涨跌**——如果投的是长期下跌的资产，定投一样亏，只是亏得慢一点。而且**定投需要\"止盈\"**——牛市高点不止盈，收益会全部还回去。","辨析":"（vs 一次性买入）一次性买入**赌时点**（买对了收益高，买错了全套牢）；定投**放弃择时**（收益平庸但不容易巨亏）。**不知道市场会怎么走时，定投是更稳的选择。**","提醒":"定投最难的**不是开始，是坚持**——尤其在最该加码的低点，那时候你往往最想停。"},"vs":["一次性买入"]},{"id":"基金分红","kind":"term","fam":2,"cat":"F","catName":"基金","deg":4,"root":false,"x":195.01,"y":1806.06,"f":{"一句话":"把基金赚的一部分钱，以现金形式分给你。","例子":"你持有 1000 份、净值 1.5 元（值 1500 元），每份分红 0.2 元——你收到 200 元现金，**净值同时降到 1.3 元**（你的份额值 1300 元）。","误区":"**以为分红是\"额外赚的\"**。**不是**——分红后净值等额下降，**你的总资产一分没变**，只是把左口袋的钱放到右口袋。","辨析":"（vs 红利再投资）现金分红是**拿走现金**（如果你想花）；红利再投资是**自动买回份额**（如果你想让复利继续滚）。","提醒":"**分红本身不创造价值。** 但基金分红**免个人所得税**，所以对需要现金流的人有一点税务上的便利。"},"vs":["红利再投资"]},{"id":"红利再投资","kind":"term","fam":2,"cat":"F","catName":"基金","deg":5,"root":false,"x":570.26,"y":1351.86,"f":{"一句话":"分红不拿现金，自动按当天净值买回份额。**让复利不断档。**","例子":"同上例，200 元分红按 1.3 元净值买回 153.8 份——你从 1000 份变成 1153.8 份，**总资产不变但份额变多了**。","误区":"以为\"现金分红更实在\"。**长期投资选红利再投资更好**——现金分出来的钱如果不马上投出去，就脱离了复利循环；而且自己再投还要再付一次申购费。","辨析":"（vs 基金分红）分红是**动作**，红利再投资是**这个动作的一种处理方式**（另一种是拿现金）。**默认选项经常是现金分红——想复利就得手动改成再投资。**","提醒":"在**申购时或持有期间**都可以修改分红方式。**长期定投的人，第一件事就该把它改成红利再投资。**"},"vs":["基金分红"]},{"id":"股票","kind":"term","fam":2,"cat":"G","catName":"股票","deg":33,"root":true,"x":-1166.52,"y":634.07,"f":{"一句话":"买公司的一小块。公司赚钱你分红，公司值钱你的股票就涨。","例子":"买入某公司 100 股，你就成了它的股东之一，享有分红权和投票权（虽然 100 股的话语权约等于零）。","误区":"**把股票当筹码而不是公司**。股价长期看是由公司赚不赚钱决定的，短期才是情绪博弈。**只盯 K 线不看公司的人，长期大概率亏钱。**","辨析":"（vs 债券）**债券是借钱（你是债主，收益有上限、公司破产先还你），股票是入股（你是股东，收益无上限、破产最后才轮到你）**。风险收益的差别就来自这个顺序。"},"vs":["债券"]},{"id":"A股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1657.7,"y":1433.63,"f":{"一句话":"在境内（上海、深圳）上市、用人民币买卖的股票。**你在国内开的股票账户买的就是它。**","例子":"贵州茅台、宁德时代都是 A 股。代码 6 开头是沪市，0 和 3 开头是深市。","误区":"以为 A 股是\"中国最好的公司\"。**很多优质中国公司不在 A 股**——腾讯、阿里、美团都在香港或美国上市。想投它们要走港股通或 QDII。","辨析":"（vs H股）A 股和 H 股**是同一家公司的两种股票**，但**价格经常不一样**（A/H 溢价）。同一家公司，A 股常常比 H 股贵。"},"vs":["H股"]},{"id":"H股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1810.19,"y":1247.01,"f":{"一句话":"内地公司在香港上市的股票，用港币交易。**\"H\"就是 Hong Kong。**","例子":"中国平安、招商银行都是 A+H 两地上市。**同一家公司、同样的分红权，H 股价格常常比 A 股低 20%~40%**——这个差价叫 AH 溢价。","误区":"以为\"同一家公司股价应该一样\"。**两地市场隔离，价格可以长期差 30% 以上**——因为投资者结构、资金流动性、汇率预期都不同。","辨析":"（vs A股）**A 股在内地上市、用人民币交易**；**H 股在香港上市、用港币交易**。同一家公司可以两地同时上市（A+H），**但两边股价常有差异，这就是 AH 溢价**。**H 股通常更便宜**，但内地个人买 H 股有门槛（港股通需 50 万资产）。","提醒":"个人买 H 股需要**开通港股通**（门槛 50 万资产）或直接开香港券商账户。**港股没有涨跌停限制**，一天跌 30% 是常事。"},"vs":["A股"]},{"id":"蓝筹股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":3,"root":false,"x":-953.49,"y":882.49,"f":{"一句话":"大而稳的老牌公司股票。名字来自赌场里最值钱的蓝色筹码。","例子":"沪深 300 的成分股基本就是蓝筹的代表——**300 家公司占了 A 股总市值的半壁江山**。银行、白酒、家电龙头是典型：市值大、盈利稳定、分红多、波动相对小。","误区":"**以为\"蓝筹=安全\"**。蓝筹只是\"大\"，不代表\"不会跌\"——2008 年花旗银行跌了 90% 以上，它当年也是蓝筹。**大公司一样会衰败。**","辨析":"（vs 成长股）蓝筹**成熟、增速慢、分红多**；成长股**年轻、增速快、分红少**。前者像中年稳健派，后者像年轻创业派。"},"vs":["成长股"]},{"id":"成长股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":5,"root":false,"x":-1127.53,"y":1065.74,"f":{"一句话":"增长很快的公司股票。市场愿意为它的\"未来\"付高价。","例子":"某新能源公司年收入增长 60%，市盈率 80 倍——**贵是因为大家在赌它未来还能高速增长**。","误区":"**以为\"增长快=股票会涨\"**。增长快这件事**已经反映在股价里了**（所以才 80 倍市盈率）。真正的风险是**增长一旦放缓，估值和业绩双杀**——跌 70% 很常见。","辨析":"（vs 价值股）成长股**赌未来**（估值高、分红少），价值股**看现在**（估值低、分红多）。**没有谁一定更好，取决于你买的价格。**"},"vs":["价值股"]},{"id":"价值股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-960.39,"y":1225.87,"f":{"一句话":"股价相对便宜、分红比较多的公司股票。银行、公用事业是典型。","例子":"某银行股市盈率 5 倍、股息率 6%——**便宜且分红高**。","误区":"**以为\"便宜=会涨\"**。便宜可能是因为**市场认为它未来会变差**（比如坏账风险）。很多\"低估值\"股票可以低估十年不涨，这叫**价值陷阱**。","辨析":"（vs 成长股）价值股赚的是**估值修复和分红**，成长股赚的是**业绩增长**。两条完全不同的赚钱路径。"},"vs":["成长股"]},{"id":"ST股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":2,"root":false,"x":-1383.41,"y":1049.97,"f":{"一句话":"出了问题的公司，被交易所打上\"特别处理\"标签。**风险警示。**","例子":"连续两年亏损会被 ST，代码前加\"ST\"；有退市风险的加\"*ST\"。**涨跌幅限制收紧到 5%。**","误区":"**赌 ST 股重组翻身**。这是 A 股最经典的散户亏钱方式之一——**ST 股退市概率远高于摘帽概率**，而且一旦退市，你的钱基本归零（老三板流动性极差）。","提醒":"**注册制下退市越来越常态化**。\"壳价值\"的逻辑已经基本失效。**不懂就别碰。**"},"vs":[]},{"id":"主板","kind":"term","fam":2,"cat":"G","catName":"股票","deg":5,"root":false,"x":-2206.44,"y":270.93,"f":{"一句话":"最老牌、门槛最高的交易板块。沪市主板、深市主板。","例子":"大型成熟企业多在这里，代码 600/601/603（沪）和 000/001（深）。","误区":"以为主板\"更安全\"。**板块只反映上市门槛，不反映公司质量**——主板也有暴雷退市的公司。","辨析":"（vs 创业板）主板上市门槛**更高、公司更成熟**；创业板门槛低一些、公司成长性更强但**波动更大、退市更多**。"},"vs":["创业板"]},{"id":"创业板","kind":"term","fam":2,"cat":"G","catName":"股票","deg":5,"root":false,"x":-2456.2,"y":230.93,"f":{"一句话":"为成长型创新创业企业设的板块，深市，代码 300 开头。","例子":"宁德时代、迈瑞医疗在创业板。**涨跌幅限制 20%**（比主板的 10% 大一倍）。","误区":"**没注意涨跌幅是 20%**。这意味着**一天可能亏 20%**——比主板多亏一倍。而且创业板公司普遍规模小、波动大。","辨析":"（vs 科创板）都在为创新企业服务，**门槛不同**：创业板（深交所，300 开头）需 **10 万资产 + 24 个月交易经验**；科创板（上交所，688 开头）需 **50 万 + 24 个月**。**两者涨跌幅都是 20%**，都比主板（10%）波动大。","提醒":"开通创业板需要**2 年交易经验 + 10 万资产**。这个门槛是保护，不是刁难。"},"vs":["科创板"]},{"id":"科创板","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-2643.9,"y":449.71,"f":{"一句话":"为硬科技企业设的板块，沪市，代码 688 开头。**允许未盈利公司上市。**","例子":"中芯国际、寒武纪在科创板。涨跌幅 20%，**新股上市前 5 天不设涨跌幅限制**。","误区":"**以为\"科技=高增长\"**。科创板允许未盈利企业上市，意味着**你买的公司可能根本没有利润**，估值全靠想象。破发（上市后跌破发行价）很常见。","辨析":"（vs 创业板）和创业板相比，**科创板门槛更高**（50 万 vs 10 万）、**专为硬科技企业设立**，允许未盈利公司上市。**两者涨跌幅都是 20%**，都比主板的 10% 刺激——**门槛高不是歧视，是保护。**","提醒":"开通科创板需要**2 年经验 + 50 万资产**。**这是所有板块里门槛最高的之一**，因为它风险最大。"},"vs":["创业板"]},{"id":"市盈率","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1827.45,"y":543.62,"f":{"一句话":"股价是每股收益的几倍。**通俗说就是\"按现在的盈利水平，几年能回本\"。**","例子":"股价 30 元、每股收益 1 元，市盈率 = 30 倍。意思是按当前盈利，30 年回本（假设盈利不变）。","误区":"**以为\"市盈率低就是便宜\"**。低市盈率可能意味着**市场预期它未来盈利会下滑**（银行、地产常年 5 倍）。而且**亏损公司没有市盈率**（分母是负的）。不同行业的市盈率**根本不能直接比**——科技股 50 倍和银行股 5 倍都可能是合理的。","辨析":"（vs 市净率）市盈率看**盈利能力**（适合轻资产、盈利稳定的公司），市净率看**净资产**（适合银行、重资产行业）。"},"vs":["市净率"]},{"id":"市净率","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-2008.17,"y":697.62,"f":{"一句话":"股价是每股净资产的几倍。**\"花几倍价钱买公司的账面家底\"。**","例子":"股价 10 元、每股净资产 5 元，市净率 = 2 倍。","误区":"**以为\"破净（市净率<1）就是捡便宜\"**。破净可能意味着**市场认为这些资产会减值**——比如银行的不良贷款。破净股可以长期破净。","辨析":"（vs 市盈率）**盈利波动大的行业看市净率**（银行、券商、周期股），**盈利稳定的行业看市盈率**（消费、公用事业）。"},"vs":["市盈率"]},{"id":"ROE","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1583.24,"y":487.22,"f":{"一句话":"净资产收益率——股东每投入 1 块钱，公司一年赚回多少。","例子":"ROE 20% 意味着股东每 1 元净资产创造 0.2 元净利润。**巴菲特最看重的指标之一。**","误区":"**只看 ROE 高就买**。高 ROE 可能是**靠大量借债堆出来的**（分母净资产小，比值就大）——这种高 ROE 伴随着高负债风险。**要连负债率一起看。**","辨析":"（vs ROA）ROE 的分母是**净资产**（不含借来的钱），ROA 的分母是**总资产**（含借来的钱）。**两者差距越大，说明公司杠杆越高。**"},"vs":["ROA"]},{"id":"ROA","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1740.01,"y":309.21,"f":{"一句话":"总资产收益率——每 1 块钱资产赚回多少。**它不区分钱是自己的还是借的。**","例子":"ROA 5% 意味着公司每 1 元资产创造 0.05 元利润。银行等靠杠杆经营的行业 ROA 通常很低（1% 左右）。","误区":"**拿 ROA 直接跨行业比较**。银行 ROA 1% 和消费公司 ROA 15% 不能比——**银行靠 10 倍以上的杠杆放大了 ROE**，所以看银行要看 ROE 和 ROA 的差距。","辨析":"（vs ROE）ROA 剔除杠杆影响，**更能反映经营效率本身**；ROE 反映股东实际回报。**ROE 高但 ROA 低 = 靠借钱撑起来的。**"},"vs":["ROE"]},{"id":"股息率","kind":"term","fam":2,"cat":"G","catName":"股票","deg":3,"root":false,"x":-1768.66,"y":783.46,"f":{"一句话":"每年分红除以股价。**\"我买这只股票，光靠分红一年能拿几个点\"。**","例子":"股价 10 元、每股分红 0.6 元，股息率 = 6%。比银行存款高得多。","误区":"**只看股息率高就买**。高股息率可能是**股价暴跌造成的**（分子没变、分母变小）——这叫\"**股息率陷阱**\"。而且**分红不是承诺**，明年可能就不分了。","辨析":"（vs 分红）分红是**金额**（每股派多少钱），股息率是**比率**（分红÷股价）。**比较不同价位的股票，只能看股息率。**"},"vs":["分红"]},{"id":"分红","kind":"term","fam":2,"cat":"G","catName":"股票","deg":8,"root":false,"x":-1618.5,"y":965.38,"f":{"一句话":"公司把赚的钱分一部分给股东，通常直接发现金。","例子":"每 10 股派 6 元——你持有 1000 股，收到 600 元现金。","误区":"**以为分红是\"白拿的钱\"**。**不是**——分红后股价会**等额下调**（除息），你的总资产一分没变。分红只是把公司的钱变成你口袋的钱。","辨析":"（vs 送股）**分红发的是现金**（你拿到钱，股价下调），**送股发的是股票**（你拿到更多股，股价按比例下调）。两者本质都是\"把左口袋的钱挪到右口袋\"。","提醒":"**A 股分红要缴税，且和持股时间挂钩**——持股 1 个月以内税率 20%，1 个月到 1 年 10%，1 年以上**免征**。**长期持有更划算。**"},"vs":["送股"]},{"id":"送股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":5,"root":false,"x":-1575.17,"y":1216.51,"f":{"一句话":"公司不发钱，发股票——用股票代替现金分红。","例子":"\"10 送 10\"——你持有 1000 股，变成 2000 股，但**股价同时腰斩**（除权）。","误区":"**以为\"10 送 10 = 白赚一倍\"**。这是最经典的误解。**送股后股价按比例下调，你的总市值完全没变**——只是份额变多、每份变便宜。","辨析":"（vs 分红）**分红给现金**（要缴税），**送股给股票**（A 股送股也要缴税，按股票面值计税）。**送股还常被公司用来营造\"股价便宜了\"的错觉。**"},"vs":["分红"]},{"id":"配股","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-970.27,"y":1510.62,"f":{"一句话":"公司向**现有股东**要钱——按持股比例，以优惠价卖给你新股。","例子":"\"10 配 3，配股价 5 元\"——你持有 1000 股，可以按 5 元再买 300 股。**如果你不参与，你的持股比例会被稀释。**","误区":"**以为配股是\"公司送福利\"**。**不是**——配股价低于市价看着像优惠，但**你不参与就吃亏**（别人低价买了，你的份额被摊薄）。而且配股本身说明**公司缺钱**。","辨析":"（vs 增发）**配股向老股东要钱**（你有优先权，可以不参与但会被稀释），**增发向市场要钱**（通常是机构，跟你的关系是稀释）。"},"vs":["增发"]},{"id":"增发","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1195.27,"y":1531.94,"f":{"一句话":"公司向市场发新股融资。老股东的持股比例会被稀释。","例子":"公司增发 1 亿股，总股本从 4 亿变 5 亿——你原来占 1%，现在只占 0.8%。","误区":"**以为增发一定是利好或一定是利空**。要看钱用在哪：**扩产收购可能是好事，还债补流往往是坏事**。而且**增发价通常低于市价**，会短期压制股价。","辨析":"（vs 配股）都是公司再融资，**但发行对象不同**：**增发是向特定或不特定投资者发新股**（你不一定要参与）；**配股只向老股东按持股比例配售——你不参与就被稀释**。配股公告后必须主动决定买不买，忘了就吃亏。","提醒":"增发分**公开增发**（谁都能买）和**定向增发**（只卖给特定机构，常有锁定期）。**定增价格往往就是市场的重要参考位。**"},"vs":["配股"]},{"id":"除权除息","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-2041.1,"y":1165.45,"f":{"一句话":"分红或送股后，股价按比例下调的那个动作。**不是白送。**","例子":"股价 10 元、每 10 股派 6 元（每股 0.6 元），除息后股价变成 9.4 元。**你的总资产完全没变**（多了 0.6 元现金，少了 0.6 元股价）。","误区":"**看到股价\"跌了\"就恐慌**。除权除息日的下跌**不是真的跌**，是技术性调整。**分红前后你的总资产是一样的。**","辨析":"（vs 分红）分红是**公司给你钱**，除权除息是**股价相应下调**。**这两件事是同时发生的**，合起来看你的资产不变。**只有公司持续赚钱，除权后的股价才会\"填权\"涨回去。**"},"vs":["分红"]},{"id":"涨停/跌停","kind":"term","fam":2,"cat":"G","catName":"股票","deg":2,"root":false,"x":-1976.03,"y":976.75,"f":{"一句话":"一天最多能涨或跌多少，到了就不让交易了。**防止单日暴涨暴跌。**","例子":"主板 ±10%，创业板/科创板 ±20%，**ST 股 ±5%**。10 元的主板股票，一天最多涨到 11 元或跌到 9 元。","误区":"**以为\"涨停=还会继续涨\"**。涨停只是**当天买盘太多**，不代表公司变好了——连续涨停后连续跌停的案例比比皆是。而且**涨停时你往往买不进**（没人卖）。","提醒":"**港股、美股没有涨跌停限制**。买港股通或 QDII 之前要有心理准备——**一天跌 30% 是允许的。**"},"vs":[]},{"id":"成交量","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-734.69,"y":814.03,"f":{"一句话":"一天成交了多少股（或多少钱）。**反映市场有多活跃。**","例子":"某股今天成交 2000 万股，成交额 4 亿元。","误区":"**以为\"放量上涨=好事\"**。放量只是说明**分歧大**（有人拼命买、有人拼命卖）——它既可能出现在顶部（主力出货），也可能出现在底部（资金进场）。**量本身不指示方向。**","辨析":"（vs 换手率）成交量是**绝对数**（多少股），换手率是**相对数**（占比）。**大盘股成交量大但换手率可能很低，小盘股反之。**"},"vs":["换手率"]},{"id":"换手率","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-697.43,"y":603.0,"f":{"一句话":"成交量占总股数的比例。**它让不同规模的股票能横向比。**","例子":"某股流通股 1 亿股，今天成交 2000 万股，换手率 20%——**说明今天有五分之一的流通股换了主人，非常活跃**。","误区":"**以为\"换手率高=机会大\"**。换手率极高往往意味着**短线资金炒作、筹码不稳**——涨得快也跌得快。**换手率极低**（比如 0.2%）则说明**没人关注、想卖卖不掉**。","辨析":"（vs 成交量）成交量看**绝对规模**，换手率看**相对活跃度**。**跨股票比较必须用换手率。**"},"vs":["成交量"]},{"id":"市值","kind":"term","fam":2,"cat":"G","catName":"股票","deg":2,"root":false,"x":-1417.7,"y":1657.81,"f":{"一句话":"股价乘以总股数。**市场给这家公司的整体定价。**","例子":"股价 20 元、总股本 10 亿股，市值 200 亿元。","误区":"**以为\"股价低=公司小/便宜\"**。股价高低毫无意义——**10 元的股票可能比 500 元的公司还大**（因为股本不同）。**要比较公司大小，看市值；要看贵不贵，看估值。**","提醒":"市值分**总市值**和**流通市值**（可以自由交易的那部分）。**打新、指数纳入都看流通市值**，不是总市值。"},"vs":[]},{"id":"指数","kind":"term","fam":2,"cat":"G","catName":"股票","deg":7,"root":true,"x":-1170.1,"y":808.25,"f":{"一句话":"一篮子股票的平均表现，用来说明\"市场整体涨了还是跌了\"。","例子":"上证指数涨 1%，说明沪市整体涨了 1%——不是每只股票都涨，是大公司的权重拉动的。","误区":"**以为\"指数涨=我的股票就涨\"**。指数是**按市值加权**的——**大公司涨 5% 拉动的指数，可能比 1000 只小公司跌 2% 还多**。所以常有\"**指数涨了，我却在亏**\"。","辨析":"（vs 股票）**股票是一家公司，指数是一篮子股票的加权平均**（沪深 300 就是 300 家公司）。**买指数就是买一整个市场**——**单只股票可能退市归零，指数不会**（差的被剔除、好的被纳入）。**这正是指数基金适合新手的根本原因。**","提醒":"看市场别只看上证指数，**要看沪深300（大盘）、中证500（中盘）、中证1000（小盘）** 才知道各层次的真实情况。"},"vs":["股票"]},{"id":"沪深300","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1353.91,"y":577.96,"f":{"一句话":"沪深两市规模最大、流动性最好的 300 家公司。**A 股最有代表性的大盘指数。**","例子":"占 A 股总市值的一半以上。买沪深300指数基金，相当于买下 A 股最核心的 300 家公司。","误区":"**以为它代表\"整个 A 股\"**。它只代表**大盘股**——2021 年小盘股行情时，沪深300 明显跑输中证500。","辨析":"（vs 中证500）沪深300 是**最大的 300 家**（大盘），中证500 是**剔除300和更小之后、排名 301~800 的 500 家**（中盘）。**两者是互补的，一起买才是全市场。**"},"vs":["中证500"]},{"id":"中证500","kind":"term","fam":2,"cat":"G","catName":"股票","deg":4,"root":false,"x":-1417.06,"y":773.47,"f":{"一句话":"剔除沪深300 之后，总市值排名靠前的 500 家中盘公司。","例子":"成分股多是细分行业的龙头、成长型企业，**波动比沪深300 大，成长性也更强**。","误区":"**以为\"500 比 300 小，所以风险低\"**。恰恰相反——**中盘股的波动通常大于大盘股**，因为流动性差、业绩稳定性弱。","辨析":"（vs 沪深300）300 是**稳健的大盘蓝筹**，500 是**弹性更大的中盘成长**。**配置时可以按自己的风险偏好搭配。**"},"vs":["沪深300"]},{"id":"保险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":22,"root":true,"x":-1034.34,"y":-276.44,"f":{"一句话":"花钱买\"不出事\"的确定性。**它是对冲风险的工具，不是投资。**","例子":"每年交 3000 元买重疾险，一旦确诊癌症赔付 50 万——**用确定的小额支出，换掉不确定的大额损失**。","误区":"**把保险当理财买**。保险的核心价值是**保障**（杠杆几十倍），理财型保险的收益通常跑不赢通胀，而且**退保会亏本金**。想理财就买理财，想保障就买保障，**别混在一起**。","辨析":"（vs 社保）社保是国家强制的、保基本；商业保险是自愿的、按需买。**而且保险也不是投资**——投资是用风险换收益，保险是用保费换确定性，**两者功能相反。**"},"vs":["社保"]},{"id":"重疾险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":5,"root":false,"x":-1097.28,"y":188.75,"f":{"一句话":"确诊合同约定的重大疾病，**直接赔你一笔钱**。用途不限——治病、还房贷、养家都行。","例子":"买 50 万保额，确诊恶性肿瘤，保险公司打给你 50 万现金。**这钱你怎么花它不管。**","误区":"**以为重疾险是\"用来治病的\"**。它更像是**收入损失补偿**——生病后没法工作，这笔钱让你能继续还房贷、养孩子。**真正报销医疗费的是医疗险。**","辨析":"（vs 医疗险）**重疾险是给付型**（确诊就给钱，买多少赔多少，可以叠加多份）；**医疗险是报销型**（花多少报多少，不能超过实际花费）。**两者互补，不能只买一个。**"},"vs":["医疗险"]},{"id":"医疗险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":8,"root":false,"x":-924.31,"y":-70.59,"f":{"一句话":"报销你看病花的钱。**花多少报多少，不会多给你。**","例子":"住院花了 8 万，医保报了 5 万，剩下的 3 万医疗险再报（扣掉免赔额）。","误区":"**买多份医疗险想重复报销**。**不可能**——报销总额不能超过实际花费。多买纯属浪费钱。**想提高保额就买给付型的重疾险。**","辨析":"（vs 重疾险）**医疗险管\"花了多少\"，重疾险管\"损失多少\"**。前者报销医药费，后者补偿收入中断。"},"vs":["重疾险"]},{"id":"百万医疗险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":3,"root":false,"x":-869.99,"y":161.64,"f":{"一句话":"保额上百万、保费几百块的医疗险。**但有 1 万免赔额。**","例子":"30 岁的人一年保费约 300 元，保额 300 万。**但 1 万以下的花费不赔**——住院花 8000 元，一分不赔。","误区":"**以为有了它就不用买别的**。1 万免赔额意味着**它只保大病大灾**，日常住院用不上。而且它**通常是一年期产品，不保证续保**——你生病后第二年可能就买不到了。","辨析":"（vs 重疾险）**百万医疗险是报销型**（花多少报多少、有 1 万免赔额、**通常不保证续保**）；**重疾险是给付型**（确诊就赔一笔，买多少赔多少，可以叠加多份）。**前者管医药费，后者管收入中断**——不能互相替代。","提醒":"**优先选\"保证续保 X 年\"的产品**（如保证续保 20 年）。这个条款比保额数字重要得多——**否则理赔一次就可能被拒保。**"},"vs":["重疾险"]},{"id":"意外险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":3,"root":false,"x":-575.41,"y":174.2,"f":{"一句话":"只管意外——意外身故、意外伤残、意外医疗。**生病不赔。**","例子":"车祸身故赔 100 万；但**癌症身故一分不赔**，因为那是疾病不是意外。","误区":"**最常被误解的险种**。很多人以为\"买了意外险就有保障了\"——实际上**猝死、心梗、癌症全都不在保障范围内**（猝死严格来说属于疾病，部分产品会额外附加猝死责任）。而且\"意外\"的定义很严：**必须是外来的、突发的、非本意的、非疾病的**。","辨析":"（vs 医疗险）意外险只覆盖**意外导致的**医疗和身故，疾病一律不管。**它是补充，不是主力。**","提醒":"意外险**极便宜**（一年几十到几百元）、**不需要健康告知**，**杠杆最高**。是性价比最高的险种之一。"},"vs":["医疗险"]},{"id":"定期寿险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1533.61,"y":-562.42,"f":{"一句话":"保一段时间（比如 20 年或到 60 岁），期间身故就赔钱给家人。**便宜、纯粹。**","例子":"30 岁男性，保额 100 万、保 20 年，年保费可能只要几百元。","误区":"**以为\"人死了才赔，没意义\"**。它的意义是**给家人兜底**——如果你背着房贷、孩子还小，你是家庭收入支柱，**一旦倒下，这笔钱能让家人不至于卖房**。","辨析":"（vs 终身寿险）定期寿险**保一段时间、大概率不会赔付、所以极便宜**；终身寿险**一定赔付（人总会死）、所以贵得多**。**要保障就买定期，别买终身。**"},"vs":["终身寿险"]},{"id":"终身寿险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":6,"root":false,"x":-1315.03,"y":-636.87,"f":{"一句话":"保一辈子，人总会走，所以**一定会赔**。因此保费贵得多。","例子":"同样 100 万保额，终身寿险的年保费可能是定期寿险的 **10 倍以上**。","误区":"**把终身寿险当\"稳赚的理财\"**。它的储蓄成分收益很低，**而且前期退保会巨亏**（现金价值远低于已交保费）。真想要身故保障，**定期寿险的杠杆高得多**。","辨析":"（vs 定期寿险）终身寿险的意义不在\"保障\"（人总有一死，赔付必然发生，所以没有杠杆），而在**财富传承**（免税、定向给受益人）。"},"vs":["定期寿险"]},{"id":"增额终身寿","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1847.64,"y":-616.88,"f":{"一句话":"保额每年按约定利率复利增长的终身寿险。**常被当成\"稳健理财\"卖。**","例子":"交 10 年、每年 5 万，保额按合同利率逐年递增，几十年后现金价值可观。","误区":"**被\"复利增长\"吸引，没看流动性**。三个坑：① **前期现金价值远低于已交保费**，前几年退保亏得很惨；② **增长率是\"保额\"或\"现金价值\"的增长，不是你本金的收益率**——销售常把这两个概念混着说；③ 保险的预定利率**已经连续下调**，新产品收益远不如几年前的老产品。","辨析":"（vs 年金险）**年金险强制按年给你现金流**（防你一次性挥霍）；**增额终身寿的钱在账户里随时可取**（更灵活，但考验自控力）。**两者的前期现金价值都远低于已交保费**——**退保都亏**，只是亏多亏少的差别。","提醒":"它**流动性极差**——钱进去容易出来难。**只适合确定 10 年以上不用的闲钱。** 销售给你看的\"利益演示表\"**不是保证**，要分清哪一列是写进合同的。"},"vs":["年金险"]},{"id":"年金险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1735.04,"y":-425.27,"f":{"一句话":"交一笔钱，到约定时间后按年（或按月）领钱。**活多久领多久。**","例子":"40 岁一次性交 50 万，60 岁起每年领约 3 万，领到身故。","误区":"**没算过内部收益率（IRR）**。很多年金险的实际收益率**长期只有 2% 出头**，还不如国债。而且**前期退保亏本金**，一旦开始领钱就基本不能动了。","辨析":"（vs 增额终身寿）年金险**强制按年给你现金流**（防你一次性挥霍），增额终身寿**钱在账户里随时可取**（更灵活但考验自控力）。"},"vs":["增额终身寿"]},{"id":"分红险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1333.65,"y":89.88,"f":{"一句话":"有基础保障，还能分保险公司经营红利。**但分红是不保证的。**","例子":"合同写\"保底利率 2% + 分红\"，实际分红可能很高，**也可能是零**。","误区":"**把演示表上的分红当承诺**。销售给你看的计划书上有一列\"高档演示\"，那个数字**完全没有法律约束力**。**分红是不确定的，可以为零。**","辨析":"（vs 万能险）分红险的分红**不保证、不透明**（看公司经营）；万能险有**明确写进合同的保底利率**（虽然也低）。","提醒":"看分红险，**只看\"保证利益\"那一列**，其余都是画饼。"},"vs":["万能险"]},{"id":"万能险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":5,"root":false,"x":-1276.81,"y":-165.67,"f":{"一句话":"有保底利率、再加浮动结算利率的保险账户。","例子":"合同写\"保底 1.75%，当前结算 3.0%\"。**保底是承诺的，浮动部分随时会降。**","误区":"**盯着\"当前结算利率\"决定买不买**。结算利率是**每月公布、随时可调**的——今天 3.0%，明年可能就降到保底 1.75%。**真正有意义的是那个保底数字。**","辨析":"（vs 分红险）**万能险有写进合同的保底利率**（虽然低，但确定）；**分红险的分红不保证、可以为零**。反过来，**万能险前几年扣的初始费用很高**，前期退保亏得更多。**看万能险只盯保底利率，看分红险只盯\"保证利益\"那一列。**","提醒":"万能险**前几年扣的初始费用很高**（可能达保费的 50%），**前期退保照样亏**。"},"vs":["分红险"]},{"id":"投连险","kind":"term","fam":3,"cat":"H","catName":"保险","deg":3,"root":false,"x":-1143.92,"y":-3.98,"f":{"一句话":"保险费拿去买基金，**收益完全不保，可能亏本金**。风险最高的一类保险。","例子":"你选一个激进型投资账户，市场好时涨 30%，市场差时跌 40%——**保险公司不兜底**。","误区":"**以为\"保险\"两个字就意味着安全**。投连险**没有任何保底**，风险由投保人全部承担。2008 年金融危机时，投连险出现过**亏损过半**的案例，引发大量投诉。","辨析":"（vs 万能险）万能险**有保底**（虽然低），投连险**完全没有**。**风险等级：投连险 > 万能险 > 分红险。**","提醒":"**投连险现在已经很少见了**。如果销售推荐它，问清楚：**亏了本金谁承担？** 答案一定是你。"},"vs":["万能险"]},{"id":"保费","kind":"term","fam":3,"cat":"H","catName":"保险","deg":5,"root":false,"x":-734.58,"y":-202.82,"f":{"一句话":"你交给保险公司的钱。","例子":"重疾险年交 3000 元，交 20 年，总保费 6 万元。","误区":"**只看保费不看保额**。保费便宜可能是因为**保额也低**，或者**保障范围缩水**。**要算\"每 1 元保费买到多少保额\"**——这个比率才是保险的性价比。","辨析":"（vs 保额）保费是**你付出的**，保额是**你能拿到的**。**两者的比值就是杠杆**——重疾险的杠杆通常是几十倍，这才是保险的价值所在。"},"vs":["保额"]},{"id":"保额","kind":"term","fam":3,"cat":"H","catName":"保险","deg":5,"root":false,"x":-678.91,"y":1.25,"f":{"一句话":"出事时保险公司赔你的钱。","例子":"重疾险保额 50 万，确诊即赔 50 万。","误区":"**保额买太低**。很多人买重疾险只买 10 万——真生病了，10 万连一年的收入损失都补不上。**重疾险保额建议至少覆盖 3~5 年收入**。","辨析":"（vs 保费）在同款产品里，**保额越高保费越贵**。所以要在预算内**优先把保额买够**，宁可缩短保障期限。"},"vs":["保费"]},{"id":"免赔额","kind":"term","fam":3,"cat":"H","catName":"保险","deg":3,"root":false,"x":-672.22,"y":-469.27,"f":{"一句话":"出事了你自己先掏的那部分，超过的部分保险才管。","例子":"百万医疗险免赔额 1 万——住院花 8000 元一分不赔，花 3 万则赔 2 万。","误区":"**以为\"免赔额 1 万\"是\"能赔 1 万\"**。完全相反——**1 万以下它完全不管**。这就是百万医疗险能做到几百元保费的原因：它把高频的小额理赔全排除了。","辨析":"（vs 保额）**保额是上限（最多赔多少），免赔额是下限（少于此不赔）**。看一款医疗险，**这两个数都要看**。","提醒":"可以用**小额医疗险（免赔额低）**来补百万医疗险的 1 万缺口，但要注意**健康告知能否通过**。"},"vs":["保额"]},{"id":"等待期","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-447.14,"y":-524.01,"f":{"一句话":"买完保险后的一段时间内出险，**不赔**。防止带病投保。","例子":"重疾险等待期通常 90~180 天，医疗险 30~90 天。**等待期内查出癌症，一分不赔**（通常退还保费）。","误区":"**以为\"今天买今天就保\"**。等待期是保险公司的**反欺诈机制**，但也可能坑到真不知道自己有病的人——**建议在身体健康时就买，别拖到体检查出问题**。","辨析":"（vs 犹豫期）**等待期是\"买了之后多久才生效\"**（越长越不利），**犹豫期是\"买了之后多久能反悔\"**（越长越有利）。**这两个期一正一反，别搞混。**"},"vs":["犹豫期"]},{"id":"犹豫期","kind":"term","fam":3,"cat":"H","catName":"保险","deg":5,"root":false,"x":-503.75,"y":-289.43,"f":{"一句话":"买完保险后的一段冷静期，通常 **15 天**，期内退保全额退款。","例子":"买了年交 1 万的保险，第 10 天反悔——**全额退还**（可能扣几十元工本费）。","误区":"**以为过了犹豫期退保也能拿回本金**。**完全不能**——过了犹豫期退保只能拿\"**现金价值**\"，**前期通常只有已交保费的一小部分**，亏损可能超过 50%。","辨析":"（vs 等待期）这两个\"期\"**一正一反**：**等待期是\"买了之后多久才生效\"**（越长越不利，重疾险 90~180 天，期内出险不赔）；**犹豫期是\"买了之后多久能反悔\"**（越长越有利，通常 15 天，期内退保全额退款）。","提醒":"**犹豫期是唯一的无损失退出窗口。** 拿到合同**先在这 15 天里逐条读完**，不合适立刻退。"},"vs":["等待期"]},{"id":"现金价值","kind":"term","fam":3,"cat":"H","catName":"保险","deg":3,"root":false,"x":-775.32,"y":-669.45,"f":{"一句话":"退保时你能拿回多少钱。**它和\"已交保费\"完全是两个数。**","例子":"交了 3 年共 3 万元保费，现金价值可能只有 1.2 万——**退保直接亏 1.8 万**。","误区":"**以为\"退保=退还我交的钱\"**。这是保险投诉的最大来源。现金价值**前期极低、后期才慢慢追平并超过已交保费**。有的产品要交满 10 年以上现金价值才等于已交保费。","辨析":"（vs 保费）**保费是你交的（一直往外掏），现金价值是你退保能拿的（先少后多）**。看一份储蓄型保险划不划算，**要看现金价值表，不是看保费**。"},"vs":["保费"]},{"id":"健康告知","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1939.82,"y":-153.78,"f":{"一句话":"买保险前，保险公司问你健康状况的那张表。**必须如实回答。**","例子":"表上会问\"近 2 年内是否有住院记录\"\"是否患有高血压、糖尿病\"等。你得逐条核对。","误区":"**为了能买上而隐瞒**。这是最危险的操作——**理赔时保险公司会调取你的全部就医记录**，一旦发现隐瞒，**直接拒赔且只退还现金价值**（亏本金）。**你交的钱全白交了。**","辨析":"（vs 如实告知）健康告知是**保险公司的提问**，如实告知是**你的义务**。**问什么答什么，没问的不用主动说**——这是\"有限告知\"原则，国内适用。","提醒":"**医保卡外借给别人买药**（尤其降压药、降糖药）会在你的记录里留下病史，**可能导致拒赔**。这事很多人都干过。"},"vs":["如实告知"]},{"id":"如实告知","kind":"term","fam":3,"cat":"H","catName":"保险","deg":4,"root":false,"x":-1744.9,"y":-160.15,"f":{"一句话":"你的法定义务——保险公司问到的，你必须说真话。","例子":"问\"是否做过手术\"，你 3 年前做过阑尾炎手术，就得说。**代价很具体**：一旦被认定未如实告知，保险公司可以拒赔、只退还现金价值——**你交的 10 万保费，可能只拿回 3 万**。","误区":"**以为\"小毛病不用说\"**。判断标准不是\"严不严重\"，而是**保险公司有没有明确问到**。问到了就必须说，**哪怕你觉得无关**。","辨析":"（vs 健康告知）**国内采用\"有限告知\"**——保险公司问什么你答什么，**没问的不用主动交代**。这跟某些地区的\"无限告知\"不同，别自己吓自己，也别心存侥幸。","提醒":"**两年不可抗辩条款**——合同成立满 2 年后，保险公司不能因未如实告知而解除合同（**但如果是恶意欺诈，仍可能拒赔**）。**别拿这条赌。**"},"vs":["健康告知"]},{"id":"社保","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":6,"root":true,"x":-1712.87,"y":-826.1,"f":{"一句话":"国家强制的基本保障——养老、医疗、失业、工伤、生育五险。**它是底线，不是全部。**","例子":"月薪 1 万，个人交约 10.5%（养老 8% + 医疗 2% + 失业 0.5%），单位再交约 25%~30%。","误区":"**以为有社保就够了**。社保**只能保证基本生活**——退休金替代率（退休金÷退休前工资）通常只有 40% 左右，**收入越高替代率越低**。想过得体面，必须自己额外准备。","辨析":"（vs 保险）社保是**国家强制的、广覆盖保基本的**；商业保险是**自愿的、按需定制的**。**社保打底，商保补缺口。**"},"vs":["保险"]},{"id":"养老保险","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":8,"root":false,"x":-2173.4,"y":-920.75,"f":{"一句话":"社保里管退休金的那一项。**退休后按月领，活多久领多久。**","例子":"累计交满 15 年，达到法定退休年龄就能按月领取。交得越久、交得越多，领得越多。","误区":"**以为\"交满 15 年就够了\"**。15 年只是**最低门槛**——只交 15 年，退休金会非常少。**能交多久交多久**，每多交一年，退休金都增加。","辨析":"（vs 个人养老金）**养老保险是强制的、国家统筹的**（活多久领多久）；**个人养老金是自愿的、钱在你自己账户里**（**领完就没了**）。前者是底线，后者是补充，**两者可以同时有**。","提醒":"**养老金 = 基础养老金 + 个人账户养老金**。个人账户的钱**可以继承**，基础养老金部分不能。**断缴会影响缴费年限**，换工作时要注意衔接。"},"vs":["个人养老金"]},{"id":"企业年金","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":5,"root":false,"x":-2609.31,"y":-734.11,"f":{"一句话":"公司给员工额外加的养老金，**公司也帮你交一部分**。相当于第二份养老金。","例子":"你交工资的 4%，公司配 8%，一起进入你的年金账户投资增值，退休时领取。","误区":"**以为跟社保一样是强制的**。**不是**——企业年金是**自愿建立**的，只有部分企业（多是国企、大厂）有。而且**跳槽时未归属的部分可能拿不走**（归属规则看公司规定）。","辨析":"（vs 职业年金）企业年金是**企业**给员工建的（自愿），职业年金是**机关事业单位**的（强制）。**性质一样，覆盖人群不同。**"},"vs":["职业年金"]},{"id":"职业年金","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":4,"root":false,"x":-2502.08,"y":-948.62,"f":{"一句话":"机关事业单位版的\"企业年金\"。**强制建立。**","例子":"公务员、事业单位员工，单位交 8%、个人交 4%，退休后按月领取。","误区":"**以为和企业年金可以同时拥有**。一般不会——你在企业工作就有企业年金，在机关事业单位就有职业年金，**取决于你的雇主类型**。","辨析":"（vs 企业年金）**职业年金是机关事业单位的（强制建立）**；**企业年金是企业自愿建立的（多数人没有）**。**两者同属第二支柱**，性质一样、覆盖人群不同，取决于你的雇主类型。","提醒":"**职业年金是\"第二支柱\"的一部分**。它和你自己的个人养老金（第三支柱）**不冲突，可以叠加**。"},"vs":["企业年金"]},{"id":"个人养老金","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":5,"root":false,"x":-2147.71,"y":-638.39,"f":{"一句话":"国家给税收优惠、你自己开的养老账户。**每年最多存 1.2 万，可以抵个税。**","例子":"你年收入适用 20% 税率，每年存满 1.2 万，**当年少交个税 2400 元**。钱在账户里投资，退休时才能取。","误区":"**以为\"存进去就免税\"**。准确说是**递延纳税**——存的时候不交税，**领取时要按 3% 单独计税**。所以**只有你的税率高于 3% 才划算**。收入低的人（税率 3%）**几乎没好处**。","辨析":"（vs 养老保险）养老保险是**强制、统筹、活多久领多久**；个人养老金是**自愿、个人账户、领完就没了**。前者是底线，后者是补充。","提醒":"**钱存进去要等到退休才能取**（除非重病、出国等特殊情况）。**流动性极差，只适合确定长期不用的钱。**"},"vs":["养老保险"]},{"id":"第三支柱","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":4,"root":false,"x":-2295.73,"y":-464.52,"f":{"一句话":"养老保障体系的第三根柱子——**个人自己攒的养老金**。","例子":"第一支柱是社保（国家），第二支柱是企业/职业年金（单位），第三支柱是个人养老金（自己，**每年额度 1.2 万元、可抵个税**）。","误区":"**以为\"有国家兜底就行\"**。人口老龄化下，**第一支柱的压力越来越大**，替代率持续下降。**越早自己准备，越轻松。**","辨析":"（vs 养老保险、企业年金）三根柱子的**责任主体不同**——国家、单位、个人。**前两根你控制不了（取决于政策和雇主），只有第三根完全由你决定。**"},"vs":["养老保险","企业年金"]},{"id":"养老目标基金","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":3,"root":false,"x":-506.71,"y":1461.66,"f":{"一句话":"按你的退休年份自动调整风险的基金。**年轻时多买股票，临近退休自动转债券。**","例子":"\"目标日期 2050 基金\"——现在股票仓位高（约 70%），随着 2050 年临近逐步降到 20%。","误区":"**以为它能保证养老**。它只是一只**会自动降风险的基金**，**照样会亏**——2008 年美国的同类基金跌了 30% 以上。","辨析":"（vs 基金）养老目标基金是一种特殊的 FOF（**投资其他基金**），所以**费用是多层的**。买之前看清总费率。","提醒":"它有 **3 年或 5 年持有期**，中途不能赎回。**封闭期内想用钱也取不出来。**"},"vs":["基金"]},{"id":"退休金替代率","kind":"term","fam":3,"cat":"I","catName":"养老与长期","deg":2,"root":false,"x":-2250.61,"y":-1351.62,"f":{"一句话":"退休后拿的钱，能顶退休前工资的几成。","例子":"退休前月入 1 万，退休金 4000 元，替代率 = 40%。**国际警戒线通常认为低于 55% 生活水平会明显下降。**","误区":"**以为替代率对所有人都一样**。**收入越高，替代率越低**——因为社保有缴费上限，超过部分不纳入计算。**月入 3 万的人，替代率可能只有 20%。**","提醒":"这个数决定了**你需要自己补多少**。想维持退休前的生活水平，**缺口部分就得靠第二、三支柱填。**"},"vs":[]},{"id":"贷款","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":14,"root":true,"x":-231.02,"y":-1417.34,"f":{"一句话":"借来的钱，要还本还要付息。**它让今天能花明天的钱，代价是明天的钱变少。**","例子":"借 100 万、30 年、年利率 3.5%，总利息约 61.6 万——**你最终还了 161.6 万**。","误区":"**只看月供不看总利息**。\"每月才还 4500\"听着轻松，30 年下来利息能再买半套房。**期限越长月供越低，但总利息越高**——这是贷款最容易被忽略的代价。","辨析":"（vs 存款）**同一件事的两个方向**——你存钱，银行付你利息；你贷款，你付银行利息。**而这两个利率从来不一样**：贷款利率永远高于存款利率，**这个差价就是银行的利润**。","提醒":"**房贷是普通人一辈子能借到的最便宜的钱**（利率最低、期限最长）。**别拿房贷去还消费贷**，那是把便宜的债换成贵的债。"},"vs":["存款"]},{"id":"房贷","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-301.44,"y":-1832.87,"f":{"一句话":"买房时向银行借的钱，**以房子作抵押**。是所有贷款里利率最低的。","例子":"300 万的房子，首付 30%（90 万），贷款 210 万，30 年。","误区":"**以为\"还不上就把房子给银行就完事了\"**。**不是**——如果房子拍卖价不够还贷，**差额你照样得还**。而且法拍房通常打七折，**房价跌的时候这个缺口很大**。","辨析":"（vs 消费贷）房贷**有抵押、期限长（可达 30 年）、利率低**；消费贷**无抵押、期限短（1~3 年）、利率高得多**。**拿消费贷凑首付是违规的**，银行查到会抽贷。","提醒":"**房贷利率 = LPR + 加点**。加点签了通常**固定不变**，LPR 部分随市场浮动。"},"vs":["消费贷"]},{"id":"LPR","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":5,"root":false,"x":1058.65,"y":-609.52,"f":{"一句话":"贷款市场报价利率，**每月 20 号公布**。现在几乎所有贷款的定价基准。","例子":"5 年期以上 LPR 从 4.2% 降到 3.5%，你的房贷利率跟着降——**LPR 每降 0.1%，100 万 30 年房贷月供约少 60 元**。","误区":"**以为 LPR 一降，下个月房贷就少了**。**不是**——房贷通常**每年只重定价一次**（多数是 1 月 1 日或放款对应日），要等到那天才按最新 LPR 调整。","辨析":"（vs 基准利率）**LPR 是市场报价（由 18 家银行每月报出），基准利率是央行直接定的**。2019 年改革后，**新发放贷款全部锚定 LPR**，基准利率基本退出历史舞台。","提醒":"LPR 分 **1 年期**和 **5 年期以上**两个品种。**房贷看 5 年期以上那个**，别拿 1 年期来算。"},"vs":["基准利率"]},{"id":"基准利率","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":1409.5,"y":-413.89,"f":{"一句话":"央行过去直接规定的贷款利率，**现在基本被 LPR 取代了**。","例子":"2015 年后 5 年以上贷款基准利率一直是 4.9%，多年没动——**这也是它被淘汰的原因：不反映市场**。","误区":"**以为老的房贷还按基准利率算**。2019 年改革后，**存量房贷也统一转成了 LPR 定价**（或转成固定利率，二选一）。现在说\"基准利率\"多半是**销售在用过时的说法**。","辨析":"（vs LPR）**基准利率是\"央行定\"，LPR 是\"市场报\"**。前者行政色彩重、反应慢，后者每月更新、更贴近市场。"},"vs":["LPR"]},{"id":"固定利率","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-83.14,"y":-1207.63,"f":{"一句话":"签合同时就锁死，**以后市场怎么变都跟你无关**。","例子":"签 4.5% 固定利率，以后 LPR 涨到 6% 你还是还 4.5%；**但 LPR 降到 3%，你也享受不到**。","误区":"**以为固定利率一定划算**。**它是一场赌注**——赌未来利率会涨。**在利率下行周期里，固定利率是吃亏的**（这几年就是）。","辨析":"（vs 浮动利率）固定利率**确定性高、但放弃了利率下行的红利**；浮动利率**跟着市场走、但有上行风险**。**房贷期限长达 30 年，没人能预测这么久的利率**——这也是多数人选浮动的原因。"},"vs":["浮动利率"]},{"id":"浮动利率","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":5,"root":false,"x":151.53,"y":-916.51,"f":{"一句话":"利率跟着 LPR 走，**市场降你就降，市场涨你就涨**。","例子":"房贷 = 5 年期 LPR + 50 个基点。LPR 从 3.7% 降到 3.5%，你的利率从 4.2% 降到 4.0%。","误区":"**以为\"浮动\"是随时在动**。它**一年才调一次**（重定价日），中间 LPR 怎么变都不影响你的月供。**很多人以为降息当月就能省钱，结果等了大半年。**","辨析":"（vs 固定利率）浮动利率**承担了利率上行的风险，换来了下行的收益**。**加点部分是固定的，只有 LPR 部分浮动**——这点很多人搞不清。"},"vs":["固定利率"]},{"id":"等额本息","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":5,"root":false,"x":-661.57,"y":-1240.31,"f":{"一句话":"**每月还款金额一模一样**。前期还的利息多、本金少。","例子":"100 万 30 年 4%，月供 4774 元，**30 年总利息约 71.9 万**。第一个月里，利息占 3333 元，本金只占 1441 元。","误区":"**以为\"每月还一样多\"就等于\"利息少\"**。**恰恰相反，它比等额本金多还利息**（上例多约 10 万）。但前期压力小，**适合收入还在增长、手头紧的年轻人**。","辨析":"（vs 等额本金）**等额本息是\"每月一样多、总利息多\"；等额本金是\"前期还得多、总利息少\"**。**银行默认给你等额本息**——因为利息收得多，而且你更容易批下来。"},"vs":["等额本金"]},{"id":"等额本金","kind":"term","fam":4,"cat":"J","catName":"贷款与负债",
