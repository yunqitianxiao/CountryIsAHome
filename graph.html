"deg":4,"root":false,"x":-534.53,"y":-1449.88,"f":{"一句话":"**每月还的本金一样多**，加上剩余本金产生的利息。所以**月供一开始高、然后逐月减少**。","例子":"100 万 30 年 4%，首月还 6111 元，之后每月递减约 9 元，**总利息约 60.2 万**（比等额本息少约 11.7 万）。","误区":"**以为\"总利息少就一定选它\"**。**首月多掏 1300 多元**，如果你现在现金流紧，硬选它可能连月供都撑不住。**省利息的前提是你现在有这个钱。**","辨析":"（vs 等额本息）**如果你打算 5 年内提前还款，两者差别其实不大**——因为利息差主要在后期才拉开。**别为了省利息把自己逼到现金流断裂。**"},"vs":["等额本息"]},{"id":"首付比例","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":2,"root":false,"x":-155.7,"y":-2281.94,"f":{"一句话":"买房时自己先掏的那部分，**剩下的才能贷款**。","例子":"300 万的房子，首付 30% = 90 万，可贷 210 万。首套房和二套房的首付比例不同，各城市政策也有差异。","误区":"**以为首付越低越好**。首付低意味着**贷款更多、利息更多**。而且**首付比例是政策工具，会随楼市调控变化**——今天算好的钱，明天可能就不够了。","提醒":"**首付的钱必须是自有资金**。用消费贷、经营贷凑首付是**明令禁止**的，银行发现会要求提前还款。**也别把所有积蓄都砸进首付**，要留出应急资金。"},"vs":[]},{"id":"提前还款","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":2,"root":false,"x":-429.19,"y":-992.33,"f":{"一句话":"手上有闲钱了，提前把贷款还掉一部分，**省下后面的利息**。","例子":"100 万 30 年 4%，还了 5 年后提前还 20 万（选\"缩短期限\"），可省利息约 15 万。","误区":"**以为提前还款一定划算**。要算三笔账：① **有没有违约金**（多数银行要求还款满 1 年才免罚息）；② **你的贷款利率 vs 你能拿到的理财收益**——如果房贷利率 3.5%、你买国债能拿 2.5%，那还是提前还划算；③ **等额本息还到后期时，利息已经还得差不多了**，这时提前还省的很少。","提醒":"提前还款有两个选项——**\"缩短期限\"省的利息多，\"减少月供\"减压但省的少**。银行可能默认后者，**你得主动选**。"},"vs":[]},{"id":"征信","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-375.34,"y":-2073.56,"f":{"一句话":"你的借钱履历。**银行靠它判断你值不值得借**。","例子":"央行征信报告记录你的贷款、信用卡、还款记录。**逾期记录从还清之日起保留 5 年。**","误区":"**以为\"不借钱征信就干净\"**。**空白征信反而不利于贷款**——银行看不到你的还款能力证明。**适度使用信用卡并按时还款，是养征信的方式。** 另外，**频繁查征信也有影响**（硬查询次数多会被认为急需用钱）。","辨析":"（vs 信用体系）征信是**记录**，信用体系是**一整套机制**（包括评分、惩戒、修复）。**征信报告是你的，但你不能改它**——只能等时间冲淡。","提醒":"**\"征信洗白\"\"删除逾期记录\"全是骗局。** 逾期的唯一处理方式是**还清 + 等 5 年**。"},"vs":["信用体系"]},{"id":"信用卡分期","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-590.34,"y":-1708.7,"f":{"一句话":"把一笔消费拆成几个月还，**每期收手续费**。听着便宜，实际很贵。","例子":"12000 元分 12 期，月费率 0.6%——**名义年化 7.2%**，但因为你每月都在还本金、**占用资金逐月减少**，**实际年化约 13%**。","误区":"**把\"月费率 × 12\"当年化利率**。**这是银行最希望你犯的错。** 因为本金是逐月减少的，真实的资金占用只有一半左右，**实际利率接近名义的两倍**。","辨析":"（vs 最低还款）**分期是\"约定的高息\"，最低还款是\"滚动的超高息\"**。**最低还款更贵**——日息万分之五，年化 18.25%，且按月计复利。","提醒":"**信用卡分期常被电话推销**，话术是\"费率很低\"。**问它一句：折算成年化是多少？** 多数销售答不上来。"},"vs":["最低还款"]},{"id":"最低还款","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-767.82,"y":-1804.71,"f":{"一句话":"只还账单的 10%，**剩下的按日息万分之五滚**。**最贵的借钱方式之一。**","例子":"欠 1 万只还 1000 元，剩下 9000 元每天利息 4.5 元，**年化 18.25%，且按月计复利**。","误区":"**以为\"还了最低还款就不算逾期\"**。这点没错（不影响征信），**但利息照收，而且是从消费入账那天开始算**——**免息期直接作废**。很多人以为只从还款日之后算利息，**实际是从你刷卡那天算起**。","辨析":"（vs 信用卡分期）**最低还款是\"没还完的部分滚利息\"**（越滚越多，无上限）；**分期是\"全部转成固定期数\"**（成本确定）。**两者都比正常全额还款贵得多。**","提醒":"**长期只还最低还款，会被银行标记为高风险客户**，影响后续提额和贷款。"},"vs":["信用卡分期"]},{"id":"年化费率","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":5,"root":false,"x":-987.89,"y":-1583.74,"f":{"一句话":"银行最爱用的利率口径——**用\"总手续费 ÷ 本金\"再摊到每年**。**它系统性低估真实成本。**","例子":"12000 元分 12 期、总手续费 864 元——**年化费率 = 864 ÷ 12000 = 7.2%**。听着不高。","误区":"**拿年化费率和存款利率直接比**。**这是两个口径**：存款是\"钱一直在你手上\"，分期是\"钱逐月还给银行\"。**同样 7.2%，分期的真实成本接近 13%。**","辨析":"（vs 实际年化）**年化费率的分母是\"最初借的钱\"，实际年化的分母是\"你实际占用的钱\"**。因为本金逐月减少，后者的分母只有前者的一半左右，**所以实际年化往往是年化费率的 1.8~2 倍**。"},"vs":["实际年化"]},{"id":"实际年化","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":4,"root":false,"x":-1220.39,"y":-1691.24,"f":{"一句话":"把分期手续费还原成真实利率（IRR 口径）。**这才是你能拿去跟其他产品比的数。**","例子":"月费率 0.6% 的 12 期分期，**实际年化约 13%**；同样的 0.6% 用在 24 期上，实际年化约 13.5%。","误区":"**以为\"银行没写就是不重要\"**。**监管要求银行必须明示年化利率**——你在合同或 APP 里能找到那个\"折算年化利率\"。**找不到就直接问，问不到就别办。**","辨析":"（vs 年化费率）**同一笔分期，年化费率 7.2%、实际年化 13%**——**两个数都是\"真\"的，口径不同。** 比价时**只用实际年化**，因为只有它和存款利率、理财收益率是同一把尺子。"},"vs":["年化费率"]},{"id":"负债率","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":2,"root":false,"x":-432.83,"y":-1263.57,"f":{"一句话":"每月还款占收入的比例。**它是银行批贷的红线，也是你该自己盯的数。**","例子":"月入 1.5 万，房贷 + 车贷月供共 7500 元，**负债率 50%**。","误区":"**以为\"能批下来就说明还得起\"**。银行的红线通常是**月供不超过月收入 50%**，但**这只是\"不违约\"的底线，不是\"活得舒服\"的线**。真到 50%，一场病、一次失业就能压垮。**自己控制在 30% 以内更安全。**","提醒":"**负债率要把所有债务算进去**——房贷、车贷、信用卡分期、网贷，**银行查征信时全都看得见**。**隐瞒没用。**"},"vs":[]},{"id":"以贷养贷","kind":"term","fam":4,"cat":"J","catName":"贷款与负债","deg":3,"root":false,"x":-125.43,"y":-1677.38,"f":{"一句话":"借新的钱去还旧的债。**这是债务雪崩的起点。**","例子":"信用卡还不上 → 借网贷还卡 → 网贷到期 → 再借另一家 → **债务在半年内从 3 万滚到 15 万**。","误区":"**以为\"只是周转一下，下个月就还上\"**。**以贷养贷的数学必然导致崩盘**——新债的利率**永远高于**旧债（否则没有机构会借给你），**每转一次手，债务就上一个大台阶**。而且征信上的\"多头借贷\"记录会让**所有正规机构同时关门**。","提醒":"**这是最需要警惕的信号**。走到这一步，正确的做法是**立刻停止借新债**，主动跟银行协商个性化分期（停息挂账）。**自己扛只会越陷越深。**"},"vs":[]},{"id":"个人所得税","kind":"term","fam":4,"cat":"K","catName":"税","deg":4,"root":true,"x":-1405.56,"y":-1012.62,"f":{"一句话":"你赚的钱，国家抽走一部分。**工资、劳务、稿费、特许权使用费，全都算。**","例子":"月薪 1.5 万，扣掉五险一金和起征点 5000 元后，**适用 10% 税率**。年收入越高税率越高，**最高 45%**。","误区":"**以为\"月薪没到 5000 才不用交\"**。起征点是 5000 元/月，但**扣的是\"收入 − 五险一金 − 专项附加扣除\"之后的余额**，不是直接拿工资比 5000。**很多人本来能退税，却不知道自己该填扣除项。**","辨析":"（vs 印花税）个税是**对你赚的钱征税**（所得税），印花税是**对交易行为征税**（行为税）。**两者性质完全不同，计算方式也不一样。**","提醒":"**每年 3~6 月要做个税汇算清缴**（多退少补）。**很多人能退税却没去申报，白白错过。**"},"vs":["印花税"]},{"id":"专项附加扣除","kind":"term","fam":4,"cat":"K","catName":"税","deg":2,"root":false,"x":-1542.53,"y":-1690.8,"f":{"一句话":"国家允许你在交个税前先扣掉的那几项生活开支。**填了就能少交税。**","例子":"独生子女赡养老人（3000 元/月）+ 一个孩子教育（2000 元/月）= **每月可扣 5000 元**。若适用 20% 税率，**一年少交 1.2 万元个税**。","误区":"**以为\"会自动带进去\"**。**不会**——**必须自己在个税 APP 里申报**，单位不会替你填。**这是最容易被白白漏掉的钱。**","提醒":"目前共 **7 项**：子女教育、婴幼儿照护、继续教育、大病医疗、住房贷款利息、住房租金、赡养老人。**住房贷款利息和住房租金只能二选一**（不能同时扣）。**每年 12 月要确认下一年度的扣除信息**，换工作、孩子满 3 岁、老人去世都要及时改。"},"vs":[]},{"id":"股息红利税","kind":"term","fam":4,"cat":"K","catName":"税","deg":5,"root":false,"x":-1506.72,"y":244.0,"f":{"一句话":"上市公司分红给你的钱要交税。**持股时间越长，税率越低，超过 1 年免税。**","例子":"持股 1 个月以内卖出，税率 **20%**；1 个月到 1 年，**10%**；**超过 1 年，0%**。","误区":"**以为\"分红是白拿的钱\"**。**分红当天股价会除权除息**——10 元的股票分 0.5 元，除息后开盘参考价变成 9.5 元。**你账面上的总资产没变，但如果马上卖，还要交税，反而亏。**","辨析":"（vs 资本利得税）**股息红利税是对\"分红\"征税**（持有期间拿到的钱），**资本利得税是对\"买卖差价\"征税**。**中国个人炒股赚的差价目前免征**，所以 A 股股民的税负主要落在分红这一头。","提醒":"**持股期限是从买入到卖出算的**，不是从分红那天算。**想免税，就得拿满 1 年。**"},"vs":["资本利得税"]},{"id":"资本利得税","kind":"term","fam":4,"cat":"K","catName":"税","deg":4,"root":false,"x":-1473.32,"y":-94.93,"f":{"一句话":"买卖资产的差价要交的税。**但在中国，个人炒 A 股的差价暂免征收。**","例子":"10 元买、15 元卖，赚 5 元——**A 股个人投资者这 5 元暂不交税**。但**买卖房产、股权转让的差价要交**。","误区":"**以为\"炒股赚钱不交税\"就等于\"完全免税\"**。**分红要交（股息红利税）、卖出要交印花税**——**只是差价那一块免了。** 另外，**境外市场（如港股、美股）的资本利得通常要交税**，规则完全不同。","辨析":"（vs 股息红利税）**一个对\"卖出价差\"征，一个对\"持有分红\"征**。A 股的特殊之处就在于**免了前者、留了后者**，所以**长期持有吃分红的人税负反而更重**（除非拿满 1 年）。"},"vs":["股息红利税"]},{"id":"印花税","kind":"term","fam":4,"cat":"K","catName":"税","deg":4,"root":false,"x":-1428.74,"y":-381.36,"f":{"一句话":"股票卖出时按成交金额收的税，**单边 0.05%**（2023 年 8 月起由 0.1% 减半）。**买入不收。**","例子":"卖出 10 万元股票，印花税 = 10万 × 0.05% = **50 元**。","误区":"**以为\"印花税很少，可以忽略\"**。**单笔确实少，但它是按次收的**——**短线交易者一年交易 100 次，光印花税就吃掉本金的 5%**（还没算佣金）。**这是短线交易最大的隐性成本之一。**","辨析":"（vs 个人所得税）**印花税不看你是赚是亏，只要卖出就收**；个税（股息红利）**只在有分红时收**。**亏钱卖出照样交印花税**——这点很多人不知道。"},"vs":["个人所得税"]},{"id":"资产配置","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":9,"root":false,"x":1253.61,"y":-1124.75,"f":{"一句话":"把钱分到几类**涨跌不同步**的资产里。**它决定了你长期收益的绝大部分。**","例子":"60% 股票基金 + 40% 债券基金。股票那年跌 20%、债券涨 3%，组合只跌约 10.8%——**这就是配置的作用**。","误区":"**以为\"选对产品\"才是关键**。研究发现**长期收益的九成以上来自\"怎么分\"，而不是\"买了哪只\"**。小白把全部精力花在挑基金上，**却在\"股债比例\"这个真正重要的问题上随手一拍**。","辨析":"（vs 择时）**配置是\"我该拿多少比例的股票\"，择时是\"我该什么时候买\"**。前者**你能控制**，后者**你控制不了**。**把精力放在能控制的那件事上。**","提醒":"**\"100 减年龄\"是个粗糙但好用的起点**——30 岁可以 70% 股票，60 岁降到 40%。**关键是这个比例要让你晚上睡得着。**"},"vs":["择时"]},{"id":"择时","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":1516.85,"y":-1092.72,"f":{"一句话":"猜什么时候进场、什么时候出场。**长期看，几乎没人猜得中。**","例子":"沪深 300 从 2005 到 2023 年，**如果错过涨幅最大的 10 天，总收益会腰斩**——而这 10 天分布在哪，事前没人知道。","误区":"**以为\"跌了再买、涨了再卖\"很简单**。**难在你不知道现在是\"跌\"还是\"开始跌\"。** 更现实的问题是：**空仓等回调的人，往往在涨回来之后才敢进场**——高买低卖，两头挨打。","辨析":"（vs 资产配置）**择时是\"预测市场\"，配置是\"不预测市场\"**。前者需要你比市场更聪明，后者只需要你知道自己能承受多少波动。**后者是普通人做得到的。**"},"vs":["资产配置"]},{"id":"分散投资","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":2,"root":false,"x":1418.7,"y":-1338.17,"f":{"一句话":"别把鸡蛋放一个篮子里。**用相关性低的资产，把波动降下来。**","例子":"只买一只股票，可能一年 −40%；买 20 只不同行业的股票，单只暴雷的影响降到 5%。**但如果你买的 20 只全是银行股，那等于没分散。**","误区":"**以为\"买得多就是分散\"**。**买了 10 只都是新能源基金，那不叫分散，叫加杠杆。** 真正的分散要求资产之间**涨跌不同步**——A 股和美股、股票和债券、股票和黄金。","提醒":"分散**能降低波动，但不能消除系统性风险**——2008 年、2020 年 3 月，**所有资产一起跌**。**分散是减少受伤，不是免伤。**"},"vs":[]},{"id":"再平衡","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":3,"root":false,"x":1130.9,"y":-454.99,"f":{"一句话":"涨多了卖一点、跌多了买一点，**把比例拉回原样**。**这是一条反人性的纪律。**","例子":"目标股债 60/40。一年后股票大涨，变成 70/30——**卖出 10% 的股票买入债券**，恢复 60/40。","误区":"**以为再平衡会\"降低收益\"**。它会让你**少赚一点牛市的钱**，但也让你**在暴跌时少亏很多**。长期看，**它用一点点收益换来了明显的风险下降**——而且它**强迫你在高点多卖、在低点多买**，正好和追涨杀跌相反。","辨析":"（vs 定投）**定投是\"按时间买\"，再平衡是\"按比例调\"**。定投解决\"什么时候买\"，再平衡解决\"买多了怎么办\"。**两者可以一起用。**","提醒":"**别调得太勤**——每季度或每半年看一眼就够。**频繁再平衡的手续费和税会把好处吃掉。**"},"vs":["定投"]},{"id":"一次性买入","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":-109.76,"y":1004.24,"f":{"一句话":"把一笔钱一次性全投进去。**赌的是\"现在是个好时点\"。**","例子":"拿到 20 万年终奖，当天全部买入。**如果买在高点，可能要等好几年才回本。**","误区":"**以为\"一次性买入长期收益更高\"**。统计上确实如此（因为市场长期向上，**钱在市场里的时间更长**），**但这是\"平均而言\"**——落到你一个人身上，**可能就是那个买在 2007 年 6000 点的人**。**统计优势不等于你不会成为例外。**","辨析":"（vs 定投）**一次性买入的期望收益更高、波动也更大**；定投**收益略低、但过程好受得多**。**关键看你更怕\"少赚\"还是更怕\"买在高点\"。** 如果这笔钱让你睡不着，**分批进场没什么丢人的。**"},"vs":["定投"]},{"id":"止损","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":826.72,"y":-1450.4,"f":{"一句话":"亏到预设的线就卖掉，**不让小亏变成大亏**。","例子":"买入价 10 元，设 8 元止损——**最多亏 20%，不会亏到 5 元**。","误区":"**以为\"不卖就不算亏\"**。**这是最贵的心理安慰。** 账面亏损和已实现亏损**在钱上完全一样**——**区别只在于你还有没有机会翻身**。死扛的人，往往扛到最后割在最低点。","辨析":"（vs 止盈）**止损管的是\"别亏太多\"，止盈管的是\"别贪太多\"**。**两者都是把\"决策\"提前到情绪还没上来的时候**——这才是纪律的意义。","提醒":"**止损线要在买入前就定好**。买入之后再定，**你会不自觉地把它设在\"刚好不用卖\"的位置**。"},"vs":["止盈"]},{"id":"止盈","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":1101.31,"y":-1457.28,"f":{"一句话":"赚到预设的线就卖掉一部分，**把浮盈变成真钱**。","例子":"10 元买入，涨到 15 元（+50%）卖掉一半，**落袋 25%**，剩下的继续拿着。","误区":"**以为\"会涨的就不该卖\"**。**没人知道顶在哪。** 更常见的情况是：**赚 50% 没卖，跌回去变成亏 10%**——**浮盈不是你的钱，卖出才是。**","辨析":"（vs 止损）**止损对抗的是\"不肯认错\"，止盈对抗的是\"不肯收手\"**。两者都在对抗同一个东西：**贪婪与恐惧在事后替你做决定。**"},"vs":["止损"]},{"id":"仓位","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":7,"root":false,"x":1181.59,"y":-1748.82,"f":{"一句话":"你有多少钱在市场里。**它是你唯一能 100% 控制的风险开关。**","例子":"10 万本金，买了 6 万——**仓位 60%**。市场跌 20%，你亏 1.2 万（总本金的 12%），而不是 2 万。","误区":"**以为\"选对股票比控制仓位重要\"**。**恰恰相反**——你控制不了股票涨跌，**但你能控制自己放多少钱进去**。**仓位是你和风险之间唯一的谈判筹码。**","辨析":"（vs 满仓）**仓位是个连续的量**（10%、50%、80%），**满仓是它的最大值**。真正该问的问题不是\"满不满仓\"，而是**\"这个仓位让我睡得着吗\"**。"},"vs":["满仓"]},{"id":"满仓","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":5,"root":false,"x":1416.56,"y":-1813.57,"f":{"一句话":"钱全投进去了，**一分现金不留**。","例子":"10 万全买了基金，账户余额 0。","误区":"**以为\"空仓就是浪费机会\"**。满仓的真正问题不是收益，**而是你失去了\"行动能力\"**——**暴跌时你没法加仓（没钱），急用钱时你必须割肉（在最低点）**。**满仓的人没有选择权。**","辨析":"（vs 空仓）**满仓怕跌，空仓怕涨**。但两者真正的差别在于：**满仓的人是被迫的（跌了也只能拿住），空仓的人是主动的（随时能进）**。**留一点现金，就是留一点主动权。**"},"vs":["空仓"]},{"id":"空仓","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":1372.21,"y":-2112.48,"f":{"一句话":"一分钱没投，**全拿现金**。","例子":"2015 年 6 月上证 5000 点时空仓，能躲过之后近 50% 的跌幅；**但 2020 年 3 月恐慌时空仓的人，错过了之后一年多 40% 的反弹**——空仓的难点从来不是\"该不该躲\"，是\"什么时候回来\"。","误区":"**把空仓当\"聪明\"**。**空仓的代价是确定的——通胀每天都在吃你的购买力。** 而且**空仓的人往往在涨了 30% 之后才敢进来**，正好接盘。**长期空仓，本质是放弃复利。**","辨析":"（vs 满仓）**满仓的风险是\"跌\"，空仓的风险是\"错过\"**。**这两种风险都真实存在**——很多人只看得见前者。**仓位管理不是二选一，是找那个中间点。**"},"vs":["满仓"]},{"id":"杠杆","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":true,"x":496.09,"y":-1790.89,"f":{"一句话":"借钱放大你的盈亏。**涨的时候爽，跌的时候要命——而且是同一个倍数。**","例子":"10 万本金借 10 万，总仓位 20 万。标的涨 10% → 你赚 2 万（**对本金 +20%**）；**跌 10% → 你亏 2 万（对本金 −20%）**；**跌 50% → 本金归零，你被强制平仓**。","误区":"**以为\"我判断对了就能放大收益\"**。**杠杆真正杀死人的不是判断错，是\"过程中的波动\"**——即使最后涨回来，**中间的下跌可能已经把你强平出局了**，后面的反弹跟你没关系。**你输的不是判断，是时间。**","辨析":"（vs 融资融券）**杠杆是原理（借钱放大），融资融券是一种具体工具**（向券商借钱或借股票）。**还有场外配资、期货保证金等其它形式**——**杠杆倍数越高，爆仓越快。**","提醒":"**普通人最好不要碰杠杆。** 巴菲特的收益率里，**很大一部分来自\"从不爆仓\"**——**活得久比赚得快重要。**"},"vs":["融资融券"]},{"id":"融资融券","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":4,"root":false,"x":721.15,"y":-2072.34,"f":{"一句话":"券商借钱给你买股票（融资），或借股票给你卖（融券）。**都要付利息，都要抵押。**","例子":"你有 100 万，融资买入 125 万股票。**维持担保比例跌到 130% 时会被强制平仓**——股价跌约 20% 就触发了。","误区":"**以为\"跌了不卖就行\"**。**融资盘不行**——**跌破平仓线，券商会强行卖掉你的股票，你没得选**。而且**融券做空的亏损理论上是无限的**（股价能涨到多高没有上限）。","辨析":"（vs 杠杆）**融资融券的杠杆通常只有 1 倍左右**（保证金比例有下限），**而场外配资能到 5~10 倍**。**但正规的融资融券受监管、有平仓线保护；场外配资是违法的，出事没人管你。**","提醒":"**融资利率通常在 5%~8%**，**你的收益率必须先跑赢这个数才谈得上赚钱**。而且**标的股票有范围限制**（不是所有股票都能融资买）。"},"vs":["杠杆"]},{"id":"应急备用金","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":2,"root":false,"x":882.14,"y":-841.12,"f":{"一句话":"手边随时能拿出来的现金，**覆盖 3~6 个月的开销**。**它是所有投资的前提。**","例子":"月支出 8000 元 → 备 2.4 万~4.8 万。放在**货币基金或活期**，**随时能取**。","误区":"**以为\"钱放着不生息很浪费\"**。**这笔钱的作用不是生息，是让你不必在暴跌时割肉。** 没有它，**一场失业就能把你逼到在最低点卖光所有投资。** 它的收益率应该按\"保险\"来算，不是按理财。","提醒":"**别拿它去定投、别买定期、别买理财（赎回要 T+1 甚至更久）**。**要的是\"今天要用今天就有\"。** 工作越不稳定、负债越多，**这个数字该越大**（自由职业者建议留 6~12 个月）。"},"vs":[]},{"id":"标准普尔家庭资产象限图","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":3,"root":false,"x":829.87,"y":-1190.73,"f":{"一句话":"把家庭资产分成四份——**要花的钱、保命的钱、生钱的钱、保本升值的钱**。一个配置的参考模子。","例子":"10% 日常开销（活期/货基）、20% 保险、30% 股票基金等进取资产、40% 债券/存款等稳健资产。","误区":"**把它当标准答案**。**这只是一个粗糙的起点**——年轻人可承受的风险更高（生钱的钱可以多于 30%），**而收入不稳、负债重的人保本比例应该更高**。**照搬比例不如理解它背后的两个问题：这笔钱多久要用？亏多少我会睡不着？**","辨析":"（vs 资产配置）**象限图是配置的一个具体模板**，资产配置是**方法论**。**模板可以抄，但比例要自己调。**"},"vs":["资产配置"]},{"id":"保险配置顺序","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":3,"root":false,"x":-501.99,"y":-756.88,"f":{"一句话":"先给**赚钱的人**买，先买**保障型**（重疾、医疗、意外、定期寿险），**再考虑理财型**。","例子":"年收入 20 万的家庭，保费预算约 1~2 万（收入的 5%~10%）。**这笔钱先给赚钱的那个人买 50 万重疾 + 100 万定期寿险，剩下的才轮到孩子**——顺序反了，等于房子没打地基。","误区":"**最常见的错误顺序**——**给孩子买一堆保险，家里顶梁柱却\"裸奔\"**。**孩子出事，家庭收入还在；顶梁柱倒下，全家经济立刻断流。** 另一个错误是**先买理财型保险**（保费贵、保障低），把预算全占了。","辨析":"（vs 保险）这是**\"先买哪个\"的策略**，不是某个产品。**总预算有限时，顺序比单品选择重要得多。**","提醒":"**年保费总支出建议控制在年收入的 5%~10%**。**超过这个比例，说明你买的保障性价比低，或者买多了。**"},"vs":["保险"]},{"id":"追涨杀跌","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":5,"root":true,"x":2011.37,"y":-1146.93,"f":{"一句话":"涨了才敢买、跌了就慌忙卖。**这是最贵的本能。**","例子":"基金涨 30% 时冲进去，跌 20% 时割肉离场——**同一只基金，别人赚了你亏了**。统计显示，**基民的实际收益率普遍远低于基金本身的收益率**，差距主要来自这个。","误区":"**以为\"这是别人的毛病\"**。**几乎所有人都这么以为。** 而且它伪装得很好——**涨的时候买入感觉是\"确认趋势\"，跌的时候卖出感觉是\"控制风险\"**，每一步都很有道理，**合起来就是高买低卖**。","辨析":"（vs 羊群效应）**羊群效应是\"别人买我也买\"（从众）**，追涨杀跌是**\"涨了才买、跌了才卖\"（顺着价格走）**。**两者经常同时发生，互为因果。**"},"vs":["羊群效应"]},{"id":"损失厌恶","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":2,"root":true,"x":2326.19,"y":-1218.4,"f":{"一句话":"亏 100 元的痛苦，**大约等于赚 200~250 元的快乐**。所以人天生不愿认亏。","例子":"捡到 100 元的开心，**抵消不了**丢掉 100 元的难受——**这就是为什么很多人宁可套牢几年也不肯卖出**。","误区":"**以为\"套牢不卖就没亏\"**。**损失厌恶让你把\"卖出\"等同于\"承认失败\"**，于是宁愿假装没看见。**结果是：赚一点就跑（怕回吐），亏很多就扛（不肯认错）**——**正好和该做的完全相反。**","辨析":"（vs 追涨杀跌）**损失厌恶是心理根源，追涨杀跌是它导致的行为。** 因为怕亏，所以**跌了急着卖**；因为想快点确认赚，所以**涨一点就跑**。**根子在这。**","提醒":"**解药是\"把决策提前\"**——买入前就写好\"跌到多少卖、涨到多少卖\"。**别让情绪在盘中替你做决定。**"},"vs":["追涨杀跌"]},{"id":"羊群效应","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":3,"root":true,"x":2080.18,"y":-1611.31,"f":{"一句话":"别人买，我也买；别人慌，我也慌。**人多了会让人觉得安全，但市场里人多的地方最危险。**","例子":"某只基金登上热搜、身边人都在讨论时，**通常已经是涨幅的后半段了**。2007 年、2015 年、2021 年初的基金发行爆款，事后看**大多买在高点。**","误区":"**以为\"跟着大多数人走至少不会错得离谱\"**。**在投资里恰恰相反**——**当所有人都已经买进来了，就没有新增资金推动上涨了**。所谓\"人多的地方不要去\"。","辨析":"（vs 追涨杀跌）**羊群效应解释\"为什么买\"（大家都买），追涨杀跌描述\"什么时候买\"（涨了才买）。** 两者合起来就是**牛市顶部最典型的散户行为。**"},"vs":["追涨杀跌"]},{"id":"锚定效应","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":1,"root":true,"x":1611.95,"y":-1554.32,"f":{"一句话":"被一个无关的数字绑住——**通常是你的买入价**。","例子":"10 元买入，跌到 6 元。**\"等涨回 10 元我就卖\"**——但市场根本不知道你的成本是 10 元。**这只股票值不值得持有，和你的买入价毫无关系。**","误区":"**以为\"回本才卖\"是理性**。**这纯粹是心理账户在作祟。** 正确的问法是：**\"如果我今天手里是现金，我还会买它吗？\"** 如果答案是\"不会\"，**那就该卖，跟你亏没亏无关。**","提醒":"**锚定不止出现在成本价上**——\"这只基金净值 1 元很便宜\"\"房价从 8 万跌到 5 万很划算\"**都是锚**。**净值高低和贵不贵没有关系。**"},"vs":[]},{"id":"长期持有","kind":"term","fam":5,"cat":"L","catName":"策略与心理","deg":3,"root":false,"x":1811.77,"y":-720.89,"f":{"一句话":"拿得住，让复利有时间发挥作用。**它是普通人唯一确定有效的优势。**","例子":"沪深 300 从 2005 年到 2023 年，**任意时点买入并持有 1 年，亏损概率不低；持有 10 年，正收益概率大幅提升。**","误区":"**把\"长期持有\"当成\"买了就不管\"**。**长期持有是\"不因为短期波动而卖出\"，不是\"不看不调整\"**——该做的再平衡、该换的烂基金，**一样要做**。而且**它的前提是你买的东西本身是对的方向**——**死扛一只烂股票，那不叫长期持有，叫不认输。**","辨析":"（vs 追涨杀跌）**长期持有是解药，追涨杀跌是病。** 但**解药的前提是你能忍住**——**如果你一跌就失眠，那说明你的仓位太重了，要先降仓位，而不是硬扛。**"},"vs":["追涨杀跌"]},{"id":"央行","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":3,"root":true,"x":-31.22,"y":-264.18,"f":{"一句话":"管钱的部门——**发行人民币、定基准利率、管住整个金融系统**。中国人民银行（央行）不是商业银行，**它不跟你打交道**。","例子":"央行降息 **10 个基点**，LPR 跟着降，**100 万 30 年房贷的月供约少 60 元**。影响链条的源头在央行——但传导到你身上要等重定价日。","误区":"**以为\"央行降息=我的存款利率立刻降\"**。**传导要时间**，而且**存款利率降得比贷款利率慢**（银行要靠这个差价赚钱）。**降息周期里，存钱的人总是最后知道、最先受损。**","辨析":"（vs 商业银行）**央行是\"银行的银行\"**——商业银行没钱了找央行借，**央行不吸收普通人存款**。你存钱、贷款的那家是商业银行。"},"vs":["商业银行"]},{"id":"商业银行","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":5,"root":true,"x":185.35,"y":126.48,"f":{"一句话":"你存钱、贷款的那家银行。**它靠\"低息吸存、高息放贷\"赚差价。**","例子":"你存 1 万拿 1.5%，银行贷出去收 4%，**中间的 2.5% 就是它的毛利**。","误区":"**以为银行\"拿我的钱去投资亏了会连累我\"**。**不会**——**存款是银行的负债，不是它代你投资。** 就算银行破产，**50 万以内的存款有存款保险兜底**（同一银行、同一存款人本息合计）。","辨析":"（vs 央行）**央行定规则、印钱、当最后贷款人**；**商业银行做业务、赚利差、承担信用风险**。**一个是裁判，一个是球员。**"},"vs":["央行"]},{"id":"证券公司","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":3,"root":true,"x":-287.23,"y":132.1,"f":{"一句话":"开股票账户、买卖股票的地方。**它是通道，不是你的对手。**","例子":"你在券商 APP 上开个户，买卖股票时付佣金（**现在普遍万分之二到万分之三，最低 5 元**）。","误区":"**以为\"券商推荐的股票更靠谱\"**。**券商的研究报告是卖给机构客户的，不是给你的投资建议。** 而且**它同时做着自营和投行业务**——**利益冲突是结构性的**，不是某个员工操守问题。","辨析":"（vs 基金公司）**证券公司是交易的通道（你自己做决策）**；**基金公司是代你管理（你买基金，它做决策）**。**前者收佣金，后者收管理费。**"},"vs":["基金公司"]},{"id":"基金公司","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":5,"root":false,"x":-238.92,"y":362.79,"f":{"一句话":"管基金的公司。**它靠收管理费过日子，跟基金赚不赚钱关系不大。**","例子":"一只 100 亿的基金，管理费 1.5%/年 → **不管涨跌，基金公司每年稳收 1.5 亿**。","误区":"**以为\"基金公司和我利益一致\"**。**不完全一致**——**它的收入取决于规模，不是收益**。所以它有动力**拼命做大规模**（多发新基金、追热点），**而这往往损害老持有人的利益。** 这就是\"基金赚钱、基民不赚钱\"的制度原因之一。","辨析":"（vs 证券公司）**基金公司管钱（收管理费，与业绩弱挂钩）**，**证券公司做通道（收佣金，与交易量挂钩）**。**两个都不靠\"帮你赚钱\"吃饭。**"},"vs":["证券公司"]},{"id":"保险公司","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":3,"root":false,"x":-453.62,"y":-51.51,"f":{"一句话":"卖保险的公司。**它靠\"收上来的保费 > 赔出去的钱\"赚钱。**","例子":"收 100 亿保费、赔 60 亿，**剩下的除了运营成本就是利润**（还有投资收益）。","误区":"**以为\"保险公司靠拒赔赚钱\"**。**大公司恰恰相反**——**它靠的是\"大数法则\"：收足够多人的钱，赔少数出险的人**。真正的问题是**销售环节的误导**（把理财说成保障、把不确定的分红说成承诺），**理赔本身在监管下已相对规范。**","辨析":"（vs 基金公司）**保险公司承担风险（收保费、许诺赔付）**，**基金公司不承担风险（亏了是你的事）**。**这是两者最本质的区别。**"},"vs":["基金公司"]},{"id":"信托公司","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":2,"root":true,"x":128.61,"y":-91.35,"f":{"一句话":"卖信托计划的公司。**门槛高（通常 100 万起），过去靠\"刚兑\"吸引人。**","例子":"一个房地产信托，100 万起投，年化 8%。**听着很美——直到地产公司还不上钱。**","误区":"**以为\"信托有牌照就安全\"**。**牌照只说明它合法，不说明产品不亏。** 资管新规后**\"刚性兑付\"已被打破**——**信托计划是可以亏本金的**，近几年违约的信托产品不在少数。","辨析":"（vs 银行理财）**信托门槛高（100 万起）、期限长、流动性差、风险高**；**银行理财门槛低（1 元起）、期限灵活**。**别因为它们都在银行网点卖就以为是一回事。**"},"vs":["银行理财"]},{"id":"上交所","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":4,"root":false,"x":-1140.76,"y":-430.15,"f":{"一句话":"上海证券交易所。**主板 + 科创板在这里。**","例子":"代码 **6 开头**（主板 600/601/603/605，科创板 688）的股票在上交所。","误区":"**以为\"上交所和深交所只是地点不同\"**。**两个市场的定位和规则有差别**——比如**科创板（上交所）**和**创业板（深交所）**的上市标准、投资者门槛就不同。","辨析":"（vs 深交所）**上交所偏大盘蓝筹和硬科技**，**深交所偏中小盘和成长型企业**。**看代码开头就能分清在哪。**"},"vs":["深交所"]},{"id":"深交所","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":4,"root":false,"x":-905.74,"y":-408.81,"f":{"一句话":"深圳证券交易所。**主板 + 创业板在这里。**","例子":"代码 **0 开头**（主板 000/001）和 **3 开头**（创业板 300）的股票在深交所。","误区":"**以为\"创业板在深交所、科创板也在深交所\"**。**不对**——**创业板（300）在深交所，科创板（688）在上交所**。这两个最容易混。","辨析":"（vs 上交所）**创业板和科创板都允许未盈利企业上市，风险都比主板高**——**但开户门槛不同**（创业板需 2 年交易经验 + 10 万资产；科创板需 2 年 + 50 万资产）。"},"vs":["上交所"]},{"id":"一级市场","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":5,"root":false,"x":-1079.24,"y":-698.84,"f":{"一句话":"公司**第一次**把股票卖给投资者的市场。**钱进的是公司口袋。**","例子":"某公司 IPO 发行 1 亿股、每股 20 元，**募资 20 亿，这笔钱归公司**，用来扩产、还债。","误区":"**以为\"我能在一级市场买到便宜股票\"**。**打新（参与 IPO）确实是一级市场，但中签率极低**；而**所谓的\"原始股\"\"内部份额\"绝大多数是骗局**——**真的一级市场份额轮不到普通人。**","辨析":"（vs 二级市场）**一级市场是\"公司卖股票给你\"，钱给公司**；**二级市场是\"你卖股票给我\"，钱给另一个投资者**。**公司在一级市场拿到钱之后，二级市场怎么涨跌它都不再直接受益。**"},"vs":["二级市场"]},{"id":"二级市场","kind":"term","fam":4,"cat":"M","catName":"机构与市场","deg":4,"root":false,"x":-1127.51,"y":-1064.47,"f":{"一句话":"投资者之间互相买卖股票的市场。**你平时说的\"炒股\"，指的就是这里。**","例子":"你在 APP 上买入 100 股，**对手方是另一个投资者（或做市商），不是公司**。","误区":"**以为\"股票跌了公司就亏钱\"**。**不会**——**公司早就拿到钱了**（在一级市场）。二级市场的涨跌**影响的是股东的账面财富和公司的再融资能力**，不直接影响公司现金流。","辨析":"（vs 一级市场）**一级市场\"公司融资\"，二级市场\"股东变现\"**。**二级市场的核心作用是提供流动性**——**没有它，你买的股票就卖不出去。**"},"vs":["一级市场"]},{"id":"非法集资","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":6,"root":true,"x":262.0,"y":-1550.55,"f":{"一句话":"没有金融牌照，却向社会公开筹钱。**三条红线：未经批准、公开宣传、向不特定对象吸收资金。**","例子":"某公司以\"年化 12%、保本保息\"的名义向员工和街坊吸收存款——**这是典型的非法吸收公众存款罪**。","误区":"**以为\"有营业执照、有办公场地、老板上过电视就是合法的\"**。**营业执照≠金融牌照。** 判断的唯一标准是：**它有没有吸收公众存款的资质**——而这个资质，**全国只有银行等极少数机构有。**","辨析":"（vs 庞氏骗局）**非法集资是\"法律定性\"（没有牌照就筹钱）**，**庞氏骗局是\"资金运作方式\"（用后来人的钱付前面人的息）**。**庞氏骗局一定是非法集资，但非法集资不一定是庞氏**——有的非法集资是真的拿去投资了，只是亏了。","提醒":"**参与非法集资，损失自行承担**（法律明确规定，不受法律保护）。**别指望事后能追回来。**"},"vs":["庞氏骗局"]},{"id":"庞氏骗局","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":5,"root":false,"x":268.54,"y":-1943.51,"f":{"一句话":"用后来人的钱，付前面人的利息。**它没有真实业务，只要新人断档就立刻崩盘。**","例子":"承诺月息 2%（年化 24%）。**用 B 的钱付 A 的利息，用 C 的钱付 B 的**。一旦新增资金跟不上，**组织者跑路，最后一棒血本无归。**","误区":"**以为\"我早进场、赚了就跑就没事\"**。**理论上可以，实际上做不到**——因为**你无法判断自己是不是最后一棒**，而且骗局会**用\"追加投资才能提现\"来锁住你**。更关键的是：**参与庞氏骗局获利，在法律上属于不当得利，可能被追缴。**","辨析":"（vs 非法集资）**庞氏骗局的核心特征是没有真实盈利来源**——**你只要问一句\"它的钱从哪赚来的\"，答不上来就是庞氏。** 真正的投资，收益来自企业经营或资产增值，**不是来自新加入的人。**","提醒":"**看到\"高息 + 拉人头 + 层级返利\"，基本可以定性了。** 名字叫\"XX 理财\"\"XX 商城\"\"XX 互助\"都一样。"},"vs":["非法集资"]},{"id":"杀猪盘","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":2,"root":true,"x":498.93,"y":-2275.62,"f":{"一句话":"先跟你建立感情（恋爱、交友），再带你\"投资\"的骗局。**被骗的不只是钱，还有信任。**","例子":"典型路径——婚恋网站认识 → 聊一两个月感情升温 → 对方\"不经意\"提到自己靠某个平台赚钱 → 带你小额试水、**让你真赚到几次** → 你加大投入 → **平台无法提现、对方失联。** 全程通常 **1~3 个月**，**单个案件损失几十万到上百万很常见**——它是所有诈骗类型里人均损失最高的之一。","误区":"**以为\"我懂金融就不会被骗\"**。**杀猪盘打的不是金融知识，是情感需求**——**受害者里有大量高学历、高收入的人**。判断标准不是\"这个产品合不合理\"，而是**\"为什么一个素未谋面的人要带我赚钱\"**。","辨析":"（vs 庞氏骗局）**庞氏骗局靠\"高息\"吸引人，杀猪盘靠\"感情\"吸引人**。**后者更狠**——因为**你不仅损失钱，还会因为羞耻而不愿报警**，反而拖过追赃的黄金时间。","提醒":"**凡是\"稳赚\"\"内部渠道\"\"老师带单\"\"跟着操作就行\"的，一律是骗局。** 另外，**那些\"小额试水真能赚到\"的钱，是骗子故意给你的诱饵**，不是运气。"},"vs":["庞氏骗局"]},{"id":"飞单","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":3,"root":false,"x":351.06,"y":-791.54,"f":{"一句话":"银行、券商员工**私自卖别家公司的产品**，赚佣金。**出了事，银行不认账。**","例子":"你在银行网点，客户经理推荐一款\"年化 9%\"的产品，**合同上的发行方却不是这家银行**——这就是飞单。","误区":"**以为\"在银行买的，银行就得负责\"**。**飞单恰恰是要绕开这个**——**产品根本没在银行备案，钱也没进银行系统**，出了事银行可以完全不认。**你以为的\"银行背书\"，其实是那个人自己给你的。**","辨析":"（vs 非法集资）**飞单是\"违规销售\"，产品本身可能是合法的**（比如别的机构的私募）；**非法集资是产品本身就违法**。**但两者对你的伤害是一样的：钱可能拿不回来。**","提醒":"**怎么防？** ① **看合同上的发行方是谁**；② **在国家金融监督管理总局或中国理财网查产品编码**；③ **钱只能打给银行对公账户，绝不能打给个人账户**。"},"vs":["非法集资"]},{"id":"资金池","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":4,"root":false,"x":188.59,"y":-340.15,"f":{"一句话":"把很多人的钱混在一起，**说不清哪笔钱对应哪个项目**。**这是爆雷的结构性原因。**","例子":"某平台用 **3 个月期**产品的钱，去投 **3 年期**的项目——**期限错配**。只要新钱进不来，到期的旧产品就兑付不了，**一个环节断，全盘崩**。","误区":"**以为\"我的钱投的是那个具体项目，所以安全\"**。**资金池的本质就是让你无法对应**——**你以为的\"专款专用\"根本不存在。** 而且它**必然导致期限错配**（短钱投长项目），**挤兑一旦发生，谁都拿不回来。**","辨析":"（vs 净值型理财）**净值型产品每一份都对应真实的资产组合，价格每日公布、可追溯**；**资金池是个黑箱**——**你只知道投了多少钱，不知道钱在哪。** 资管新规的核心就是**禁止资金池、要求净值化管理。**","提醒":"**看合同里有没有明确的底层资产**。**只写\"投资于优质项目\"\"由专业团队管理\"而不写具体投向的，都要警惕。**"},"vs":["净值型理财"]},{"id":"自融","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":3,"root":false,"x":117.38,"y":-1098.71,"f":{"一句话":"平台把投资人的钱，**拿去给自己的关联公司用**。**左手募资、右手用钱。**","例子":"某 P2P 平台上线的借款项目，**借款方其实是平台老板自己控制的公司**——钱转一圈又回到他手里。","误区":"**以为\"平台上的项目都是独立的第三方\"**。**自融是最难识别的坑**——因为**借款方的工商信息可能经过层层包装，表面上看不出关联。** 而一旦平台自己缺钱，**它可以直接把投资人的钱挪走。**","辨析":"（vs 资金池）**资金池是\"钱混在一起\"，自融是\"钱被自己人拿走\"**。**两者经常一起出现**——**资金池提供了混同的便利，自融完成了最终的挪用。**","提醒":"**有个粗略的识别方法：如果平台上的借款方高度集中在某几个主体，或者借款方成立时间很短、注册资本很小、和平台在同一个地址，就要高度警惕。**"},"vs":["资金池"]},{"id":"保本保收益承诺","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":3,"root":false,"x":374.51,"y":-502.84,"f":{"一句话":"**资管新规之后，任何理财产品说\"保本保息\"都是违规的**（银行存款除外）。","例子":"销售说\"这个产品保本，年化 5%\"——**这句话本身就是违规证据**，可以直接举报。","误区":"**以为\"合同上写了就有效\"**。**即使写进合同，这个条款也可能被认定无效**——而且**如果产品真亏了，销售方要承担责任，但你的钱能不能拿回来是另一回事。** 更重要的是：**销售敢这么说，说明他要么不懂，要么不在乎合规——两种都不该信。**","辨析":"（vs 净值型理财）**净值型产品的本质就是\"不保本\"**（否则不需要净值），**它每天公布涨跌，亏了就是亏了。** 而**\"保本保收益\"这个说法在资管新规后已经退出历史舞台**——**现在唯一能说\"保本\"的，只有银行存款（50 万以内）和国债。**","提醒":"**听到这句话，最该做的不是心动，而是离开。**"},"vs":["净值型理财"]},{"id":"信息披露","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":3,"root":false,"x":-81.19,"y":44.92,"f":{"一句话":"该告诉你的，必须告诉你。**基金、上市公司都有强制的信息披露义务。**","例子":"基金**季报在每个季度结束后 15 个工作日内**披露、**年报在 90 日内**披露；上市公司发生重大事项必须**2 个交易日内**公告。**这些是你可以、也应该去查的。**","误区":"**只看收益率，不看披露文件**。**招募说明书里写清楚了费率、投资范围、风险提示**——**销售不会主动讲的部分，全在那里面。** 很多人买了几十万的基金，**从没看过一眼它的持仓。**","辨析":"（vs 投资者适当性）**信息披露是\"把信息给你\"（你有权知道）**，**投资者适当性是\"把合适的产品卖给你\"（卖方有义务匹配）**。**一个解决\"看不看得见\"，一个解决\"合不合适\"。**","提醒":"**在哪查？** 基金——**中国证监会指定信息披露平台、基金公司官网**；上市公司——**巨潮资讯网、交易所官网**。**别只看 APP 里的营销页。**"},"vs":["投资者适当性"]},{"id":"投资者适当性","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":4,"root":false,"x":167.77,"y":-556.78,"f":{"一句话":"**合适的产品卖给合适的人**。卖方有义务评估你的风险承受能力，不能把高风险产品卖给保守型投资者。","例子":"你去买私募或高风险理财，**必须先做风险测评问卷**。**如果你的测评结果是\"保守型\"，销售却卖给你 R5 产品，这是违规的。**","误区":"**以为\"风险测评随便填填就行\"**。**恰恰相反**——**它是你日后维权的关键证据。** 如果你如实填了\"保守型\"却被推销了高风险产品，**出了事你有明确的追责依据**；如果**你自己勾了\"激进型\"，那责任就很难说清了。**","辨析":"（vs 风险承受能力）**风险承受能力是你的属性**（测出来的：保守型/稳健型/激进型）；**投资者适当性是卖方的义务**（必须把合适的产品卖给合适的人）。**一个是\"你是谁\"，一个是\"它该怎么对你\"。**","提醒":"**别让销售替你填测评。** 这是最常见的违规操作，**也是出事时你最容易被反咬一口的地方。**"},"vs":["风险承受能力"]},{"id":"冷静期","kind":"term","fam":5,"cat":"N","catName":"防坑","deg":3,"root":false,"x":-285.14,"y":-343.75,"f":{"一句话":"买完产品后的一段反悔期，**期内可以无条件撤销**。**通常是几天。**","例子":"私募基金有 **24 小时投资冷静期**（募集完成后起算），期内可以解除合同；部分银行理财、信托产品也有类似安排。","误区":"**以为\"所有理财都有冷静期\"**。**不是**——**冷静期主要出现在私募、信托等高风险产品上，公募基金和银行理财通常没有。** 而且**它和保险的犹豫期不是一回事**。","辨析":"（vs 犹豫期）**犹豫期是保险特有的**（通常 15 天、期内全额退保）；**冷静期是资管产品的概念**（通常 24 小时、针对私募等）。**两者都是反悔权，但适用产品和时长完全不同。**","提醒":"**买之前先问清楚：这款产品有没有冷静期？多久？怎么行使？** 如果没有，那就等于**签字即生效，退出的唯一方式是卖出（可能亏损）。**"},"vs":["犹豫期"]},{"id":"个税优惠","kind":"cat","refs":1,"x":-1381.52,"y":-2135.62,"members":["专项附加扣除"]},{"id":"交易动作","kind":"cat","refs":2,"x":672.78,"y":2326.17,"members":["申购","赎回"]},{"id":"交易场所","kind": const FAM = ['var(--f0)','var(--f1)','var(--f2)','var(--f3)','var(--f4)','var(--f5)'];
/* 关系名直接用中文：graph_data.json 里的 r 就是「属于/前提/对比」（跟 md 同源），
   别在这里转成 CSS 名再比 —— 转过一次，filter 永远空，217 个词条的"它连着谁"全是"没有连线"。 */
const REL_ORDER = ['属于', '前提', '对比'];
const byId = new Map(D.nodes.map(n => [n.id, n]));

/* md 里只有 **粗体** 一种标记，转义在前、替换在后 */
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const color = n => n.kind === 'cat' ? 'var(--ink-3)' : FAM[n.fam];

/* ── 建图：先算每个节点的半径与邻接表 ── */
const NB = new Map(D.nodes.map(n => [n.id, []]));   // id -> [{other, rel}]
for (const l of D.links) {
  NB.get(l.s).push({other: l.t, rel: l.r});
  NB.get(l.t).push({other: l.s, rel: l.r});
}
const weight = n => n.kind === 'cat' ? 6 + 3.6 * Math.sqrt(n.refs) : 4.2 + 2.3 * Math.sqrt(n.deg);

const svg = document.getElementById('net');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const gLink = el('g', {}), gNode = el('g', {});
const gDim = el('g', {id: 'dim'});
gDim.append(gLink, gNode); svg.append(gDim);

/* ★坐标（n.x / n.y）是 build_graph.py 离线算好的，只在建元素时写一次；
   写在这里而不是 render() 里，是因为 render() 每点一次都要跑 289 个节点，
   而位置从不变化。
   ★少了这一句的后果不是"布局难看"，而是"整张图消失"：289 个节点、625 条边
   全落在 SVG 用户坐标的原点，fit() 一把视图居中，屏幕上只剩中心一个墨点
   —— 页头、图例、解释面板全都正常，所以从外观看像"页面好了、就是没有节点"。 */
const linkEls = D.links.map(l => {
  const a = byId.get(l.s), b = byId.get(l.t);
  const e = el('line', {class: 'link ' + (l.r === '属于' ? 'belong' : l.r === '前提' ? 'prereq' : 'contrast'),
                        x1: a.x, y1: a.y, x2: b.x, y2: b.y});
  e.__a = a; e.__b = b;
  gLink.append(e); return e;
});

const nodeEls = D.nodes.map(n => {
  const g = el('g', {class: 'node' + (n.kind === 'cat' ? ' cat' : ''), tabindex: 0,
                     role: 'button', 'aria-label': n.id});
  const c = el('circle', {cx: n.x, cy: n.y, r: weight(n), fill: color(n),
                          'fill-opacity': n.kind === 'cat' ? .1 : .92});
  const t = el('text', {class: 'lbl' + (n.deg >= 11 || n.kind === 'cat' ? ' big' : ''),
                        x: n.x, y: n.y, dy: weight(n) + 12});
  t.textContent = n.id;
  g.append(c, t);
  g.__n = n; g.__t = t;
  gNode.append(g); return g;
});

/* ── 视图变换：直接改 viewBox，比 transform 好写命中测试 ──
   ★单位就是屏幕像素：view.w == 画布像素宽 时 1 用户单位 = 1 像素，CSS 里写的
   10.5px 字号、1px 线宽、stroke 宽度才是它们字面上的尺寸。
   整张图有 5340 单位宽，缩进一屏只剩 0.13 像素/单位 —— 字会被压成 1.7px 的墨点
   （曾经的"看全图"就是这样，满屏灰糊看着像没有节点）。所以打开时先给 1:1 的那一屏。 */
const bb = (() => {
  const xs = D.nodes.map(n => n.x), ys = D.nodes.map(n => n.y);
  return {x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys)};
})();
const HOME = D.nodes.reduce((a, b) => weight(b) > weight(a) ? b : a);   // 最粗的那个圈：基金
let view = {x: 0, y: 0, w: 1, h: 1};
const PAD = 40;                                    // 「看全图」时四周留的屏幕像素
const applyView = () => svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
const scale = () => svg.clientWidth / view.w;      // 屏幕像素 / 用户单位
/* 最近一次的缩放比例。拖窗口时要按它重铺 —— 那时候 clientWidth 已经是新值，
   现算 scale() 会拿新的画布宽去配旧的 view.w，结果是窗口一变窄字就变小。 */
let pxPerUnit = 1;

/* 视图 = 以 (cx,cy) 为中心、每用户单位 s 像素铺满画布。viewBox 与画布永远同比例，
   所以图不会被拉变形，也不需要旧版那种"撑到同比例"的补丁。 */
function setView(cx, cy, s) {
  const cw = svg.clientWidth, ch = svg.clientHeight;
  if (!cw || !ch) return;
  view = {x: cx - cw / 2 / s, y: cy - ch / 2 / s, w: cw / s, h: ch / s};
  pxPerUnit = s;
  applyView(); render();
}

function home() { setView(HOME.x, HOME.y, 1); }    // 打开：真尺寸，落在「基金」上

function fit() {                                   // 看全图：整张图缩进一屏
  const cw = svg.clientWidth, ch = svg.clientHeight;
  if (!cw || !ch) return;
  const s = Math.min((cw - 2 * PAD) / (bb.x1 - bb.x0), (ch - 2 * PAD) / (bb.y1 - bb.y0));
  setView((bb.x0 + bb.x1) / 2, (bb.y0 + bb.y1) / 2, s);
}

/* ── 交互状态 ── */
let sel = null, famFilter = null;

const isFiltered = n => famFilter !== null && n.kind === 'term' && n.fam !== famFilter;
/* 这个圈上的字在屏幕上真有 8px 高吗。低于 8px 的中文就是一坨墨点，画出来只是噪声
   —— 全图缩略时整张图因此是干净的点阵，而不是一片灰糊。 */
function legible(n) {
  return (n.deg >= 11 || n.kind === 'cat' ? 12 : 10.5) * scale() >= 8;
}
/* 在眼前吗（按当前视图裁，不是按整张图）。 */
function onScreen(n) {
  return n.x >= view.x && n.x <= view.x + view.w && n.y >= view.y && n.y <= view.y + view.h;
}
/* 标签显隐的唯一判据。悬停处理器也用这一条算默认值，两处共用一个函数才不会各自漂移。
   ★"能读"是两件事：字够大（legible）**且**在眼前（onScreen）。
   只按 legible 放行的话，1:1 停在「基金」上时第一屏只有两个标签 —— 因为旧规则只放
   全局枢纽词（deg>=11），而基金旁边那些词恰恰度数都很小。可放大之后看的正是它们，
   它们反倒没名字，屏幕上就只剩线和点了（用户看到的就是这个）。
   反过来，看全图时 scale 小到 0.05，放开的标签全被 8px 那道闸拦下，缩略图照旧是
   干净的点阵 —— 两条闸各管一头，不会互相漏。 */
const lblShow = n => legible(n) && !isFiltered(n) && onScreen(n);

/* 三层明暗：选中的邻居全亮 → 其余压到 .13（由 CSS 的 #dim 规则兜底）→ 色族筛掉的压到 .1。
   标签全部由 JS 控制，所以 CSS 里不给 .lbl 写 dim 规则（行内样式本来也会赢）。 */
function render() {
  const nb = sel ? new Set([sel, ...NB.get(sel).map(x => x.other)]) : null;
  for (const e of linkEls) e.classList.toggle('on', !!sel && (e.__a.id === sel || e.__b.id === sel));
  for (const g of nodeEls) {
    const n = g.__n;
    const linked = !sel || nb.has(n.id);
    g.classList.toggle('on', sel === n.id);
    g.style.opacity = isFiltered(n) ? .1 : (linked ? 1 : '');
    g.__t.style.opacity = lblShow(n) ? (linked ? 1 : .12) : 0;
  }
  gDim.id = sel ? 'dim' : 'nodim';
}

function select(id, scroll) {
  sel = id;
  render();
  const p = document.getElementById('panel'), d = document.getElementById('detail');
  if (!id) {
    d.innerHTML = ''; document.getElementById('empty').hidden = false;
    p.classList.remove('up'); return;
  }
  document.getElementById('empty').hidden = true;
  d.innerHTML = panelHTML(byId.get(id));
  p.classList.add('up');
  if (scroll !== false) p.scrollTop = 0;
  const g = nodeEls.find(x => x.__n.id === id);
  if (g) g.parentNode.appendChild(g);          // 选中的节点提到最上层
}

function panelHTML(n) {
  if (n.kind === 'cat') {
    const ms = n.members.slice().sort((a, b) => byId.get(b).deg - byId.get(a).deg);
    return `<div class="head">
        <div class="eyebrow"><span class="sw" style="background:var(--ink-3)"></span>
          <span class="tag">分类</span><span>骨架节点</span></div>
        <h2>${esc(n.id)}</h2>
        <div class="why">这不是一个词条，而是一类东西的名字——图上 ${n.refs} 个词条挂在它下面。</div>
      </div>
      <div class="body"><div class="rel"><h3>属于它的词条（${n.refs}）</h3>
        <div class="catlist">${ms.map(m =>
          `<button data-go="${esc(m)}">${esc(m)}</button>`).join('')}</div></div></div>`;
  }

  const F = n.f;
  const field = (cls, k, v) => v ? `<div class="field ${cls}"><div class="k">${k}</div>
      <div class="v">${md(v)}</div></div>` : '';
  const rows = REL_ORDER.map(rel => {
    const list = NB.get(n.id).filter(x => x.rel === rel);
    if (!list.length) return '';
    const seen = new Set();
    const btns = list.filter(x => !seen.has(x.other) && seen.add(x.other))
      .map(x => `<button data-go="${esc(x.other)}">${esc(x.other)}</button>`).join('');
    return `<div class="row"><div class="rt">${rel}</div><div class="items">${btns}</div></div>`;
  }).join('');

  return `<div class="head">
      <div class="eyebrow"><span class="sw" style="background:${color(n)}"></span>
        <span class="tag">${n.cat}</span><span>${esc(n.catName)}</span>
        ${n.root ? '<span class="tag" title="没有前提，可以从它开始学">起点</span>' : ''}</div>
      <h2>${esc(n.id)}</h2>
      <div class="meta"><span>连接 ${n.deg} 个词</span>
        ${n.vs.length ? `<span>最易混：${esc(n.vs.join('、'))}</span>` : ''}</div>
    </div>
    <div class="body">
      ${field('f-one', '一句话', F['一句话'])}
      ${field('f-eg', '例子', F['例子'])}
      ${field('f-wrong', '误区', F['误区'])}
      ${field('f-vs', n.vs.length ? `辨析 · vs ${esc(n.vs.join('、'))}` : '辨析', F['辨析'])}
      ${field('f-note', '提醒', F['提醒'])}
      <div class="rel"><h3>它连着谁</h3>${rows || '<div class="v" style="color:var(--ink-3)">没有连线</div>'}</div>
    </div>`;
}

/* ── 事件 ── */
gNode.addEventListener('click', e => {
  const g = e.target.closest('.node'); if (g) select(g.__n.id);
});
gNode.addEventListener('keydown', e => {
  const g = e.target.closest('.node');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.__n.id); }
});
/* 悬停时标签的默认显隐要和 render() 用同一套判据（lblShow），
   否则开着色族筛选时鼠标一扫，被筛掉的标签会赖着亮、该亮的反而灭掉。 */
gNode.addEventListener('mouseover', e => {
  const g = e.target.closest('.node');
  if (g && !sel && legible(g.__n)) g.__t.style.opacity = 1;
});
gNode.addEventListener('mouseout', e => {
  const g = e.target.closest('.node');
  if (g && !sel) g.__t.style.opacity = lblShow(g.__n) ? 1 : 0;
});

document.getElementById('detail').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) select(b.dataset.go);
});
document.getElementById('close').onclick = () => select(null);
document.getElementById('reset').onclick = () => { fit(); select(null); };

/* 拖动平移 */
let drag = null;
svg.addEventListener('pointerdown', e => {
  if (e.target.closest('.node')) return;
  drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y};
  svg.classList.add('drag'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const s = view.w / svg.clientWidth;
  view.x = drag.vx - (e.clientX - drag.x) * s;
  view.y = drag.vy - (e.clientY - drag.y) * s;
  applyView();
});
const endDrag = e => {
  if (!drag) return;
  const moved = Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
  drag = null; svg.classList.remove('drag');
  if (moved < 4 && !e.target.closest('.node')) select(null);   // 空白处轻点 = 取消选中
};
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('drag'); });

/* 滚轮缩放（以指针为中心）。缩放会改 scale()，标签的可读性跟着变，
   所以要重算一次 render() —— 放大到 10.5px 以上，词才浮出来。 */
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const px = view.x + (e.clientX - r.left) / r.width * view.w;
  const py = view.y + (e.clientY - r.top) / r.height * view.h;
  const k = Math.exp(e.deltaY * 0.0013);
  view.w *= k; view.h *= k;
  view.x = px - (px - view.x) * k;
  view.y = py - (py - view.y) * k;
  applyView(); render();
}, {passive: false});

/* ── 图例 / 筛选 ── */
const legend = document.getElementById('legend');
const counts = D.families.map((f, i) => D.nodes.filter(n => n.kind === 'term' && n.fam === i).length);
D.families.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<span class="sw" style="background:${FAM[i]}"></span>${esc(f.name)}
                 <span class="n">${counts[i]}</span>`;
  b.onclick = () => {
    famFilter = famFilter === i ? null : i;
    [...legend.children].forEach((c, j) =>
      c.setAttribute('aria-pressed', String(famFilter === j)));
    render();
  };
  legend.append(b);
});

/* ── 搜索 ── */
const q = document.getElementById('q'), hits = document.getElementById('hits');
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { hits.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  const found = D.nodes.filter(n =>
    n.id.toLowerCase().includes(s) ||
    (n.kind === 'term' && (n.f['一句话'] || '').toLowerCase().includes(s)))
    .sort((a, b) => (a.id.toLowerCase().indexOf(s) - b.id.toLowerCase().indexOf(s))
                 || (b.deg - a.deg)).slice(0, 9);
  hits.innerHTML = found.length
    ? found.map(n => `<button data-go="${esc(n.id)}">${esc(n.id)}
        <span class="m">${n.kind === 'cat' ? '分类 ' + n.refs + ' 个词条' : esc(n.catName)}</span>
        </button>`).join('')
    : '<div class="none">没找到——试试更短的关键词</div>';
  hits.hidden = false; q.setAttribute('aria-expanded', 'true');
}
q.addEventListener('input', search);
q.addEventListener('focus', search);
hits.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { select(b.dataset.go); hits.hidden = true; q.value = ''; }
});
document.addEventListener('click', e => { if (!e.target.closest('#hits, #q')) hits.hidden = true; });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hits.hidden = true; q.blur(); }
  if (e.key === 'Enter') { const b = hits.querySelector('[data-go]'); if (b) { select(b.dataset.go); hits.hidden = true; } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

/* 窗口尺寸变了：保住缩放比例和中心（字的大小不该被拖窗口改掉），
   只把 viewBox 重新铺满新的画布。 */
window.addEventListener('resize', () =>
  setView(view.x + view.w / 2, view.y + view.h / 2, pxPerUnit));
home();
</script>
